<script>
/* Local state store. Holds everything a backend would own later (session, progress, settings).
   It is seeded from js/data/* and persisted to localStorage when the browser allows it.
   Phase 2: keep the same shape on the server and replace this file with API calls. */
(function (EL) {
  const KEY = "el.phase1.v2";
  const pad = (n) => String(n).padStart(2, "0");

  EL.dayKey = (d) => {
    d = d || new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  };
  EL.addDays = (key, n) => {
    const p = key.split("-").map(Number);
    return EL.dayKey(new Date(p[0], p[1] - 1, p[2] + n));
  };

  function seed() {
    return {
      v: 2,
      session: { loggedIn: false, role: "student", adminAuthed: false, studentId: "" },
      // every student who signed up on this device, each with his or her own progress (phase 2: a server table)
      students: [],
      admin: { pw: "" }, // admin password (kept on this device only in phase 1)
      student: Object.assign({}, EL.data.student.profile),
      completed: {},
      quizResults: [],
      activeDates: [],
      minutes: {},
      bestStreak: 0,
      // what the teacher/owner types in: lessons and quiz questions (kept apart from learner progress)
      content: { lessons: [], quizzes: { beginner: [], elementary: [], intermediate: [], advanced: [], exam: [] } },
      settings: {
        language: "both",
        notifications: { daily: true, time: "18:00", streak: true, newLessons: true, weekly: false }
      }
    };
  }

  let state = null;

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.v === 2 && s.content) {
          s.session = Object.assign({ loggedIn: false, role: "student", adminAuthed: false, studentId: "" }, s.session);
          s.admin = s.admin || { pw: "" };
          if (!Array.isArray(s.students)) {
            // older save: the single learner becomes the first student record
            s.students = [];
            if (s.student && s.student.email) {
              const id = EL.newId("s");
              s.students.push({ id, name: s.student.name, email: s.student.email, pw: "", joined: EL.dayKey(), lastSeen: EL.dayKey(), dailyGoal: s.student.dailyGoal || 15,
                completed: s.completed || {}, quizResults: s.quizResults || [], activeDates: s.activeDates || [], minutes: s.minutes || {}, bestStreak: s.bestStreak || 0 });
              if (s.session.loggedIn && s.session.role === "student") s.session.studentId = id;
            }
          }
          return s;
        }
      }
    } catch (e) { /* storage blocked: use in-memory state */ }
    return seed();
  }

  // Keeps the signed-in student's record equal to the working copy the screens read and change.
  function sync(s) {
    const id = s.session && s.session.studentId;
    if (!id) return;
    const r = s.students.find((x) => x.id === id);
    if (!r) return;
    r.name = s.student.name; r.email = s.student.email; r.dailyGoal = s.student.dailyGoal;
    r.completed = s.completed; r.quizResults = s.quizResults; r.activeDates = s.activeDates; r.minutes = s.minutes; r.bestStreak = s.bestStreak;
    if (s.activeDates.length) r.lastSeen = s.activeDates[s.activeDates.length - 1];
  }

  function save() {
    if (state) sync(state);
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    if (state && EL.cloud) EL.cloud.onSave(state); // phase 2: send the student's progress to the server
  }

  EL.newId = (prefix) => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

  // Empties the working progress (the learner's record is untouched unless it was synced before).
  EL.blankProgress = (s) => { s.completed = {}; s.quizResults = []; s.activeDates = []; s.minutes = {}; s.bestStreak = 0; };

  EL.store = {
    get() { if (!state) state = load(); return state; },
    update(fn) { fn(this.get()); save(); },
    // Clears learner progress; the typed-in content is kept unless `withContent` is true.
    reset(withContent) {
      const keep = !withContent && state && state.content ? state.content : null;
      const admin = state && state.admin ? state.admin : null;
      const students = state && state.students ? state.students : null;
      state = seed();
      if (keep) state.content = keep;
      if (admin) state.admin = admin;
      if (students) state.students = students;
      save();
      return state;
    },
    exportAll() { return JSON.stringify({ app: "english-learning", v: 2, content: this.get().content }); }
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* The one place the screens ask for data.
   Every function here reads from the local store today. In phase 2, replace the bodies with
   requests to the backend (make them async) and the screens keep working unchanged. */
(function (EL) {
  const D = EL.data;
  const st = () => EL.store.get();
  const today = () => EL.dayKey();

  const allLessons = () => st().content.lessons;
  const lessonsOf = (levelId) => allLessons().filter((l) => l.level === levelId);
  const isDone = (id) => !!st().completed[id];
  const withDone = (l) => Object.assign({}, l, { done: isDone(l.id) });
  const levelTitle = (id) => (D.levels.find((l) => l.id === id) || {}).title || "";

  function currentLevelId() {
    const lv = D.levels.find((l) => lessonsOf(l.id).some((x) => !isDone(x.id)));
    if (lv) return lv.id;
    // every lesson done (or none yet): the last level that has lessons, else the first level
    const filled = D.levels.filter((l) => lessonsOf(l.id).length);
    return filled.length ? filled[filled.length - 1].id : D.levels[0].id;
  }

  function levelInfo(lv) {
    const ls = lessonsOf(lv.id).map(withDone);
    const done = ls.filter((l) => l.done).length;
    return Object.assign({}, lv, {
      lessons: ls, done, total: ls.length,
      pct: ls.length ? Math.round((done / ls.length) * 100) : 0,
      minutes: ls.reduce((a, l) => a + l.minutes, 0),
      isCurrent: lv.id === currentLevelId()
    });
  }

  function streakOf(s) {
    const set = new Set(s.activeDates);
    let k = set.has(today()) ? today() : EL.addDays(today(), -1);
    let n = 0;
    while (set.has(k)) { n++; k = EL.addDays(k, -1); }
    return n;
  }

  function bestStreakOf(s) {
    const days = Array.from(new Set(s.activeDates)).sort();
    let best = 0, run = 0, prev = null;
    days.forEach((d) => {
      run = prev && EL.addDays(prev, 1) === d ? run + 1 : 1;
      best = Math.max(best, run);
      prev = d;
    });
    return Math.max(best, s.bestStreak || 0);
  }

  function quizBest(quizId) {
    const rs = st().quizResults.filter((r) => r.quizId === quizId);
    if (!rs.length) return null;
    return Math.max.apply(null, rs.map((r) => Math.round((r.score / r.total) * 100)));
  }

  function badgeState(b) {
    const s = st();
    const r = b.rule;
    let value = 0, target = 1;
    if (r.type === "lessons") { value = Object.keys(s.completed).length; target = r.n; }
    else if (r.type === "streak") { value = bestStreakOf(s); target = r.n; }
    else if (r.type === "level") { const ls = lessonsOf(r.id); value = ls.filter((l) => isDone(l.id)).length; target = Math.max(1, ls.length); }
    else if (r.type === "perfect") { value = s.quizResults.some((x) => x.score === x.total) ? 1 : 0; }
    else if (r.type === "exam") { value = quizBest("exam") || 0; target = r.pct; }
    return Object.assign({}, b, { value: Math.min(value, target), target, earned: value >= target });
  }
  const earnedIds = () => D.badges.map(badgeState).filter((b) => b.earned).map((b) => b.id);

  // Quiz definition from data + the questions typed in by the owner.
  function quizOf(id) {
    const q = D.quizzes[id];
    return q ? Object.assign({}, q, { questions: (st().content.quizzes[id] || []).slice() }) : null;
  }

  function hashPw(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "h" + h;
  }

  function markActive(minutes) {
    EL.store.update((s) => {
      const t = today();
      if (s.activeDates.indexOf(t) === -1) s.activeDates.push(t);
      s.minutes[t] = (s.minutes[t] || 0) + minutes;
    });
  }

  function dowOf(key) {
    const p = key.split("-").map(Number);
    return (new Date(p[0], p[1] - 1, p[2]).getDay() + 6) % 7; // Monday = 0
  }

  // Makes a student the signed-in learner: the screens read and change this working copy of the record.
  function enter(s, rec) {
    Object.assign(s.session, { loggedIn: true, role: "student", adminAuthed: false, studentId: rec.id });
    s.student = Object.assign({}, D.student.profile, { name: rec.name, email: rec.email, dailyGoal: rec.dailyGoal || 15 });
    s.completed = rec.completed || (rec.completed = {});
    s.quizResults = rec.quizResults || (rec.quizResults = []);
    s.activeDates = rec.activeDates || (rec.activeDates = []);
    s.minutes = rec.minutes || (rec.minutes = {});
    s.bestStreak = rec.bestStreak || 0;
    rec.lastSeen = today();
  }
  // Leaves the learner (or admin) screens with nobody's progress in the working copy.
  function leave(s) {
    s.session.studentId = "";
    s.student = Object.assign({}, D.student.profile);
    EL.blankProgress(s);
  }

  // Phase 1: students who signed up on this device. Phase 2: every student on the server (kept fresh by cloud.js).
  const studentRecords = () => (EL.cloud && EL.cloud.enabled() && EL.cloud.hasSession() ? EL.cloud.studentRecords().slice() : st().students.slice().reverse());
  const touchContent = () => { if (EL.cloud) EL.cloud.contentChanged(); };

  // How far one student has got, counted against the lessons that exist now.
  function studentView(r) {
    const ids = allLessons().map((l) => l.id);
    const doneIds = ids.filter((id) => r.completed && r.completed[id]);
    const best = {};
    (r.quizResults || []).forEach((q) => {
      if (!q.total) return;
      const pc = Math.round((q.score / q.total) * 100);
      if (!(q.quizId in best) || pc > best[q.quizId]) best[q.quizId] = pc;
    });
    const scores = Object.keys(best).map((k) => best[k]);
    const mins = Object.keys(r.minutes || {}).reduce((a, k) => a + (r.minutes[k] || 0), 0);
    return {
      id: r.id, name: r.name, email: r.email, joined: r.joined, lastSeen: r.lastSeen,
      done: doneIds.length, total: ids.length, pct: ids.length ? Math.round((doneIds.length / ids.length) * 100) : 0,
      doneIds, quizzesTaken: scores.length, avgScore: scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null,
      streak: streakOf({ activeDates: r.activeDates || [] }), minutes: mins,
      activeToday: (r.activeDates || []).indexOf(today()) > -1
    };
  }

  EL.api = {
    /* ── session ── */
    isLoggedIn() { return !!st().session.loggedIn; },
    // Returns "ok", "none" (no such email) or "wrong" (wrong password).
    login(email, pw) {
      const e = String(email || "").trim().toLowerCase();
      const r = st().students.find((x) => String(x.email).toLowerCase() === e);
      if (!r) return "none";
      if (r.pw && r.pw !== hashPw(pw || "")) return "wrong";
      EL.store.update((s) => enter(s, s.students.find((x) => x.id === r.id)));
      return "ok";
    },
    // Returns "ok" or "exists" (that email already has an account).
    signup(p) {
      const e = String(p.email || "").trim().toLowerCase();
      if (st().students.some((x) => String(x.email).toLowerCase() === e)) return "exists";
      EL.store.update((s) => {
        const rec = { id: EL.newId("s"), name: p.name, email: p.email, pw: hashPw(p.password || ""), joined: today(), lastSeen: today(), dailyGoal: 15, completed: {}, quizResults: [], activeDates: [], minutes: {}, bestStreak: 0 };
        s.students.push(rec);
        enter(s, rec);
      });
      return "ok";
    },
    logout() { if (EL.cloud) EL.cloud.signOut(); EL.store.update((s) => { Object.assign(s.session, { loggedIn: false, role: "student", adminAuthed: false }); leave(s); }); },
    // used by js/services/cloud.js when a server account signs in
    _enter: enter, _leave: leave,

    /* ── admin (the person who adds lessons). Phase 1: the password is only a local lock; real
       accounts and permissions come with the backend. ── */
    isAdmin() { const s = st().session; return !!s.loggedIn && s.role === "admin"; },
    canManage() { return !!st().session.adminAuthed; },       // true for the admin, also while previewing the student app
    hasAdminPassword() { return !!st().admin.pw; },
    createAdmin(pw) { EL.store.update((s) => { s.admin.pw = hashPw(pw); Object.assign(s.session, { loggedIn: true, role: "admin", adminAuthed: true }); leave(s); }); },
    adminLogin(pw) {
      if (!st().admin.pw || st().admin.pw !== hashPw(pw)) return false;
      EL.store.update((s) => { Object.assign(s.session, { loggedIn: true, role: "admin", adminAuthed: true }); leave(s); });
      return true;
    },
    resetAdminPassword() { EL.store.update((s) => { s.admin.pw = ""; }); },
    setRole(role) { EL.store.update((s) => { if (s.session.adminAuthed) s.session.role = role; }); },
    // Both clear learner progress only; lessons and quiz questions that were typed in are kept.
    resetDemo() { EL.store.update((s) => { EL.blankProgress(s); }); },
    // Returns a promise ({ ok }): with a server the account is deleted there first.
    deleteAccount() {
      const local = () => EL.store.update((s) => {
        const id = s.session.studentId;
        leave(s);
        s.students = s.students.filter((x) => x.id !== id);
        Object.assign(s.session, { loggedIn: false, role: "student", adminAuthed: false });
      });
      if (EL.cloud && EL.cloud.enabled() && EL.cloud.hasSession()) {
        return EL.cloud.deleteMe().then((r) => { if (r.ok) local(); return r; });
      }
      local();
      return Promise.resolve({ ok: true });
    },

    /* ── students (what the admin sees). Phase 1: only people who signed up on this device. ── */
    getStudents() { return studentRecords().map(studentView); },
    getStudentSummary() {
      const list = studentRecords().map(studentView);
      const wk = EL.addDays(today(), -6);
      return {
        count: list.length,
        completions: list.reduce((a, x) => a + x.done, 0),
        avgPct: list.length ? Math.round(list.reduce((a, x) => a + x.pct, 0) / list.length) : 0,
        activeToday: list.filter((x) => x.activeToday).length,
        activeWeek: list.filter((x) => x.lastSeen && x.lastSeen >= wk).length,
        total: allLessons().length
      };
    },
    getStudentDetail(id) {
      const r = studentRecords().find((x) => x.id === id);
      if (!r) return null;
      const v = studentView(r);
      const lessons = allLessons().map((l) => ({ id: l.id, title: l.title, type: l.type, level: l.level, levelTitle: levelTitle(l.level), doneOn: (r.completed && r.completed[l.id]) || "" }));
      const quizzes = (r.quizResults || []).slice(-8).reverse().map((q) => ({ quizId: q.quizId, title: (D.quizzes[q.quizId] || {}).title || q.quizId, pct: q.total ? Math.round((q.score / q.total) * 100) : 0, score: q.score, total: q.total, date: q.date }));
      return Object.assign(v, { lessons, quizzes });
    },
    // Returns a promise ({ ok }) because with a server the removal happens there.
    removeStudent(id) {
      if (EL.cloud && EL.cloud.enabled() && EL.cloud.hasSession()) return EL.cloud.removeStudent(id);
      EL.store.update((s) => { s.students = s.students.filter((x) => x.id !== id); });
      return Promise.resolve({ ok: true });
    },

    /* ── student & settings ── */
    getStudent() {
      const s = st();
      const lv = D.levels.find((l) => l.id === currentLevelId());
      return Object.assign({}, s.student, { firstName: s.student.name.split(" ")[0], level: lv });
    },
    updateStudent(patch) { EL.store.update((s) => Object.assign(s.student, patch)); },
    getSettings() { return st().settings; },
    setLanguage(lang) { EL.store.update((s) => { s.settings.language = lang; }); },
    setNotifications(patch) { EL.store.update((s) => Object.assign(s.settings.notifications, patch)); },

    /* ── courses & lessons ── */
    getLevels() { return D.levels.map(levelInfo); },
    getLevel(id) { const lv = D.levels.find((l) => l.id === id); return lv ? levelInfo(lv) : null; },
    getLesson(id) {
      const l = allLessons().find((x) => x.id === id);
      return l ? Object.assign(withDone(l), { levelTitle: levelTitle(l.level) }) : null;
    },
    getLessonsByType(type) {
      return allLessons().filter((l) => l.type === type).map((l) => Object.assign(withDone(l), { levelTitle: levelTitle(l.level) }));
    },
    getTodayLesson() {
      const cur = lessonsOf(currentLevelId()).find((l) => !isDone(l.id));
      const any = cur || allLessons().find((l) => !isDone(l.id));
      return any ? Object.assign(withDone(any), { levelTitle: levelTitle(any.level) }) : null;
    },
    getUpNext(n) {
      const t = this.getTodayLesson();
      return lessonsOf(currentLevelId()).filter((l) => !isDone(l.id) && (!t || l.id !== t.id)).slice(0, n).map(withDone);
    },
    getNextLesson(id) {
      const l = allLessons().find((x) => x.id === id);
      if (!l) return null;
      const ls = lessonsOf(l.level);
      const nxt = ls[ls.findIndex((x) => x.id === id) + 1];
      return nxt ? withDone(nxt) : null;
    },
    completeLesson(id) {
      const lesson = allLessons().find((x) => x.id === id);
      if (!lesson) return { newBadges: [] };
      const before = earnedIds();
      if (!isDone(id)) {
        EL.store.update((s) => { s.completed[id] = today(); });
        markActive(lesson.minutes || 0);
      } else {
        markActive(0);
      }
      const after = earnedIds();
      return { newBadges: D.badges.filter((b) => after.indexOf(b.id) > -1 && before.indexOf(b.id) === -1) };
    },

    /* ── quizzes ── */
    getQuizzes() {
      return ["beginner", "elementary", "intermediate", "advanced", "exam"].map((id) => {
        const q = quizOf(id);
        return Object.assign({}, q, {
          count: q.questions.length, best: quizBest(id),
          attempts: st().quizResults.filter((r) => r.quizId === id).length
        });
      });
    },
    getQuiz(id) { return quizOf(id); },
    saveQuizResult(r) {
      const before = earnedIds();
      EL.store.update((s) => { s.quizResults.push({ quizId: r.quizId, score: r.score, total: r.total, date: today() }); });
      markActive(r.quizId === "exam" ? 10 : 5);
      const after = earnedIds();
      return { newBadges: D.badges.filter((b) => after.indexOf(b.id) > -1 && before.indexOf(b.id) === -1) };
    },

    /* ── content (typed in by the owner) ── */
    getAllLessons() { return allLessons().map((l) => Object.assign(withDone(l), { levelTitle: levelTitle(l.level) })); },
    saveLesson(lesson) {
      const id = lesson.id || "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      const item = Object.assign({}, lesson, { id });
      EL.store.update((s) => {
        const i = s.content.lessons.findIndex((x) => x.id === id);
        if (i > -1) s.content.lessons[i] = item; else s.content.lessons.push(item);
      });
      touchContent();
      return item;
    },
    deleteLesson(id) {
      EL.store.update((s) => {
        s.content.lessons = s.content.lessons.filter((x) => x.id !== id);
        delete s.completed[id];
        s.students.forEach((r) => { if (r.completed) delete r.completed[id]; });
      });
      touchContent();
    },
    // Move a lesson up (-1) or down (+1) among the lessons of its own level.
    moveLesson(id, dir) {
      EL.store.update((s) => {
        const all = s.content.lessons;
        const me = all.find((x) => x.id === id);
        if (!me) return;
        const same = all.filter((x) => x.level === me.level);
        const j = same.indexOf(me) + dir;
        if (j < 0 || j >= same.length) return;
        const a = all.indexOf(me), b = all.indexOf(same[j]);
        all[a] = same[j]; all[b] = me;
      });
      touchContent();
    },
    setQuizQuestions(id, questions) { EL.store.update((s) => { s.content.quizzes[id] = questions; }); touchContent(); },
    exportContent() { return EL.store.exportAll(); },
    importContent(text) {
      let data;
      try { data = JSON.parse(text); } catch (e) { return false; }
      const c = data && data.content;
      if (!c || !Array.isArray(c.lessons) || !c.quizzes || typeof c.quizzes !== "object") return false;
      EL.store.update((s) => {
        s.content.lessons = c.lessons;
        Object.keys(s.content.quizzes).forEach((k) => { s.content.quizzes[k] = Array.isArray(c.quizzes[k]) ? c.quizzes[k] : []; });
      });
      touchContent();
      return true;
    },

    /* ── progress ── */
    getProgress() {
      const s = st();
      const t = today();
      const total = allLessons().length;
      const done = Object.keys(s.completed).length;
      const mondayKey = EL.addDays(t, -dowOf(t));
      const letters = ["M", "T", "W", "T", "F", "S", "S"];
      const week = letters.map((label, i) => {
        const key = EL.addDays(mondayKey, i);
        return { key, label, min: s.minutes[key] || 0, isToday: key === t, future: key > t };
      });
      const active = new Set(s.activeDates);
      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const key = EL.addDays(t, -i);
        last7.push({ key, label: letters[dowOf(key)], active: active.has(key), isToday: i === 0 });
      }
      const quizzes = this.getQuizzes();
      const taken = quizzes.filter((q) => q.best !== null);
      return {
        done, total, pct: total ? Math.round((done / total) * 100) : 0,
        streak: streakOf(s), bestStreak: bestStreakOf(s),
        minutesToday: s.minutes[t] || 0, dailyGoal: s.student.dailyGoal,
        week, last7,
        levels: this.getLevels(),
        quizzes,
        avgScore: taken.length ? Math.round(taken.reduce((a, q) => a + q.best, 0) / taken.length) : null,
        recent: s.quizResults.slice(-5).reverse().map((r) => Object.assign({}, r, { title: D.quizzes[r.quizId].title, so: D.quizzes[r.quizId].so, pct: Math.round((r.score / r.total) * 100) })),
        badges: D.badges.map(badgeState)
      };
    }
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* Phase 2: talks to the Supabase server (accounts, lessons, quizzes, progress) with plain fetch calls.
   Nothing here is used until a server is connected (EL.cloud.enabled()); until then the app keeps working
   on this device only, exactly like phase 1. The screens never call this file directly except the sign-in forms,
   the Server screen and the admin students list; everything else still goes through js/services/api.js,
   which reads a local copy that this file keeps in step with the server. */
(function (EL) {
  const CK = "el.cloud.v1"; // server address, key, sign-in tokens, unsent changes (own key, survives "reset progress")
  let mem = null;
  const box = () => {
    if (mem) return mem;
    try { mem = JSON.parse(window.localStorage.getItem(CK) || "null"); } catch (e) { mem = null; }
    return (mem = mem || {});
  };
  const persist = () => { try { window.localStorage.setItem(CK, JSON.stringify(box())); } catch (e) { /* ignore */ } };

  const baked = () => !!(EL.config && EL.config.supabaseUrl && EL.config.supabaseKey);
  const cfg = () => (baked() ? { url: EL.config.supabaseUrl, key: EL.config.supabaseKey } : { url: box().url || "", key: box().key || "" });
  const cleanUrl = (u) => String(u || "").trim().replace(/\/+$/, "");
  const enabled = () => { const c = cfg(); return !!(c.url && c.key); };
  const session = () => box().session || null;
  const today = () => EL.dayKey();
  const st = () => EL.store.get();
  const q = (v) => encodeURIComponent(v);

  /* ───────── http ───────── */
  function http(method, path, body, o) {
    o = o || {};
    const c = cfg();
    const h = { apikey: c.key, "Content-Type": "application/json" };
    const tok = o.anon ? null : session() && session().access;
    if (tok) h.Authorization = "Bearer " + tok;
    else if (/^eyJ/.test(c.key)) h.Authorization = "Bearer " + c.key;
    if (o.prefer) h.Prefer = o.prefer;
    return fetch(c.url + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) }).then(
      (r) => r.text().then((t) => {
        let d = null;
        try { d = t ? JSON.parse(t) : null; } catch (e) { d = t; }
        return { ok: r.ok, status: r.status, data: d };
      }),
      () => ({ ok: false, status: 0, data: null, network: true })
    );
  }

  function setSession(d) {
    const b = box();
    b.session = { access: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in || 3600) * 1000, uid: d.user && d.user.id ? d.user.id : (b.session && b.session.uid) || "" };
    persist();
  }
  function clearSession() { const b = box(); delete b.session; persist(); }

  let refreshing = null;
  function refresh() {
    if (refreshing) return refreshing;
    const s = session();
    if (!s || !s.refresh) return Promise.resolve("auth");
    refreshing = http("POST", "/auth/v1/token?grant_type=refresh_token", { refresh_token: s.refresh }, { anon: true }).then((r) => {
      refreshing = null;
      if (r.ok && r.data && r.data.access_token) { setSession(r.data); return "ok"; }
      if (r.network || r.status >= 500) return "network";
      clearSession();
      return "auth";
    });
    return refreshing;
  }
  function fresh() {
    const s = session();
    if (s && s.exp - Date.now() < 60000) return refresh();
    return Promise.resolve("ok");
  }
  // A request with the signed-in user's token; one retry after refreshing an expired token.
  function authed(method, path, body, o) {
    o = o || {};
    return fresh().then(() =>
      http(method, path, body, o).then((r) => {
        if (r.status === 401 && !o.retried) {
          return refresh().then((x) => (x === "ok" ? authed(method, path, body, Object.assign({}, o, { retried: true })) : r));
        }
        return r;
      })
    );
  }
  const msgOf = (r) => (r && r.data && (r.data.error_description || r.data.msg || r.data.message || r.data.error)) || "";

  /* ───────── merging progress (local copy + server copy) ───────── */
  function mergeProgress(a, b) {
    const out = { completed: {}, quizResults: [], activeDates: [], minutes: {}, bestStreak: Math.max(a.bestStreak || 0, b.bestStreak || 0) };
    [a, b].forEach((x) => {
      const c = x.completed || {};
      Object.keys(c).forEach((k) => { if (!out.completed[k] || c[k] < out.completed[k]) out.completed[k] = c[k]; });
      const m = x.minutes || {};
      Object.keys(m).forEach((k) => { out.minutes[k] = Math.max(out.minutes[k] || 0, m[k] || 0); });
    });
    const seen = {};
    [a, b].forEach((x) => (x.quizResults || []).forEach((r) => {
      const key = r.quizId + "|" + r.date + "|" + r.score + "|" + r.total;
      if (!seen[key]) { seen[key] = 1; out.quizResults.push(r); }
    }));
    const days = {};
    [a, b].forEach((x) => (x.activeDates || []).forEach((d) => { days[d] = 1; }));
    out.activeDates = Object.keys(days).sort();
    return out;
  }
  const sameProgress = (a, b) => JSON.stringify([a.completed, a.quizResults, a.activeDates, a.minutes, a.bestStreak || 0]) === JSON.stringify([b.completed, b.quizResults, b.activeDates, b.minutes, b.bestStreak || 0]);

  function recFrom(p, g) {
    g = g || {};
    return {
      id: p.id, name: p.name || "", email: p.email || "", pw: "", joined: p.joined || today(), lastSeen: p.last_seen || "", dailyGoal: p.daily_goal || 15,
      completed: g.completed || {}, quizResults: g.quiz_results || [], activeDates: g.active_dates || [], minutes: g.minutes || {}, bestStreak: g.best_streak || 0
    };
  }

  /* ───────── screen refresh after data arrives ───────── */
  function safeRefresh() {
    const r = String(EL.app.route() || "");
    const name = r.split("-")[0];
    if (["home", "courses", "course", "quizzes", "progress", "profile", "content", "students"].indexOf(name) > -1) EL.app.refresh();
  }

  /* ───────── content (lessons and quizzes) ───────── */
  function pullContent() {
    return Promise.all([authed("GET", "/rest/v1/lessons?select=*&order=position.asc"), authed("GET", "/rest/v1/quizzes?select=*")]).then((rs) => {
      const l = rs[0], z = rs[1];
      if (!l.ok || !z.ok || !Array.isArray(l.data) || !Array.isArray(z.data)) return { ok: false };
      const lessons = l.data.map((row) => Object.assign({}, row.data, { id: row.id, level: row.level, type: row.type }));
      const before = JSON.stringify(st().content);
      EL.store.update((s) => {
        s.content.lessons = lessons;
        Object.keys(s.content.quizzes).forEach((k) => { s.content.quizzes[k] = []; });
        z.data.forEach((row) => { if (Array.isArray(s.content.quizzes[row.id]) || s.content.quizzes[row.id] === undefined) s.content.quizzes[row.id] = Array.isArray(row.questions) ? row.questions : []; });
      });
      const changed = before !== JSON.stringify(st().content);
      if (changed) safeRefresh();
      return { ok: true, changed };
    });
  }

  let pushTimer = null;
  function pushContent() {
    const b = box();
    const c = st().content;
    return authed("GET", "/rest/v1/lessons?select=id").then((ex) => {
      if (!ex.ok || !Array.isArray(ex.data)) return false;
      const rows = c.lessons.map((l, i) => ({ id: l.id, level: l.level, type: l.type, position: i, data: l }));
      const keep = {};
      rows.forEach((r) => { keep[r.id] = 1; });
      const gone = ex.data.map((r) => r.id).filter((id) => !keep[id]);
      const up = rows.length ? authed("POST", "/rest/v1/lessons?on_conflict=id", rows, { prefer: "resolution=merge-duplicates,return=minimal" }) : Promise.resolve({ ok: true });
      return up.then((r1) => {
        if (!r1.ok) return false;
        const del = gone.length ? authed("DELETE", "/rest/v1/lessons?id=in.(" + gone.map((id) => '"' + q(id) + '"').join(",") + ")", undefined, { prefer: "return=minimal" }) : Promise.resolve({ ok: true });
        return del.then((r2) => {
          if (!r2.ok) return false;
          const qs = Object.keys(c.quizzes).map((id) => ({ id, questions: c.quizzes[id] }));
          return authed("POST", "/rest/v1/quizzes?on_conflict=id", qs, { prefer: "resolution=merge-duplicates,return=minimal" }).then((r3) => {
            if (!r3.ok) return false;
            b.dirtyContent = false; persist();
            return true;
          });
        });
      });
    });
  }
  function scheduleContent() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => { pushContent().then((ok) => { if (!ok) { box().dirtyContent = true; persist(); } }); }, 700);
  }
  // The admin typed something in: send the lessons and quizzes to the server soon.
  function contentChanged() {
    if (!enabled() || !session() || !EL.api.canManage()) return;
    box().dirtyContent = true; persist();
    scheduleContent();
  }

  /* ───────── student progress ───────── */
  let progTimer = null;
  function pushProgress() {
    const s = st();
    const sess = session();
    const id = s.session.studentId;
    if (!sess || !s.session.loggedIn || s.session.role !== "student" || !id || id !== sess.uid) return Promise.resolve(true);
    const body = { user_id: id, completed: s.completed, quiz_results: s.quizResults, active_dates: s.activeDates, minutes: s.minutes, best_streak: s.bestStreak || 0, updated_at: new Date().toISOString() };
    return authed("POST", "/rest/v1/progress?on_conflict=user_id", body, { prefer: "resolution=merge-duplicates,return=minimal" }).then((r1) => {
      if (!r1.ok) { box().dirtyProgress = true; persist(); return false; }
      return authed("PATCH", "/rest/v1/profiles?id=eq." + q(id), { name: s.student.name, daily_goal: s.student.dailyGoal || 15, last_seen: today() }, { prefer: "return=minimal" }).then((r2) => {
        box().dirtyProgress = !r2.ok; persist();
        return r2.ok;
      });
    });
  }
  function scheduleProgress() {
    clearTimeout(progTimer);
    progTimer = setTimeout(pushProgress, 800);
  }
  // store.js calls this after every save
  function onSave(state) {
    if (!enabled() || !session()) return;
    if (state.session.loggedIn && state.session.role === "student" && state.session.studentId) scheduleProgress();
  }

  function pullProgress() {
    const sess = session();
    if (!sess) return Promise.resolve(false);
    return authed("GET", "/rest/v1/progress?user_id=eq." + q(sess.uid) + "&select=*").then((r) => {
      const row = r.ok && Array.isArray(r.data) ? r.data[0] : null;
      if (!row || st().session.studentId !== sess.uid) return false;
      const s = st();
      const local = { completed: s.completed, quizResults: s.quizResults, activeDates: s.activeDates, minutes: s.minutes, bestStreak: s.bestStreak };
      const m = mergeProgress(local, { completed: row.completed, quizResults: row.quiz_results, activeDates: row.active_dates, minutes: row.minutes, bestStreak: row.best_streak });
      if (sameProgress(m, local)) return false;
      EL.store.update((x) => { x.completed = m.completed; x.quizResults = m.quizResults; x.activeDates = m.activeDates; x.minutes = m.minutes; x.bestStreak = m.bestStreak; });
      safeRefresh();
      return true;
    });
  }

  /* ───────── sign in / sign up ───────── */
  function authErr(r) {
    if (r.network) return { error: "network" };
    const m = String(msgOf(r)).toLowerCase();
    if (/already (been )?registered|already exists/.test(m)) return { error: "exists" };
    if (/not confirmed/.test(m)) return { error: "unconfirmed" };
    if (/invalid login|invalid credentials/.test(m) || r.status === 400 && /grant/.test(String((r.data && r.data.error) || ""))) return { error: "badLogin" };
    if (/password/.test(m)) return { error: "weak", message: msgOf(r) };
    return { error: "server", message: msgOf(r) || "HTTP " + r.status };
  }

  // After the server accepted the sign-in: load the profile and progress into the local copy.
  function enterServer(tryAdmin) {
    const sess = session();
    return authed("GET", "/rest/v1/profiles?id=eq." + q(sess.uid) + "&select=*").then((r) => {
      if (r.network) { clearSession(); return { error: "network" }; }
      const p = r.ok && Array.isArray(r.data) ? r.data[0] : null;
      if (!p) { clearSession(); return { error: "setup" }; }
      const becomeAdmin = p.role === "admin" ? Promise.resolve(true)
        : tryAdmin ? authed("POST", "/rest/v1/rpc/claim_admin", {}).then((c) => c.ok && c.data === true) : Promise.resolve(false);
      return becomeAdmin.then((isAdmin) => {
        if (isAdmin) {
          EL.store.update((s) => { Object.assign(s.session, { loggedIn: true, role: "admin", adminAuthed: true }); EL.api._leave(s); });
          return adminSync().then(() => ({ ok: true, role: "admin" }));
        }
        if (tryAdmin) { signOut(); return { error: "notAdmin" }; }
        return authed("GET", "/rest/v1/progress?user_id=eq." + q(p.id) + "&select=*").then((g) => {
          const row = g.ok && Array.isArray(g.data) ? g.data[0] : null;
          const server = recFrom(p, row);
          EL.store.update((s) => {
            // progress made on this device before the server existed (same email) is kept
            const low = String(p.email).toLowerCase();
            let merged = { completed: server.completed, quizResults: server.quizResults, activeDates: server.activeDates, minutes: server.minutes, bestStreak: server.bestStreak };
            s.students.filter((x) => x.id === p.id || String(x.email).toLowerCase() === low).forEach((x) => { merged = mergeProgress(merged, x); });
            s.students = s.students.filter((x) => x.id !== p.id && String(x.email).toLowerCase() !== low);
            Object.assign(server, merged);
            s.students.push(server);
            EL.api._enter(s, server);
          });
          scheduleProgress();
          return pullContent().then(() => ({ ok: true, role: "student" }));
        });
      });
    });
  }

  function login(email, pw, tryAdmin) {
    return http("POST", "/auth/v1/token?grant_type=password", { email: String(email).trim(), password: pw }, { anon: true }).then((r) => {
      if (!r.ok || !r.data || !r.data.access_token) return authErr(r);
      setSession(r.data);
      return enterServer(!!tryAdmin);
    });
  }

  function signup(p, tryAdmin) {
    return http("POST", "/auth/v1/signup", { email: String(p.email).trim(), password: p.password, data: { name: p.name } }, { anon: true }).then((r) => {
      if (!r.ok) return authErr(r);
      if (!r.data || !r.data.access_token) {
        // an existing address answers with a user but no session when e-mail confirmation is on
        return { error: "confirm" };
      }
      setSession(r.data);
      return enterServer(!!tryAdmin);
    });
  }

  function signOut() {
    if (session()) http("POST", "/auth/v1/logout", {}, {}).then(() => 0, () => 0);
    clearSession();
    const b = box(); b.dirtyProgress = false; persist();
    clearTimeout(progTimer);
  }

  function deleteMe() {
    return authed("POST", "/rest/v1/rpc/delete_me", {}).then((r) => {
      if (r.network) return { ok: false, error: "network" };
      if (!r.ok) return { ok: false, error: "server", message: msgOf(r) };
      signOut();
      return { ok: true };
    });
  }

  /* ───────── admin: students ───────── */
  const cache = { list: [], at: 0, loading: false, error: "" };
  function loadStudents() {
    if (!enabled() || !session()) return Promise.resolve(cache);
    cache.loading = true;
    return Promise.all([authed("GET", "/rest/v1/profiles?select=*&role=eq.student&order=joined.desc"), authed("GET", "/rest/v1/progress?select=*")]).then((rs) => {
      cache.loading = false;
      cache.at = Date.now();
      if (!rs[0].ok || !rs[1].ok || !Array.isArray(rs[0].data) || !Array.isArray(rs[1].data)) { cache.error = rs[0].network || rs[1].network ? "network" : "server"; return cache; }
      cache.error = "";
      const byUser = {};
      rs[1].data.forEach((g) => { byUser[g.user_id] = g; });
      cache.list = rs[0].data.map((p) => recFrom(p, byUser[p.id]));
      return cache;
    });
  }
  function removeStudent(id) {
    return authed("POST", "/rest/v1/rpc/remove_student", { uid: id }).then((r) => {
      if (!r.ok) return { ok: false, error: r.network ? "network" : "server" };
      cache.list = cache.list.filter((x) => x.id !== id);
      return { ok: true };
    });
  }

  /* ───────── admin: send local content up the first time, otherwise fetch ───────── */
  function adminSync() {
    if (box().dirtyContent) return pushContent();
    return authed("GET", "/rest/v1/lessons?select=id&limit=1").then((r) => {
      if (r.ok && Array.isArray(r.data) && !r.data.length && st().content.lessons.length) return pushContent();
      return pullContent();
    });
  }

  /* ───────── start-up and keeping in step ───────── */
  function resume() {
    if (!enabled()) return Promise.resolve();
    const s = st();
    if (!session()) {
      // someone signed in on this device before a server was connected: sign in again on the server
      if (s.session.loggedIn) { EL.api.logout(); EL.app.go("welcome"); }
      return Promise.resolve();
    }
    if (!s.session.loggedIn) { clearSession(); return Promise.resolve(); }
    return fresh().then((x) => {
      if (x === "auth") { EL.api.logout(); EL.app.go("welcome"); return; }
      if (x === "network") return;
      if (s.session.adminAuthed) return adminSync();
      return pullProgress().then(pullContent);
    });
  }

  function tick() {
    if (!enabled() || !session()) return;
    const s = st();
    if (!s.session.loggedIn) return;
    if (s.session.adminAuthed && s.session.role === "admin") { if (box().dirtyContent) scheduleContent(); return; }
    if (box().dirtyProgress) scheduleProgress();
    pullContent();
  }
  let started = false;
  function start() {
    if (started) return;
    started = true;
    setInterval(tick, 60000);
    window.addEventListener("online", tick);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
    resume();
  }

  /* ───────── connection settings and test ───────── */
  function test(url, key) {
    url = cleanUrl(url); key = String(key || "").trim();
    // Supabase addresses are always https; plain http is only accepted for a server running on this computer (testing).
    if (!/^https:\/\/[^\s/]+\.[^\s/]+/i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(url)) return Promise.resolve({ error: "url" });
    if (key.length < 20) return Promise.resolve({ error: "key" });
    const h = { apikey: key };
    if (/^eyJ/.test(key)) h.Authorization = "Bearer " + key;
    return fetch(url + "/rest/v1/lessons?select=id&limit=1", { headers: h }).then(
      (r) => r.text().then((t) => {
        let d = null; try { d = JSON.parse(t); } catch (e) { d = null; }
        if (r.ok) return { ok: true };
        const code = String((d && (d.code || d.error_code)) || "");
        if (r.status === 404 || /^(42P01|PGRST205|PGRST202)$/.test(code)) return { error: "tables" };
        if (r.status === 401 || r.status === 403) return { error: "key" };
        return { error: "server", message: (d && (d.message || d.msg)) || "HTTP " + r.status };
      }),
      () => ({ error: "network" })
    );
  }
  function setConfig(url, key) { const b = box(); b.url = cleanUrl(url); b.key = String(key || "").trim(); persist(); }
  function clearConfig() { const b = box(); delete b.url; delete b.key; delete b.session; persist(); }

  EL.cloud = {
    enabled, baked, config: cfg, hasSession: () => !!session(), setConfig, clearConfig, test,
    login, signup, signOut, deleteMe, onSave, contentChanged, start, pullContent, loadStudents, removeStudent,
    studentRecords: () => cache.list,
    studentsState: () => ({ loading: cache.loading, error: cache.error, at: cache.at, count: cache.list.length })
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* Text-to-speech for pronunciation and listening practice, using the browser's built-in voices.
   Phase 2 can swap this for recorded audio files without touching the screens. */
(function (EL) {
  const ok = "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance !== "undefined";
  let voice = null;

  function pick() {
    if (!ok) return;
    const vs = window.speechSynthesis.getVoices();
    voice = vs.find((v) => /^en-(US|GB)/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
  }
  if (ok) {
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
  }

  // Returns true when the browser accepted the request. Without speech support the
  // onend callback still fires after a short delay so progress UI keeps moving.
  function speak(text, o) {
    o = o || {};
    if (!ok) {
      if (o.onend) setTimeout(o.onend, Math.max(900, text.length * 60));
      return false;
    }
    try {
      window.speechSynthesis.cancel();
      const u = new window.SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      if (voice) u.voice = voice;
      u.rate = o.rate || 0.9;
      u.pitch = o.pitch || 1;
      if (o.onstart) u.onstart = o.onstart;
      if (o.onend) { u.onend = o.onend; u.onerror = o.onend; }
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) {
      if (o.onend) setTimeout(o.onend, 600);
      return false;
    }
  }

  function stop() {
    if (!ok) return;
    try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  }

  EL.speech = { supported: ok, speak, stop };
})((window.EL = window.EL || {}));

      ? '<a class="back" href="#' + o.back + '" aria-label="' + esc(EL.t("common.back")) + '">' + EL.icon("back", 22) + "</a>"
      : '<span class="back-spacer"></span>';
    return '<header class="topbar">' + back + '<h1 class="tb-title">' + o.title + '</h1><div class="tb-right">' + (o.right || "") + "</div></header>";
  };

    o = o || {};
    const size = o.size || 120, sw = o.stroke || 12, c = size / 2, r = (size - sw) / 2;
    return (
      '<div class="ring-wrap ' + (o.cls || "") + '" style="width:' + size + "px;height:" + size + 'px">' +
      '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" style="--p:' + pct + '" role="img" aria-label="' + pct + '%">' +

    );
  };

    o = o || {};
    return (
      '<a class="lesson-row' + (l.done ? " is-done" : "") + '" href="#lesson-' + l.id + '">' +
      '<span class="lr-icon t-' + EL.typeTone(l.type) + '">' + EL.icon(EL.typeIcon(l.type), 22) + "</span>" +
      '<span class="lr-body"><span class="lr-title">' + esc(l.title) + "</span>" +
      '<span class="lr-so so">' + esc(l.so) + "</span>" +
      '<span class="lr-meta">' + esc(EL.t("type." + l.type)) + " · " + esc(EL.t("common.min", { n: l.minutes })) + (o.showLevel ? " · " + esc(l.levelTitle) : "") + "</span></span>" +

    );
  };

  ui.notFound = () =>
    '<section class="empty"><div class="empty-art">' + EL.icon("help", 40) + "</div><p>" + esc(EL.t("common.notFound")) + '</p><a class="btn btn-primary" href="#home">' + esc(EL.t("common.goHome")) + "</a></section>";

  /* toast */
  let toastTimer = null;
  ui.toast = (msg) => {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  };

  /* confirm modal */
  let modalCb = null;
  ui.modal = (o) => {
    modalCb = o.onConfirm;
    const root = document.getElementById("modal-root");
    root.innerHTML =
      '<div class="modal-back" data-action="modal-cancel"></div>' +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<h2 id="modal-title">' + esc(o.title) + "</h2><p>" + esc(o.body) + "</p>" +
      '<div class="modal-actions"><button class="btn btn-ghost" data-action="modal-cancel">' + esc(EL.t("common.cancel")) + "</button>" +
      '<button class="btn ' + (o.danger ? "btn-danger" : "btn-primary") + '" data-action="modal-confirm">' + esc(o.confirm || EL.t("modal.confirm")) + "</button></div></div>";
    root.hidden = false;
    const first = root.querySelector('[data-action="modal-confirm"]');
    if (first) first.focus();
  };
  ui.closeModal = () => {
    const root = document.getElementById("modal-root");
    root.hidden = true;
    root.innerHTML = "";
  };
  ui.confirmModal = () => {
    const cb = modalCb;
    modalCb = null;
    ui.closeModal();
    if (cb) cb();
  };
})((window.EL = window.EL || {}));

</script>

  function lang() { return EL.store.get().settings.language; }

  function fill(str, vars) {
    return str.replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] !== undefined ? vars[k] : m; });
  }

  // Plain text in the active language ("both" uses English).
  EL.t = function (key, vars) {
    const e = dict[key];
    if (!e) return key;
    return fill(lang() === "so" ? e[1] : e[0], vars);
  };

  // Markup: primary text, plus a Somali line beneath when the language is "both".
  // `suffix` is appended to every line (used for "Good morning, Ayaan").
  EL.bi = function (key, vars, suffix) {
    const e = dict[key];
    if (!e) return EL.esc(key);
    const l = lang();
    const sfx = suffix || "";
    if (l === "so") return "<span>" + EL.esc(fill(e[1], vars) + sfx) + "</span>";
    if (l === "en") return "<span>" + EL.esc(fill(e[0], vars) + sfx) + "</span>";
    return '<span class="bi"><span>' + EL.esc(fill(e[0], vars) + sfx) + '</span><span class="so sub">' + EL.esc(fill(e[1], vars) + sfx) + "</span></span>";
  };

  EL.hasKey = (key) => !!dict[key];
  EL.lang = lang;
})((window.EL = window.EL || {}));

<!-- router + screens -->
<script>
/* Router and event wiring.
   Routes are plain hash names so every screen has a shareable link:
   welcome, login, signup, forgot, home, courses, course-<level>, lesson-<id>, skill-<type>,
   quizzes, quiz-<id>, progress, profile, edit-profile, language, notifications, account.
   Screens live in js/screens/*.js and register themselves on EL.screens. */
(function (EL) {
  EL.screens = EL.screens || {};
  EL.actions = EL.actions || {}; // data-action handlers
  EL.inputs = EL.inputs || {};   // data-input handlers
  EL.forms = EL.forms || {};     // data-form submit handlers

  const PUBLIC = ["welcome", "login", "signup", "forgot", "adminlogin"];
  const ADMIN_ONLY = ["content", "lessonedit", "quizedit", "students", "student"]; // the only screens the admin sees
  let cleanups = [];

  EL.onLeave = (fn) => cleanups.push(fn);

  // The current route lives in memory so the app also works where the host blocks
  // changing the address hash (some preview frames). The hash is kept in sync when allowed,
  // so links, the back button and bookmarks still work in a normal browser tab.
  // Only touch the address hash on ordinary pages. Inside sandboxed previews (about:srcdoc,
  // blob:, data:) a hash change would try to navigate the frame, so routing stays in memory.
  let hashOk = false;
  try { hashOk = /^(https?:|file:)$/.test(location.protocol); } catch (e) { hashOk = false; }
  function readHash() {
    if (!hashOk) return "";
    try { return (location.hash || "").replace(/^#/, ""); } catch (e) { return ""; }
  }
  let current = readHash() || null;

  function parse() {
    const h = current;
    if (!h) return null;
    if (EL.screens[h]) return { name: h, arg: null };
    const i = h.indexOf("-");
    if (i > 0 && EL.screens[h.slice(0, i)]) return { name: h.slice(0, i), arg: h.slice(i + 1) };
    return { name: "notfound", arg: null };
  }

  function go(route) {
    current = route;
    if (hashOk) { try { if (location.hash !== "#" + route) location.hash = route; } catch (e) { /* not writable */ } }
    render();
  }

  function replace(route) {
    current = route;
    if (hashOk) { try { location.replace("#" + route); } catch (e) { /* not writable */ } }
    render();
  }

  // Bottom navigation icons and labels follow the chosen language.
  function paintNav() {
    document.querySelectorAll("#nav [data-icon]").forEach((n) => { n.innerHTML = EL.icon(n.dataset.icon, n.classList.contains("nav-ic") ? 24 : 28); });
    document.querySelectorAll("#nav [data-label]").forEach((n) => { n.textContent = EL.t(n.dataset.label); });
    // The round centre button always leads to the next lesson to learn.
    const fab = document.getElementById("nav-fab");
    if (fab) {
      let l = null;
      try { l = EL.api.getTodayLesson(); } catch (e) { l = null; }
      const none = !EL.api.getAllLessons().length;
      fab.setAttribute("href", l ? "#lesson-" + l.id : none ? "#home" : "#quizzes");
    }
  }

  function render(opts) {
    opts = opts || {};
    paintNav();
    cleanups.forEach((f) => { try { f(); } catch (e) { /* ignore */ } });
    cleanups = [];

    const loggedIn = EL.api.isLoggedIn();
    const admin = EL.api.isAdmin();
    const home = admin ? "content" : "home";
    const r = parse();
    if (!r) { replace(loggedIn ? home : "welcome"); return; }
    if (r.name === "server") {
      // the server settings are for the owner: open before signing in, and for the admin; never for a student
      if (loggedIn && !admin) { replace("home"); return; }
    } else {
      if (!loggedIn && PUBLIC.indexOf(r.name) === -1) { replace("welcome"); return; }
      if (loggedIn && PUBLIC.indexOf(r.name) > -1) { replace(home); return; }
      if (loggedIn && admin && ADMIN_ONLY.indexOf(r.name) === -1) { replace("content"); return; }
      if (loggedIn && !admin && ADMIN_ONLY.indexOf(r.name) > -1) { replace("home"); return; }
    }

    const scr = EL.screens[r.name] || EL.screens.notfound;
    const host = document.getElementById("screen");
    const nav = document.getElementById("nav");
    const y = window.scrollY;

    document.body.classList.toggle("lang-en", EL.lang() === "en");
    document.documentElement.lang = EL.lang() === "so" ? "so" : "en";
    document.body.dataset.screen = r.name;

    host.innerHTML = scr.render(r.arg, { refresh: !!opts.refresh });
    host.className = "screen" + (opts.refresh ? "" : " enter");

    const showNav = !!scr.tab && !scr.hideNav;
    nav.hidden = !showNav;
    nav.querySelectorAll("a").forEach((a) => {
      const on = a.dataset.tab === scr.tab;
      a.classList.toggle("active", on);
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    document.body.classList.toggle("has-nav", showNav);

    if (scr.mount) scr.mount(r.arg, host);
    window.scrollTo(0, opts.refresh ? y : 0);
  }

  EL.app = { go, replace, refresh: () => render({ refresh: true }), render, route: () => current };

  /* ── events ── */
  // Forms are handled on click/Enter instead of the browser's own submit, so they also work
  // where the page is sandboxed without form permission.
  function runForm(f) {
    const fn = f && f.dataset && EL.forms[f.dataset.form];
    if (fn) fn(f);
  }

  document.addEventListener("click", (e) => {
    const sb = e.target.closest('form[data-form] button[type="submit"]');
    if (sb) { e.preventDefault(); runForm(sb.form); return; }
    const act = e.target.closest("[data-action]");
    if (act) {
      const fn = EL.actions[act.dataset.action];
      if (fn) { e.preventDefault(); fn(act, e); return; }
    }
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const a = e.target.closest('a[href^="#"]');
    if (a) {
      const route = a.getAttribute("href").slice(1);
      e.preventDefault();
      if (route) go(route);
    }
  });

  document.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    const fn = EL.forms[f.dataset.form];
    if (fn) fn(f);
  });

  document.addEventListener("input", (e) => {
    const name = e.target.dataset && e.target.dataset.input;
    if (name && EL.inputs[name]) EL.inputs[name](e.target, e);
  });

  // <select> changes that need more than a value update (e.g. the lesson type in the editor)
  EL.changes = EL.changes || {};
  document.addEventListener("change", (e) => {
    const name = e.target.dataset && e.target.dataset.change;
    if (name && EL.changes[name]) EL.changes[name](e.target, e);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches && e.target.matches("form[data-form] input")) {
      e.preventDefault();
      runForm(e.target.form);
      return;
    }
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.enter) {
      const fn = EL.actions[e.target.dataset.enter];
      if (fn) { e.preventDefault(); fn(e.target, e); }
    }
    if (e.key === "Escape") {
      const root = document.getElementById("modal-root");
      if (root && !root.hidden) EL.ui.closeModal();
    }
  });

  EL.actions["modal-cancel"] = () => EL.ui.closeModal();
  EL.actions["modal-confirm"] = () => EL.ui.confirmModal();

  // Back/forward or a typed link: follow the hash. Changes made by go() already match `current`.
  window.addEventListener("hashchange", () => {
    const h = readHash();
    if (h && h !== current) { current = h; render(); }
  });
  EL.start = () => { render(); if (EL.cloud) EL.cloud.start(); };
})((window.EL = window.EL || {}));

</script>
<script>
/* Welcome, Log in, Sign up, Forgot password. UI only: nothing is sent anywhere. */
(function (EL) {
  const S = (EL.screens = EL.screens || {});
  const esc = EL.esc, t = EL.t, bi = EL.bi;

  /* ── Welcome ── */
  S.welcome = {
    render() {
      return (
        '<div class="welcome">' +
        '<div class="w-brand">' + EL.ui.logo(40) + "<span>" + esc(EL.brand.name) + " <small>" + esc(EL.brand.app) + "</small></span></div>" +
        '<div class="welcome-art">' + EL.ui.logo(300, "hero-logo") + "</div>" +
        '<div class="welcome-copy">' +
        '<h1 class="welcome-title">Learn English <b>step by step</b></h1>' +
        '<p class="welcome-sub">Baro English si fudud, meel kasta oo aad joogto.</p>' +
        '<div class="welcome-cta">' +
        '<button class="btn btn-primary btn-lg btn-block" data-go="signup">' + bi("welcome.start") + "</button>" +
        '<p class="signin-line">' + esc(t("auth.hasAccount")) + ' <a href="#login">' + esc(t("auth.login")) + "</a></p>" +
        '<p class="signin-line admin-line"><a href="#adminlogin">' + esc(t("auth.adminLink")) + "</a></p>" +
        (EL.cloud.baked() ? "" : '<p class="signin-line admin-line"><a href="#server">' + EL.icon("globe", 14) + " " + esc(EL.cloud.enabled() ? tx("Server: connected", "Server-ka: waa xiran yahay") : tx("Connect a server", "Xiir server")) + "</a></p>") +
        "</div></div></div>"
      );
    }
  };

  /* ── Auth helpers ── */
  function field(o) {
    return (
      '<div class="field"><label for="' + o.id + '">' + esc(o.label) + "</label>" +
      '<div class="input-wrap">' + EL.icon(o.icon, 20) +
      '<input id="' + o.id + '" name="' + o.name + '" type="' + o.type + '" autocomplete="' + o.auto + '" placeholder="' + esc(o.ph || "") + '" />' +
      (o.type === "password"
        ? '<button type="button" class="eye" data-action="toggle-pass" data-for="' + o.id + '" aria-label="' + esc(t("auth.show")) + '">' + EL.icon("eye", 20) + "</button>"
        : "") +
      '</div><p class="field-err" data-err="' + o.name + '" role="alert"></p></div>'
    );
  }

  function authShell(body) {
    return (
      '<div class="auth"><a class="back" href="#welcome" aria-label="' + esc(t("common.back")) + '">' + EL.icon("back", 22) + "</a>" +
      '<div class="auth-card card">' + '<div class="brand">' + EL.ui.logo(56) + '<span class="brand-name">' + esc(EL.brand.name) + "<small>" + esc(EL.brand.app) + "</small></span></div>" + body + "</div></div>"
    );
  }

  EL.actions["toggle-pass"] = (el) => {
    const input = document.getElementById(el.dataset.for);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    el.innerHTML = EL.icon(show ? "eyeoff" : "eye", 20);
  };

  const tx = (en, so) => (EL.lang() === "so" ? so : en);
  // Text for a server answer from EL.cloud (login, signup)
  EL.cloudErr = (res) => {
    const key = { network: "err.network", badLogin: "err.badLogin", exists: "err.exists", confirm: "err.confirm", unconfirmed: "err.unconfirmed", setup: "err.setup", weak: "err.weak" }[res.error] || "err.server";
    return t(key) + (key === "err.server" && res.message ? " (" + res.message + ")" : "");
  };
  // Greys the submit button while a request is on its way.
  EL.busy = (f, on) => { const b = f.querySelector('button[type="submit"]'); if (b) { b.disabled = !!on; b.classList.toggle("is-busy", !!on); } };

  const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

  function setErr(form, name, msg) {
    const p = form.querySelector('[data-err="' + name + '"]');
    const input = form.elements[name];
    if (p) p.textContent = msg || "";
    if (input) input.setAttribute("aria-invalid", msg ? "true" : "false");
    return !msg;
  }

  /* ── Log in ── */
  S.login = {
    render() {
      return authShell(
        "<h1>" + bi("auth.loginTitle") + '</h1><p class="muted">' + bi("auth.loginSub") + "</p>" +
        '<form data-form="login" novalidate>' +
        field({ id: "li-email", name: "email", type: "email", label: t("auth.email"), icon: "mail", auto: "email", ph: "ayaan@example.com" }) +
        field({ id: "li-pass", name: "password", type: "password", label: t("auth.password"), icon: "lock", auto: "current-password" }) +
        '<a class="link" href="#forgot">' + esc(t("auth.forgot")) + "</a>" +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">' + esc(t("auth.login")) + "</button></form>" +
        '<p class="switch-line">' + esc(t("auth.noAccount")) + ' <a class="link" href="#signup">' + esc(t("auth.signup")) + "</a></p>" +
        '<p class="switch-line"><a class="link" href="#adminlogin">' + esc(t("auth.adminLink")) + "</a></p>"
      );
    }
  };

  EL.forms.login = (f) => {
    const email = f.elements.email.value.trim();
    const pw = f.elements.password.value;
    const a = setErr(f, "email", emailOk(email) ? "" : t("err.email"));
    const b = setErr(f, "password", pw.length >= 6 ? "" : t("err.password"));
    if (!a || !b) return;
    if (EL.cloud.enabled()) {
      EL.busy(f, true);
      EL.cloud.login(email, pw, false).then((res) => {
        EL.busy(f, false);
        if (!res.ok) { setErr(f, "password", EL.cloudErr(res)); return; }
        EL.ui.toast(res.role === "admin" ? tx("Welcome, admin", "Ku soo dhawow, maamule") : t("auth.welcomeToast", { name: EL.api.getStudent().firstName }));
        EL.app.go(res.role === "admin" ? "content" : "home");
      });
      return;
    }
    const res = EL.api.login(email, pw);
    if (res === "none") { setErr(f, "email", t("err.noAccount")); return; }
    if (res === "wrong") { setErr(f, "password", t("err.wrongPw")); return; }
    EL.ui.toast(t("auth.welcomeToast", { name: EL.api.getStudent().firstName }));
    EL.app.go("home");
  };

  /* ── Sign up ── */
  S.signup = {
    render() {
      return authShell(
        "<h1>" + bi("auth.createTitle") + '</h1><p class="muted">' + bi("auth.createSub") + "</p>" +
        '<form data-form="signup" novalidate>' +
        field({ id: "su-name", name: "name", type: "text", label: t("auth.name"), icon: "user", auto: "name", ph: "Ayaan Mohamed" }) +
        field({ id: "su-email", name: "email", type: "email", label: t("auth.email"), icon: "mail", auto: "email", ph: "ayaan@example.com" }) +
        field({ id: "su-pass", name: "password", type: "password", label: t("auth.password"), icon: "lock", auto: "new-password" }) +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">' + esc(t("auth.signup")) + "</button></form>" +
        '<p class="switch-line">' + esc(t("auth.hasAccount")) + ' <a class="link" href="#login">' + esc(t("auth.login")) + "</a></p>"
      );
    }
  };

  EL.forms.signup = (f) => {
    const name = f.elements.name.value.trim();
    const email = f.elements.email.value.trim();
    const pw = f.elements.password.value;
    const a = setErr(f, "name", name ? "" : t("err.name"));
    const b = setErr(f, "email", emailOk(email) ? "" : t("err.email"));
    const c = setErr(f, "password", pw.length >= 6 ? "" : t("err.password"));
    if (!a || !b || !c) return;
    if (EL.cloud.enabled()) {
      EL.busy(f, true);
      EL.cloud.signup({ name, email, password: pw }, false).then((res) => {
        EL.busy(f, false);
        if (!res.ok) { setErr(f, res.error === "exists" ? "email" : "password", EL.cloudErr(res)); return; }
        EL.ui.toast(t("auth.welcomeToast", { name: name.split(" ")[0] }));
        EL.app.go(res.role === "admin" ? "content" : "home");
      });
      return;
    }
    if (EL.api.signup({ name, email, password: pw }) === "exists") { setErr(f, "email", t("err.exists")); return; }
    EL.ui.toast(t("auth.welcomeToast", { name: name.split(" ")[0] }));
    EL.app.go("home");
  };

  /* ── Forgot password ── */
  S.forgot = {
    render() {
      return authShell(
        "<h1>" + bi("auth.resetTitle") + '</h1><p class="muted">' + bi("auth.resetSub") + "</p>" +
        '<form data-form="forgot" id="forgot-form" novalidate>' +
        field({ id: "fg-email", name: "email", type: "email", label: t("auth.email"), icon: "mail", auto: "email", ph: "ayaan@example.com" }) +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">' + esc(t("auth.sendLink")) + "</button></form>" +
        '<div class="notice ok" id="forgot-ok" hidden>' + EL.icon("check", 20) + "<p>" + bi("auth.sent") + "</p></div>" +
        '<p class="switch-line"><a class="link" href="#login">' + esc(t("auth.backToLogin")) + "</a></p>"
      );
    }
  };

  EL.forms.forgot = (f) => {
    const email = f.elements.email.value.trim();
    if (!setErr(f, "email", emailOk(email) ? "" : t("err.email"))) return;
    const ok = document.getElementById("forgot-ok");
    if (EL.cloud.enabled()) {
      // e-mail reset links need the app to live at a web address; until then the owner resets it in Supabase
      ok.querySelector("p").innerHTML = "<span>" + esc(tx("Ask your teacher to reset your password for you.", "Macallinkaaga ka codso inuu kuu beddelo erayga sirta ah.")) + "</span>";
    }
    ok.hidden = false;
    f.hidden = true;
  };

  S.notfound = { tab: "home", render: () => EL.ui.notFound() };
})((window.EL = window.EL || {}));

</script>

      return (
        EL.ui.topbar({ back: "courses", title: esc(lv.title) }) +
        '<section class="course-hero tone-' + toneOf(levels, id) + '"><div class="ch-text"><span class="tag">' + esc(lv.code) + "</span>" +
        "<h2>" + esc(lv.title) + '</h2><p class="so">' + esc(lv.so) + "</p>" +
        '<p class="lv-desc">' + esc(lv.desc) + '</p><p class="so">' + esc(lv.descSo) + "</p>" +
        '<p class="meta">' + esc(t("courses.done", { n: lv.done, total: lv.total })) + " · " + esc(t("common.min", { n: lv.minutes })) + "</p></div>" +
        EL.ui.ring(lv.pct, { size: 100, stroke: 11, cls: "on-hero", label: "<b>" + lv.pct + "%</b>" }) + "</section>" +
        '<div class="section-head"><h2>' + bi("common.lessons") + "</h2></div>" +
        (lv.lessons.length
          ? '<div class="lesson-list">' + lv.lessons.map((l) => EL.ui.lessonRow(Object.assign({}, l, { levelTitle: lv.title }))).join("") + "</div>"
          : '<div class="empty-note"><p>' + esc(t("content.emptyList")) + "</p></div>") +
        '<div class="section-head"><h2>' + bi("courses.levelQuiz") + "</h2></div>" +
        '<a class="quiz-row" href="#quiz-' + id + '"><span class="lr-icon t-b">' + EL.icon("help", 22) + "</span>" +
        '<span class="lr-body"><span class="lr-title">' + esc(quiz.title) + '</span><span class="lr-so so">' + esc(quiz.so) + '</span><span class="lr-meta">' +
        esc(t("courses.questions", { n: quiz.count })) + " · " + esc(quiz.best === null ? t("courses.notTaken") : t("courses.best", { n: quiz.best })) + "</span></span>" +
        '<span class="lr-state">' + EL.icon("chevron", 20) + "</span></a>"
      );
    }
  };

  S.skill = {
    tab: "home",
    render(type) {
      const meta = EL.data.skillTypes.find((s) => s.id === type);
      if (!meta) return EL.ui.notFound();
      const ls = EL.api.getLessonsByType(type);
      const done = ls.filter((l) => l.done).length;
      return (
        EL.ui.topbar({ back: "home", title: esc(t("type." + type)) }) +
        '<section class="skill-hero card"><span class="lr-icon big t-' + EL.typeTone(type) + '">' + EL.icon(meta.icon, 28) + "</span>" +
        "<div><h2>" + bi("type." + type) + '</h2><p class="muted">' + bi("skill.sub." + type) + '</p><p class="meta">' +
        esc(t("courses.done", { n: done, total: ls.length })) + "</p></div></section>" +
        (ls.length
          ? '<div class="lesson-list">' + ls.map((l) => EL.ui.lessonRow(l, { showLevel: true })).join("") + "</div>"
          : '<div class="empty-note"><p>' + esc(t("content.emptyList")) + "</p></div>")
      );
    }
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* Lesson screen: vocabulary, grammar, listening, speaking, reading, writing.
   Interactions update their own part of the page (no full re-render) so audio keeps playing
   and the scroll position stays put. */
(function (EL) {
  const S = (EL.screens = EL.screens || {});
  const esc = EL.esc, t = EL.t, bi = EL.bi;

  /* per-lesson UI state for this visit */
  const store = {};
  const st = (id) => store[id] || (store[id] = { mini: {}, write: {}, speak: {}, rate: 1, transcript: false });
  const here = (id) => EL.app.route() === "lesson-" + id;

  function replaceNode(sel, html) {
    const n = document.querySelector(sel);
    if (n) n.outerHTML = html;
  }

  function sayBtn(text, label) {
    return '<button class="icon-btn" data-action="say" data-say="' + esc(text) + '" aria-label="' + esc(t("lesson.listen") + ": " + (label || text)) + '">' + EL.icon("volume", 20) + "</button>";
  }

  EL.actions.say = (el) => {
    el.classList.add("is-speaking");
    const done = () => el.classList.remove("is-speaking");
    const ok = EL.speech.speak(el.dataset.say, { rate: 0.85, onend: done });
    if (!ok && !EL.speech.supported) EL.ui.toast(t("lesson.noAudio"));
  };

  /* ───────── mini questions (grammar check, listening, reading) ───────── */
  const questionsOf = (L) => L.check || L.questions || [];

  function miniQ(id, qi, q) {
    const sel = st(id).mini[qi];
    const answered = sel !== undefined;
    const ok = answered && sel === q.a;
    const list = q.type === "tf"
      ? [{ v: true, l: t("quiz.true") }, { v: false, l: t("quiz.false") }]
      : q.options.map((o, i) => ({ v: i, l: o }));
    const opts = list.map((o) => {
      let c = "opt";
      let mark = "";
      if (answered) {
        if (o.v === q.a) { c += " is-correct"; mark = EL.icon("check", 18); }
        else if (o.v === sel) { c += " is-wrong"; mark = EL.icon("x", 18); }
      }
      return '<button class="' + c + '" data-action="mini" data-l="' + id + '" data-q="' + qi + '" data-v="' + o.v + '"' + (answered ? " disabled" : "") + '><span class="opt-mark">' + mark + "</span><span>" + esc(o.l) + "</span></button>";
    }).join("");
    const fb = answered
      ? '<div class="feedback ' + (ok ? "ok" : "bad") + '"><span class="fb-ic">' + EL.icon(ok ? "check" : "x", 20) + "</span><div><strong>" + esc(ok ? t("quiz.correct") : t("quiz.incorrect")) + "</strong><p>" + esc(q.explain) + '</p><p class="so">' + esc(q.explainSo) + "</p>" +
        (ok ? "" : '<button class="link-btn" data-action="mini-reset" data-l="' + id + '" data-q="' + qi + '">' + esc(t("lesson.tryAgain")) + "</button>") + "</div></div>"
      : "";
    return (
      '<div class="qcard card" data-qid="' + id + "-" + qi + '"><p class="qc-text">' + esc(q.q).replace(/_{3,}/g, '<span class="blank"></span>') + '</p><div class="opts">' + opts + "</div>" + fb + "</div>"
    );
  }

  function miniSection(L, titleKey) {
    const qs = questionsOf(L);
    if (!qs.length) return "";
    return '<div class="section-head"><h2>' + bi(titleKey) + '</h2></div><div class="stack">' + qs.map((q, i) => miniQ(L.id, i, q)).join("") + "</div>";
  }

  EL.actions.mini = (el) => {
    const id = el.dataset.l, qi = +el.dataset.q;
    const q = questionsOf(EL.api.getLesson(id))[qi];
    const raw = el.dataset.v;
    st(id).mini[qi] = q.type === "tf" ? raw === "true" : +raw;
    replaceNode('[data-qid="' + id + "-" + qi + '"]', miniQ(id, qi, q));
  };
  EL.actions["mini-reset"] = (el) => {
    const id = el.dataset.l, qi = +el.dataset.q;
    delete st(id).mini[qi];
    replaceNode('[data-qid="' + id + "-" + qi + '"]', miniQ(id, qi, questionsOf(EL.api.getLesson(id))[qi]));
  };

  /* ───────── vocabulary ───────── */
  function vocabulary(L) {
    return (
      '<div class="vocab-grid">' +
      L.words.map((w) =>
        '<article class="vocab-card card"><div class="vimg" aria-hidden="true">' + esc(w.emoji || "📘") + "</div><div class=\"vbody\">" +
        '<div class="vword"><h3>' + esc(w.en) + "</h3>" + sayBtn(w.en) + "</div>" +
        '<p class="vmean so">' + esc(w.so) + "</p>" +
        (w.ex ? '<div class="vex"><div><p>' + esc(w.ex) + '</p><p class="so">' + esc(w.exSo) + "</p></div>" + sayBtn(w.ex, w.ex) + "</div>" : "") + "</div></article>"
      ).join("") + "</div>"
    );
  }

  /* ───────── grammar ───────── */
  function grammar(L) {
    const list = (items, cls, row) => (items && items.length ? '<ul class="' + cls + ' card">' + items.map(row).join("") + "</ul>" : "");
    const head = (key, items) => (items && items.length ? '<div class="section-head"><h2>' + bi(key) + "</h2></div>" : "");
    return (
      (L.intro && (L.intro.en || L.intro.so) ? '<section class="card pad">' + EL.pair(L.intro.en, L.intro.so, { cls: "lead-text" }) + "</section>" : "") +
      head("lesson.forms", L.table) +
      list(L.table, "forms", (r) => '<li><span class="form-en">' + esc(r.en) + '</span><span class="form-so so">' + esc(r.so) + "</span></li>") +
      head("lesson.rules", L.rules) +
      list(L.rules, "rules", (r) => '<li><span class="rule-ic">' + EL.icon("check", 16) + "</span><div><p>" + esc(r.en) + '</p><p class="so">' + esc(r.so) + "</p></div></li>") +
      head("lesson.examples", L.examples) +
      list(L.examples, "examples", (x) => "<li><div><p class=\"ex-en\">" + esc(x.en) + '</p><p class="so">' + esc(x.so) + "</p></div>" + sayBtn(x.en) + "</li>") +
      (L.tip && (L.tip.en || L.tip.so) ? '<aside class="tip">' + EL.icon("bulb", 22) + "<div><strong>" + esc(t("lesson.tip")) + "</strong>" + EL.pair(L.tip.en, L.tip.so) + "</div></aside>" : "") +
      miniSection(L, "lesson.quickCheck")
    );
  }

  /* ───────── listening ───────── */
  const P = { id: null, playing: false, finished: false, idx: 0, token: 0, timer: null };

  function stopPlayer() {
    P.playing = false;
    P.token++;
    clearTimeout(P.timer);
    EL.speech.stop();
  }

  function syncPlayer(L) {
    const btn = document.getElementById("pl-btn");
    if (!btn) return;
    const total = L.script.length;
    const icon = P.playing ? "pause" : P.finished ? "replay" : "play";
    btn.innerHTML = EL.icon(icon, 30);
    btn.setAttribute("aria-label", t(P.playing ? "lesson.pause" : P.finished ? "lesson.replay" : "lesson.play"));
    const shown = Math.min(P.idx + 1, total);
    document.getElementById("pl-count").textContent = t("lesson.line", { n: P.finished ? total : shown, total });
    document.querySelector("#pl-bar i").style.width = (P.finished ? 100 : (P.idx / total) * 100) + "%";
    document.querySelectorAll(".tl-line").forEach((n) => n.classList.toggle("active", P.playing && +n.dataset.i === P.idx));
  }

  function playLine(L) {
    if (P.idx >= L.script.length) {
      P.playing = false; P.finished = true; syncPlayer(L); return;
    }
    syncPlayer(L);
    const line = L.script[P.idx];
    const speakers = Array.from(new Set(L.script.map((s) => s.who)));
    const rate = st(L.id).rate;
    const token = ++P.token;
    let advanced = false;
    const next = () => {
      if (advanced || token !== P.token) return;
      advanced = true;
      clearTimeout(P.timer);
      P.idx++;
      if (P.playing) playLine(L);
    };
    EL.speech.speak(line.text, { rate: 0.85 * rate, pitch: [1, 1.25, 0.85][speakers.indexOf(line.who) % 3], onend: next });
    const estimate = (line.text.length * 85) / rate + 900;
    P.timer = setTimeout(next, EL.speech.supported ? estimate * 1.8 + 1500 : estimate);
  }

  EL.actions["pl-toggle"] = (el) => {
    const L = EL.api.getLesson(el.dataset.l);
    if (P.id !== L.id) { P.id = L.id; P.idx = 0; P.finished = false; }
    if (P.playing) { stopPlayer(); syncPlayer(L); return; }
    if (P.finished) { P.idx = 0; P.finished = false; }
    P.playing = true;
    playLine(L);
  };

  EL.actions["pl-rate"] = (el) => {
    const L = EL.api.getLesson(el.dataset.l);
    st(L.id).rate = +el.dataset.rate;
    document.querySelectorAll("[data-action=pl-rate]").forEach((b) => b.classList.toggle("on", b === el));
    if (P.playing) { stopPlayer(); P.playing = true; playLine(L); }
  };

  EL.actions["pl-transcript"] = (el) => {
    const s = st(el.dataset.l);
    s.transcript = !s.transcript;
    document.getElementById("pl-transcript").hidden = !s.transcript;
    el.textContent = t(s.transcript ? "lesson.hideTranscript" : "lesson.showTranscript");
    el.setAttribute("aria-expanded", String(s.transcript));
  };

  function listening(L) {
    const s = st(L.id);
    const rates = [0.8, 1];
    return (
      '<section class="player card" id="player"><div class="pl-top">' +
      '<button class="play-btn" id="pl-btn" data-action="pl-toggle" data-l="' + L.id + '" aria-label="' + esc(t("lesson.play")) + '">' + EL.icon("play", 30) + "</button>" +
      '<div class="pl-info"><h3>' + esc(L.title) + '</h3><p class="muted" id="pl-count">' + esc(t("lesson.line", { n: 1, total: L.script.length })) + "</p></div></div>" +
      '<div class="bar" id="pl-bar"><i style="width:0%"></i></div>' +
      '<div class="pl-controls"><span class="muted">' + esc(t("lesson.speed")) + '</span><div class="seg">' +
      rates.map((r) => '<button class="' + (s.rate === r ? "on" : "") + '" data-action="pl-rate" data-l="' + L.id + '" data-rate="' + r + '">' + r + "x</button>").join("") + "</div>" +
      '<button class="btn btn-ghost btn-sm" data-action="pl-transcript" data-l="' + L.id + '" aria-expanded="false">' + esc(t("lesson.showTranscript")) + "</button></div>" +
      '<div id="pl-transcript" hidden>' +
      L.script.map((l, i) => '<div class="tl-line" data-i="' + i + '"><b>' + esc(l.who) + "</b><span>" + esc(l.text) + "</span></div>").join("") +
      (L.scriptSo ? '<div class="tl-so so"><b>' + esc(t("lesson.summarySo")) + "</b><p>" + esc(L.scriptSo) + "</p></div>" : "") + "</div></section>" +
      miniSection(L, "lesson.questions")
    );
  }

  /* ───────── speaking (practice mode: scores are simulated) ───────── */
  function pronScore(text, tries) {
    let h = 0;
    for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) % 97;
    return Math.min(98, 70 + (h % 17) + tries * 6);
  }

  function speakRoot(L) {
    const sp = st(L.id).speak;
    const practised = L.phrases.filter((_, i) => sp[i] && sp[i].state === "done").length;
    const cards = L.phrases.map((p, i) => {
      const s = sp[i] || { state: "idle" };
      let body = '<p class="ph-hint muted">' + esc(t("speak.tapMic")) + "</p>";
      if (s.state === "rec") {
        body = '<div class="listening"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><b>' + esc(t("speak.listening")) + "</b></div>";
      } else if (s.state === "done") {
        const msg = s.score >= 90 ? "speak.great" : s.score >= 80 ? "speak.good" : "speak.keep";
        body = '<div class="ph-result">' + EL.ui.ring(s.score, { size: 58, stroke: 7, label: "<b>" + s.score + "</b>" }) + "<div><strong>" + esc(t(msg)) + '</strong><p class="muted">' + esc(t("speak.tryAgain")) + "?</p></div></div>";
      }
      return (
        '<article class="phrase card ' + s.state + '"><div class="ph-text"><p class="ph-en">' + esc(p.en) + '</p><p class="ph-so so">' + esc(p.so) + "</p>" + (p.sounds ? '<p class="ph-sounds">' + esc(p.sounds) + "</p>" : "") + "</div>" +
        '<div class="ph-actions"><button class="btn btn-ghost btn-sm" data-action="say" data-say="' + esc(p.en) + '">' + EL.icon("volume", 18) + esc(t("lesson.listen")) + "</button>" +
        '<button class="mic' + (s.state === "rec" ? " rec" : "") + '" data-action="mic" data-l="' + L.id + '" data-p="' + i + '" aria-label="' + esc(t("speak.tapMic")) + '">' + EL.icon("mic", 28) + "</button></div>" + body + "</article>"
      );
    }).join("");
    return (
      '<div id="speak-root"><p class="speak-sum">' + EL.icon("target", 18) + esc(t("speak.practised", { n: practised, total: L.phrases.length })) + "</p>" +
      '<div class="stack">' + cards + '</div><p class="note">' + esc(t("speak.demo")) + "</p></div>"
    );
  }

  EL.actions.mic = (el) => {
    const id = el.dataset.l, pi = +el.dataset.p;
    const L = EL.api.getLesson(id);
    const sp = st(id).speak;
    const prev = sp[pi] || { tries: 0 };
    if (prev.state === "rec") return;
    EL.speech.stop();
    sp[pi] = { state: "rec", tries: prev.tries };
    replaceNode("#speak-root", speakRoot(L));
    setTimeout(() => {
      sp[pi] = { state: "done", tries: prev.tries + 1, score: pronScore(L.phrases[pi].en, prev.tries) };
      if (here(id)) replaceNode("#speak-root", speakRoot(L));
    }, 2400);
  };

  /* ───────── reading ───────── */
  function reading(L) {
    return (
      '<article class="story card">' +
      L.paragraphs.map((p) =>
