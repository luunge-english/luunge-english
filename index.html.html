<style>
/* English Learning – phase 1 styles

   COLOUR SYSTEM
   1. Brand palette (the only colours chosen by hand):
        --c-bg      #F8F4F1  page background
        --c-card    #FFFFFF  cards, sheets, inputs
        --c-text    #191D24  primary text
        --c-accent  #176F61  accent green: buttons, links, active states, progress
        --c-header  #D1D7DF  header bands
        --c-border  #EDEAE9  borders and dividers
   2. Shades made from that palette (muted text, darker/lighter green, red for errors only).
   3. Roles (--bg, --surface, --ink, --primary ...) that every component below uses.
   Change a colour once in 1 or 2 and the whole app follows.
   Layout: mobile first, one column; two columns from 940px. */

:root {
  /* 1. brand palette */
  --c-bg: #f8f4f1;
  --c-card: #ffffff;
  --c-text: #191d24;
  --c-accent: #176f61;
  --c-header: #d1d7df;
  --c-border: #edeae9;

  /* 2. derived shades */
  --c-text-2: #4f5663;       /* muted text */
  --c-accent-dark: #0f4a41;  /* pressed buttons, deep tiles */
  --c-accent-bright: #2c8a79;/* accent on dark backgrounds */
  --c-accent-soft: #e1eeea;  /* light green tint: highlights, selected states */
  --c-sage: #cfe3dd;         /* soft green tile */
  --c-danger: #b3261e;       /* errors only */
  --c-danger-soft: #fbe9e7;

  /* 3. roles */
  --font-display: "Sofia Sans", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Sofia Sans", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;

  --bg: var(--c-bg);
  --surface: var(--c-card);   /* cards */
  --paper: var(--c-card);     /* inputs, sheets, nav bar */
  --surface-2: var(--c-border);/* tracks, inactive chips, subtle fills */
  --header: var(--c-header);
  --ink: var(--c-text);
  --ink-2: var(--c-text-2);
  --line: var(--c-border);

  --primary: var(--c-accent);
  --primary-press: var(--c-accent-dark);
  --primary-soft: var(--c-accent-soft);
  --primary-ink: var(--c-accent-dark);
  --on-primary: #ffffff;
  --so-ink: var(--c-accent);  /* Somali text */

  /* the old "highlight" role is now the accent green too */
  --yellow: var(--c-accent);
  --yellow-press: var(--c-accent-dark);
  --yellow-soft: var(--c-accent-soft);
  --yellow-ink: var(--c-accent-dark);
  --on-yellow: #ffffff;

  --navy: var(--c-text);
  --chip-on: var(--c-text);
  --good: var(--c-accent);
  --good-soft: var(--c-accent-soft);
  --bad: var(--c-danger);
  --bad-soft: var(--c-danger-soft);

  --hero: var(--c-accent);
  --on-hero: #ffffff;
  --ring-track: var(--c-border);
  --focus: var(--c-accent);

  --shadow: 0 1px 2px rgba(25, 29, 36, 0.05), 0 10px 28px rgba(25, 29, 36, 0.07);
  --shadow-pop: 0 18px 50px rgba(25, 29, 36, 0.28);
  --r-xl: 28px;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  color-scheme: light;
}

/* ───────── base ───────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
dl, dd { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { flex: none; display: block; }
[hidden] { display: none !important; }

/* Somali text: a blue cue in content, quiet when stacked under a heading */
.so:not(.sub) { color: var(--so-ink); }
.so.sub { font-size: 0.78em; font-weight: 600; opacity: 0.75; line-height: 1.25; }
.lang-en:not(.peek-so) .so { display: none !important; }
.bi { display: inline-flex; flex-direction: column; gap: 1px; align-items: inherit; text-align: inherit; }

.muted { color: var(--ink-2); }
.meta { color: var(--ink-2); font-size: 0.85rem; font-weight: 600; }
.center { display: flex; justify-content: center; }
.stack { display: grid; gap: 14px; }
.label { display: block; font-weight: 800; font-size: 0.9rem; margin-bottom: 8px; }
.note { color: var(--ink-2); font-size: 0.85rem; text-align: center; margin-top: 14px; }

/* ───────── shell ───────── */
.app {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
body.has-nav .app { padding-bottom: calc(124px + env(safe-area-inset-bottom, 0px)); }
body.focus-mode.has-nav .app { padding-bottom: 40px; }
.screen.enter { animation: screen-in 0.3s ease-out; }
@keyframes screen-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 44px; }
.topbar .tb-title { flex: 1; min-width: 0; font-size: 1.2rem; overflow-wrap: anywhere; }
.tb-right { display: flex; align-items: center; }
.back, .back-spacer { width: 44px; height: 44px; flex: none; }
.back {
  display: grid; place-items: center; border-radius: 50%;
  background: var(--surface); border: 0;
  transition: transform 0.15s, background 0.15s;
}
.back:hover { transform: translateX(-2px); background: var(--surface-2); }
.page-head { margin: 8px 0 20px; display: grid; gap: 6px; }
.page-head h1 .sub, .greet h1 .sub { font-family: var(--font-body); font-size: 0.5em; font-weight: 700; }
.lead { margin: 14px 0 18px; display: grid; gap: 2px; color: var(--ink-2); }
.lead-line { margin: -6px 0 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 12px; }
.section-head.tight { margin: 0 0 14px; }
.section-head h2 { font-size: 1.1rem; font-weight: 700; }
.section-head .link { font-size: 0.82rem; font-weight: 600; color: var(--ink-2); }
.sub-h { font-size: 1rem; margin-bottom: 12px; }
.link { color: var(--primary-ink); font-weight: 800; }
.link:hover { text-decoration: underline; }
.link-btn { background: none; border: 0; padding: 6px 0; color: var(--primary-ink); font-weight: 800; text-align: left; }
.link-btn:hover { text-decoration: underline; }

/* ───────── cards, buttons, chips ───────── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.card.pad { padding: 20px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px; padding: 10px 22px; border: 2px solid transparent; border-radius: 999px;
  font-weight: 800; text-align: center; line-height: 1.2;
  transition: transform 0.15s, background 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn .bi { align-items: center; }
.btn-lg { min-height: 56px; padding: 12px 26px; font-size: 1.05rem; border-radius: 999px; }
.btn-sm { min-height: 40px; padding: 6px 16px; font-size: 0.9rem; border-radius: 999px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 8px 18px rgba(23, 111, 97, 0.28); }
.btn-primary:hover:not(:disabled) { background: var(--primary-press); }
.btn-yellow { background: var(--yellow); color: var(--on-yellow); }
.btn-yellow:hover:not(:disabled) { background: var(--yellow-press); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn-danger { background: var(--bad); color: #fff; }
.btn-danger-ghost { background: transparent; color: var(--bad); border-color: var(--bad); margin-top: 16px; }
.btn-danger-ghost:hover { background: var(--bad-soft); }

.icon-btn {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  border: 0; background: var(--primary-soft); color: var(--primary-ink); transition: transform 0.15s, background 0.15s;
}
.icon-btn:hover { transform: scale(1.08); }
.icon-btn.is-speaking { background: var(--yellow); color: var(--on-yellow); animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
.chip-blue { background: var(--primary-soft); color: var(--primary-ink); }
.chip-yellow { background: var(--yellow); color: var(--on-yellow); }
.chip-good { background: var(--good-soft); color: var(--good); }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 16px; border-radius: 999px;
  border: 2px solid transparent; background: var(--surface-2); font-weight: 700; transition: background 0.15s, border-color 0.15s;
}
.chip-btn.on { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }
.chip-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }

.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--primary); transform-origin: left; animation: grow 0.8s ease-out; }
.bar.good i { background: var(--good); }
.bar.on-hero { background: rgba(255, 255, 255, 0.25); }
.bar.on-hero i { background: #fff; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.ring-wrap { position: relative; flex: none; }
.ring { display: block; }
.ring-bg { stroke: var(--ring-track); }
.ring-fg { stroke: var(--primary); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--p)); animation: ring-in 1s ease-out; }
.ring[style*="--p:0;"] .ring-fg, .ring[style="--p:0"] .ring-fg { opacity: 0; }
@keyframes ring-in { from { stroke-dashoffset: 100; } }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--font-display); line-height: 1.1; }
.ring-label b { font-size: 1.4rem; font-weight: 600; }
.ring-label small { font-family: var(--font-body); font-weight: 700; color: var(--ink-2); font-size: 0.85rem; }
.ring-wrap.on-hero .ring-bg { stroke: rgba(255, 255, 255, 0.25); }
.ring-wrap.on-hero .ring-fg { stroke: #fff; }
.ring-wrap.on-hero .ring-label { color: var(--on-hero); }
.ring-wrap.on-hero .ring-label b { font-size: 1.7rem; }

.avatar {
  flex: none; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%;
  background: var(--yellow); color: var(--on-yellow); font-family: var(--font-display); font-weight: 800; font-size: 1.05rem;
}
.avatar.big { width: 72px; height: 72px; font-size: 1.6rem; }

.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label, .field .label { font-weight: 800; font-size: 0.9rem; margin: 0; }
.input-wrap {
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: var(--r-md);
  background: var(--paper); border: 2px solid var(--line); color: var(--ink-2); transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.input-wrap:focus-within { border-color: var(--primary); background: var(--paper); box-shadow: 0 0 0 4px var(--primary-soft); }
.input-wrap input, .input-wrap select { flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; color: var(--ink); outline: none; }
.input-wrap select { appearance: none; -webkit-appearance: none; padding-right: 8px; }
.select-wrap { padding-right: 6px; }
.input-wrap select option { background: var(--surface); color: var(--ink); }
.input-wrap [aria-invalid="true"] { color: var(--bad); }
.eye { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); display: grid; place-items: center; }
.field-err { min-height: 0; color: var(--bad); font-size: 0.85rem; font-weight: 700; }
.field-err:empty { display: none; }
textarea {
  width: 100%; padding: 12px 14px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--paper);
  color: var(--ink); resize: vertical; min-height: 84px; line-height: 1.5; outline: none;
}
textarea:focus, .fill input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); margin-top: 16px; }
.notice.ok { background: var(--good-soft); color: var(--good); font-weight: 700; }

.feedback { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); margin-top: 14px; animation: pop 0.25s ease-out; }
.feedback p { margin-top: 2px; }
.feedback.ok { background: var(--good-soft); color: var(--ink); }
.feedback.bad { background: var(--bad-soft); color: var(--ink); }
.fb-ic { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.feedback.ok .fb-ic { background: var(--good); }
.feedback.bad .fb-ic { background: var(--bad); }
.feedback.ok strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.98); } }

.opts { display: grid; gap: 10px; margin-top: 14px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 10px 14px; text-align: left;
  border: 2px solid var(--line); border-radius: var(--r-md); background: var(--paper); font-weight: 700;
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
}
.opt:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-1px); }
.opt:disabled { cursor: default; }
.opt-mark { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.opt.is-selected { border-color: var(--primary); background: var(--primary-soft); }
.opt.is-selected .opt-mark { border-color: var(--primary); background: var(--primary); }
.opt.is-correct { border-color: var(--good); background: var(--good-soft); }
.opt.is-correct .opt-mark { background: var(--good); border-color: var(--good); color: #fff; }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .opt-mark { background: var(--bad); border-color: var(--bad); color: #fff; }
.opts.two .opt { justify-content: center; text-align: center; font-size: 1.05rem; }
.opts.two .opt-mark { display: none; }
.blank { display: inline-block; width: 4.2ch; border-bottom: 3px solid var(--primary); transform: translateY(2px); margin: 0 2px; }

/* ───────── lesson rows & icon tiles ───────── */
.lesson-list { display: grid; gap: 10px; }
.lesson-row, .quiz-row {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line); transition: transform 0.15s, background 0.15s, border-color 0.15s;
}
.lesson-row:hover, .quiz-row:hover, .mc:hover, .xc:hover, .tile:hover { transform: translateY(-2px); }
.lesson-row:hover, .quiz-row:hover { border-color: var(--primary); }
.lr-icon { flex: none; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; }
.lr-icon.big { width: 60px; height: 60px; border-radius: 20px; }
.t-y { background: var(--yellow-soft); color: var(--yellow-ink); }
.t-b { background: var(--primary-soft); color: var(--primary-ink); }
.lr-body { flex: 1; min-width: 0; display: grid; gap: 1px; }
.lr-title { font-weight: 800; overflow-wrap: anywhere; }
.lr-so { font-size: 0.88rem; }
.lr-meta { font-size: 0.82rem; color: var(--ink-2); font-weight: 600; }
.lr-state { flex: none; color: var(--ink-2); display: flex; }
.done-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; }
.lesson-row.is-done .lr-title { color: var(--ink-2); }
.quiz-row.exam { background: var(--yellow-soft); }
.quiz-best { flex: none; }

.empty { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 60px 16px; }
.empty-art { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); }

/* ───────── solid colour tiles (shared) ───────── */
.tone-green { background: var(--c-accent); color: #fff; }
.tone-forest { background: var(--c-accent-dark); color: #fff; }
.tone-ink { background: var(--c-text); color: #fff; }
.tone-mist { background: var(--c-header); color: var(--c-text); }
.tone-sage { background: var(--c-sage); color: var(--c-text); }
.tone-mist .so, .tone-sage .so, .tone-mist .so:not(.sub), .tone-sage .so:not(.sub) { color: var(--c-accent-dark); }
.tone-green .so, .tone-forest .so, .tone-ink .so,
.tone-green .so:not(.sub), .tone-forest .so:not(.sub), .tone-ink .so:not(.sub) { color: rgba(255, 255, 255, 0.85); }
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; background: rgba(255, 255, 255, 0.22); color: inherit; }
.tone-mist .tag { background: rgba(25, 29, 36, 0.12); }
.tone-sage .tag { background: rgba(25, 29, 36, 0.12); }
.tone-mist .bar { background: rgba(25, 29, 36, 0.15); }
.tone-sage .bar { background: rgba(25, 29, 36, 0.15); }
.tone-mist .bar i { background: var(--c-text); }
.tone-sage .bar i { background: var(--c-text); }
.big-title { font-size: 2rem; font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }
.big-title b { display: block; font-weight: 800; }
.big-title .bi { align-items: flex-start; }

/* ───────── welcome (always dark navy) ───────── */
body[data-screen="welcome"] { background: var(--c-text); color: #fff; }
.welcome .btn-primary { background: var(--c-accent-bright); box-shadow: none; }
.welcome .btn-primary:hover:not(:disabled) { background: var(--c-accent); }
body[data-screen="welcome"] .app { padding-block: 20px 24px; max-width: 1040px; }
.welcome { min-height: calc(100svh - 44px); display: flex; flex-direction: column; max-width: 460px; margin: 0 auto; }
.w-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
.welcome-art { flex: 1; display: grid; place-items: center; padding: 18px 0 8px; min-height: 230px; }
.hero-svg { width: 100%; max-width: 340px; height: auto; display: block; }
.float-a { animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.welcome-copy { display: grid; gap: 14px; padding-bottom: 4px; }
.welcome-title { font-size: 2.7rem; font-weight: 300; line-height: 1.04; letter-spacing: -0.02em; }
.welcome-title b { display: block; font-weight: 800; }
.welcome-sub { color: rgba(255, 255, 255, 0.72); font-size: 1rem; max-width: 34ch; }
.welcome-cta { display: grid; gap: 14px; margin-top: 10px; }
.signin-line { text-align: center; color: rgba(255, 255, 255, 0.75); font-size: 0.95rem; }
.signin-line a { color: #fff; font-weight: 800; margin-left: 4px; }
.signin-line a:hover { text-decoration: underline; }
.welcome :focus-visible { outline-color: #fff; }

/* ───────── auth ───────── */
.auth { max-width: 460px; margin: 0 auto; display: grid; gap: 16px; }
.auth-card { padding: 4px 2px; background: transparent; display: grid; gap: 10px; }
.auth-card .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--ink); }
.auth-card h1 { margin-top: 12px; font-size: 2rem; font-weight: 800; }
.auth-card form { margin-top: 12px; }
.auth-card .link { display: inline-block; margin: -4px 0 18px; }
.switch-line { text-align: center; margin-top: 8px; color: var(--ink-2); font-weight: 600; }

/* ───────── home ───────── */
.dash { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "greet" "hero" "stats" "courses" "quick" "next" "brand"; }
.dash > * { min-width: 0; }
.dash .section-head { margin: 0 0 12px; }
.greet { display: flex; align-items: center; gap: 12px; }
.greet-text { flex: 1; min-width: 0; display: grid; gap: 0; }
.g-small { font-size: 0.8rem; color: var(--ink-2); font-weight: 500; line-height: 1.2; }
.g-small .so.sub { font-size: 1em; opacity: 0.8; }
.greet h1 { font-size: 1.2rem; font-weight: 800; overflow-wrap: anywhere; }
.round-btn { position: relative; flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); color: var(--ink); transition: transform 0.15s, background 0.15s; }
.round-btn:hover { transform: scale(1.06); background: var(--surface-2); }
.pip { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--c-danger); border: 2px solid var(--c-card); }

.cont { position: relative; overflow: hidden; display: grid; gap: 10px; padding: 22px; border-radius: 26px; background: var(--hero); color: #fff; }
.cont::before, .cont::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.08); pointer-events: none; }
.cont::before { width: 190px; height: 190px; right: -60px; top: -70px; }
.cont::after { width: 120px; height: 120px; right: 40px; bottom: -70px; }
.cont > * { position: relative; }
.cont-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.cont h2 { font-size: 1.55rem; font-weight: 800; line-height: 1.12; }
.cont .so, .cont .so:not(.sub) { color: rgba(255, 255, 255, 0.88); font-weight: 600; }
.cont-meta { font-size: 0.88rem; opacity: 0.9; font-weight: 600; }
.cont-sum { font-size: 0.95rem; opacity: 0.92; }
.cont-prog { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 0.85rem; font-weight: 700; }
.cont .bar { background: rgba(255, 255, 255, 0.25); }
.cont .bar i { background: #fff; }
.cont .btn-yellow { background: #fff; color: var(--c-accent); }
.cont .btn-yellow:hover:not(:disabled) { background: var(--c-accent-soft); }
.cont .btn { margin-top: 8px; }

.stats-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
.st { display: flex; align-items: center; gap: 10px; min-width: 0; }
.st-ic { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.st-ic.tone-mist { color: var(--c-text); }
.st-ic.tone-sage { color: var(--c-text); }
.st-txt { min-width: 0; }
.st small { display: block; font-size: 0.72rem; color: var(--ink-2); font-weight: 600; line-height: 1.2; }
.st b { display: block; font-size: 1rem; font-weight: 800; line-height: 1.25; }
.goal-line { grid-column: 1 / -1; display: grid; gap: 6px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 0.82rem; font-weight: 700; }
.goal-line .goal-top { display: flex; justify-content: space-between; gap: 8px; }

.hscroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; margin-inline: -16px; padding: 2px 16px 8px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.mc { flex: none; width: 178px; min-height: 198px; padding: 16px; border-radius: 22px; display: flex; flex-direction: column; gap: 8px; scroll-snap-align: start; transition: transform 0.15s; }
.mc-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; opacity: 0.92; }
.mc h3 { margin-top: auto; font-size: 1.12rem; font-weight: 700; line-height: 1.15; }
.mc .so { font-size: 0.8rem; font-weight: 600; margin-top: -4px; }
.mc-meta { font-size: 0.78rem; font-weight: 600; opacity: 0.92; }
.mc .bar, .xc .bar { height: 4px; background: rgba(255, 255, 255, 0.3); }
.mc .bar i, .xc .bar i { background: #fff; }
.tone-mist .bar i { background: var(--c-text); }
.tone-sage .bar i { background: var(--c-text); }

.qa-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { display: grid; justify-items: center; align-content: start; gap: 8px; padding: 14px 4px 12px; text-align: center; border-radius: 20px; transition: transform 0.15s; }
.tile-ic { width: 36px; height: 36px; display: grid; place-items: center; }
.tile-label { font-size: 0.74rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.tile-label .bi { align-items: center; }
.tile .so.sub, .tile .so { color: inherit !important; opacity: 0.8; }

/* ───────── courses ───────── */
.explore-head { margin: 6px 0 4px; display: grid; gap: 8px; }
.fchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 14px -16px 18px; padding: 0 16px; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; padding: 9px 18px; border-radius: 999px; border: 0; background: var(--surface-2); font-weight: 700; font-size: 0.86rem; color: var(--ink); transition: background 0.15s, color 0.15s; }
.fchip.on { background: var(--chip-on); color: #fff; }
.xgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.xc { position: relative; min-height: 186px; padding: 16px; border-radius: 22px; display: flex; flex-direction: column; gap: 6px; transition: transform 0.15s; }
.xc-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.xc-flag { font-size: 0.68rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: var(--c-text); }
.xc h3 { margin-top: auto; font-size: 1.12rem; font-weight: 700; line-height: 1.15; }
.xc .so { font-size: 0.8rem; font-weight: 600; margin-top: -2px; }
.xc-meta { font-size: 0.78rem; font-weight: 600; opacity: 0.92; margin-bottom: 4px; }
.course-hero { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px; border-radius: 26px; margin-bottom: 4px; }
.course-hero .ch-text { position: relative; display: grid; gap: 6px; min-width: 0; }
.course-hero h2 { font-size: 1.6rem; font-weight: 800; }
.course-hero .lv-desc { opacity: 0.92; }
.course-hero .meta { color: inherit; opacity: 0.9; }
.course-hero .ring-wrap { position: relative; }
.tone-mist .ring-wrap.on-hero .ring-bg { stroke: rgba(25, 29, 36, 0.15); }
.tone-sage .ring-wrap.on-hero .ring-bg { stroke: rgba(25, 29, 36, 0.15); }
.tone-mist .ring-wrap.on-hero .ring-fg { stroke: var(--c-text); }
.tone-sage .ring-wrap.on-hero .ring-fg { stroke: var(--c-text); }
.tone-mist .ring-wrap.on-hero .ring-label { color: var(--c-text); }
.tone-sage .ring-wrap.on-hero .ring-label { color: var(--c-text); }
.skill-hero { display: flex; gap: 16px; align-items: center; padding: 20px; margin-bottom: 18px; }
.skill-hero > div { display: grid; gap: 4px; min-width: 0; }
.empty-note { padding: 26px 16px; text-align: center; color: var(--ink-2); font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; }

/* ───────── lesson ───────── */
.chip-btn[data-action="peek-so"] { min-height: 36px; padding: 4px 12px; font-size: 0.85rem; }
.lesson-head { display: flex; gap: 16px; align-items: center; padding: 18px; }
.lesson-head > div { min-width: 0; display: grid; gap: 2px; }
.lesson-body { display: grid; gap: 14px; }
.lead-text { font-size: 1.05rem; }
.vocab-grid { display: grid; gap: 14px; }
.vocab-card { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
.vimg { flex: none; width: 84px; height: 84px; border-radius: 22px; background: var(--yellow-soft); display: grid; place-items: center; font-size: 2.6rem; line-height: 1; }
.vocab-card:nth-child(even) .vimg { background: var(--primary-soft); }
.vbody { flex: 1; min-width: 0; display: grid; gap: 4px; }
.vword { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.vword h3 { font-size: 1.25rem; overflow-wrap: anywhere; }
.vmean { font-weight: 800; font-size: 1.05rem; }
.vex { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 0.92rem; }
.vex .icon-btn { width: 34px; height: 34px; }
.forms, .rules, .examples { padding: 6px 18px; display: grid; }
.forms li, .rules li, .examples li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
.forms li:last-child, .rules li:last-child, .examples li:last-child { border: 0; }
.forms li { display: grid; gap: 2px; }
.form-en { font-weight: 800; }
.rules li { align-items: flex-start; }
.rule-ic { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; margin-top: 1px; }
.examples li { align-items: center; justify-content: space-between; }
.ex-en { font-weight: 800; }
.tip { display: flex; gap: 14px; padding: 16px 18px; border-radius: var(--r-lg); background: var(--yellow-soft); color: var(--yellow-ink); }
.tip p { color: var(--ink); }
.tip .so:not(.sub) { color: var(--yellow-ink); }
.tip strong { display: block; margin-bottom: 2px; }
.qcard { padding: 18px; }
.qc-text { font-weight: 800; font-size: 1.05rem; }

.player { padding: 20px; display: grid; gap: 16px; }
.pl-top { display: flex; align-items: center; gap: 16px; }
.pl-info { min-width: 0; display: grid; gap: 2px; }
.play-btn {
  flex: none; width: 68px; height: 68px; border-radius: 50%; border: 0; background: var(--yellow); color: var(--on-yellow);
  display: grid; place-items: center; transition: transform 0.15s;
}
.play-btn:hover { transform: scale(1.05); }
.play-btn:active { transform: scale(0.96); }
.pl-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.pl-controls .btn { margin-left: auto; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 800; color: var(--ink-2); }
.seg button.on { background: var(--paper); color: var(--primary-ink); box-shadow: var(--shadow); }
#pl-transcript { display: grid; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--line); }
.tl-line { display: grid; gap: 0; padding: 8px 12px; border-radius: 12px; transition: background 0.2s; }
.tl-line b { font-size: 0.8rem; color: var(--ink-2); }
.tl-line.active { background: var(--yellow-soft); }
.tl-so { padding: 8px 12px; }
.tl-so b { font-size: 0.8rem; }

.speak-sum { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-weight: 800; color: var(--primary-ink); }
.phrase { padding: 18px; display: grid; gap: 14px; transition: border-color 0.2s; }
.phrase.done { border-color: var(--good); }
.phrase.rec { border-color: var(--primary); }
.ph-text { display: grid; gap: 4px; }
.ph-en { font-family: var(--font-display); font-size: 1.25rem; font-weight: 500; line-height: 1.3; }
.ph-sounds { font-style: italic; color: var(--ink-2); font-size: 0.9rem; }
.ph-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mic {
  width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center;
  box-shadow: 0 6px 16px rgba(23, 111, 97, 0.35); transition: transform 0.15s;
}
.mic:hover { transform: scale(1.06); }
.mic.rec { background: var(--bad); animation: rec 1.1s ease-in-out infinite; }
@keyframes rec { 0% { box-shadow: 0 0 0 0 rgba(201, 46, 46, 0.5); } 100% { box-shadow: 0 0 0 18px rgba(201, 46, 46, 0); } }
.listening { display: flex; align-items: center; gap: 12px; color: var(--primary-ink); }
.wave { display: inline-flex; align-items: center; gap: 4px; height: 32px; }
.wave i { width: 5px; height: 100%; border-radius: 3px; background: var(--primary); animation: wave 0.9s ease-in-out infinite; transform: scaleY(0.3); }
.wave i:nth-child(2) { animation-delay: 0.1s; }
.wave i:nth-child(3) { animation-delay: 0.2s; }
.wave i:nth-child(4) { animation-delay: 0.3s; }
.wave i:nth-child(5) { animation-delay: 0.4s; }
@keyframes wave { 50% { transform: scaleY(1); } }
.ph-result { display: flex; align-items: center; gap: 14px; }
.ph-result .ring-label b { font-size: 1rem; }
.ph-hint { font-size: 0.9rem; }

.story { padding: 8px 20px; }
.para { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.para:last-child { border: 0; }
.para-en { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; font-size: 1.08rem; line-height: 1.6; }
.para-so { padding: 10px 14px; border-radius: 14px; background: var(--primary-soft); display: grid; gap: 2px; }
.para-so p { font-weight: 600; }
.so-tag { font-size: 0.72rem; font-weight: 800; color: var(--primary-ink); }
.gloss { display: flex; flex-wrap: wrap; gap: 10px; }
.gl { display: grid; gap: 0; padding: 8px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; transition: transform 0.15s, border-color 0.15s; }
.gl:hover { transform: translateY(-2px); border-color: var(--primary); }
.gl.is-speaking { border-color: var(--yellow); background: var(--yellow-soft); }

.write-card { padding: 18px; display: grid; gap: 10px; }
.w-num { font-weight: 800; font-size: 0.85rem; color: var(--primary-ink); }
.w-prompt { font-weight: 800; font-size: 1.05rem; }
.w-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.checklist { display: grid; gap: 4px; margin-top: 8px; }
.checklist li { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 0.92rem; }
.checklist li.ok { color: var(--good); }
.checklist li.bad { color: var(--bad); }
.model { padding: 12px 14px; border-radius: 14px; background: var(--yellow-soft); color: var(--ink); }
.finish { margin-top: 22px; padding: 18px; display: grid; gap: 14px; }
.finish.done { background: var(--good-soft); border-color: transparent; }
.fin-head { display: flex; align-items: center; gap: 12px; }
.fin-ic { width: 44px; height: 44px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; }
.finish.done h3 { color: var(--good); }

/* ───────── quiz ───────── */
.quiz-intro { padding: 28px 22px; display: grid; gap: 12px; justify-items: center; text-align: center; max-width: 560px; margin: 0 auto; }
.qi-ic { width: 76px; height: 76px; border-radius: 26px; display: grid; place-items: center; background: var(--yellow); color: var(--on-yellow); }
.qi-types { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.quiz-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; max-width: 720px; margin-inline: auto; }
.quiz-top .bar { flex: 1; height: 12px; }
.timer { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--yellow-soft); color: var(--yellow-ink); font-variant-numeric: tabular-nums; }
.q-count { max-width: 720px; margin: 0 auto 10px; font-weight: 800; color: var(--ink-2); }
.q-card { max-width: 720px; margin: 0 auto; padding: 22px; display: grid; gap: 4px; }
.q-card .chip { justify-self: start; margin-bottom: 8px; }
.q-text { font-size: 1.4rem; line-height: 1.35; }
.q-actions { margin-top: 18px; }
.fill { display: grid; gap: 6px; margin-top: 14px; }
.fill input { height: 56px; padding: 0 16px; border: 2px solid var(--line); border-radius: var(--r-md); background: var(--surface); font-size: 1.1rem; font-weight: 700; outline: none; }
.fill input:disabled { background: var(--surface-2); }
.hint { padding: 10px 14px; border-radius: 12px; background: var(--yellow-soft); color: var(--ink); }
.result { max-width: 560px; margin: 0 auto; padding: 28px 22px; display: grid; gap: 12px; justify-items: center; text-align: center; position: relative; overflow: hidden; }
.result h2 { margin-top: 6px; }
.result .bi { align-items: center; }
.res-actions { display: grid; gap: 10px; width: 100%; margin-top: 10px; }
.new-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: var(--yellow); color: var(--on-yellow); font-weight: 800; }
.burst { position: absolute; left: 50%; top: 150px; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 3px; background: var(--yellow); transform: rotate(var(--a)) translateY(0); opacity: 0; animation: burst 1s 0.5s ease-out; }
.burst i:nth-child(even) { background: var(--primary); }
@keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-130px); } }
.review { max-width: 720px; margin: 0 auto; padding: 6px 18px; }
.review li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.review li:last-child { border: 0; }
.rv-ic { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.review li.ok .rv-ic { background: var(--good); }
.review li.bad .rv-ic { background: var(--bad); }
.rv-q { font-weight: 800; }
.rv-a { color: var(--good); font-weight: 700; }
.section-head + .review, .review + * { margin-top: 0; }
body[data-screen="quiz"] .section-head { max-width: 720px; margin-inline: auto; }

/* ───────── progress ───────── */
.prog-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "overall" "streak" "levels" "quiz" "week" "badges"; }
.prog-grid > * { min-width: 0; }
.prog-grid > section.card { padding: 20px; }
.overall { display: flex; align-items: center; gap: 20px; }
.ov-text { display: grid; gap: 12px; min-width: 0; }
.stats { display: grid; gap: 10px; }
.stats dt { font-size: 0.82rem; color: var(--ink-2); font-weight: 700; }
.stats dd { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; }
.streak-card { display: grid; gap: 16px; align-content: start; }
.lv-prog, .score-list { display: grid; gap: 16px; }
.lp-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 0.95rem; }
.score-list small { display: block; margin-top: 4px; }
.score-list + .sub-h { margin-top: 22px; margin-bottom: 4px; }
.recent { margin-top: 6px; }
.recent li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.9rem; }
.recent li span:first-child { flex: 1; min-width: 0; font-weight: 700; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; height: 200px; }
.bcol { display: grid; grid-template-rows: 1fr auto; gap: 6px; height: 100%; justify-items: center; min-height: 0; }
.bval { font-size: 0.78rem; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; min-height: 1.2em; text-align: center; }
.btrack { width: 100%; max-width: 44px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: 4px; min-height: 0; }
.btrack i { flex: none; }
.btrack i { display: block; width: 100%; border-radius: 10px 10px 4px 4px; background: var(--primary); animation: rise 0.7s ease-out; transform-origin: bottom; }
.bcol.today .btrack i { background: var(--c-accent-dark); }
.bcol.future .btrack i { background: transparent; }
.blab { font-size: 0.78rem; font-weight: 800; color: var(--ink-2); }
.bcol.today .blab { color: var(--primary-ink); }
@keyframes rise { from { transform: scaleY(0); } }
.badge-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.badge { display: grid; justify-items: center; gap: 3px; padding: 18px 12px; text-align: center; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.badge-ic { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); margin-bottom: 6px; }
.badge.earned { background: var(--yellow-soft); border-color: var(--c-accent-soft); }
.badge.earned .badge-ic { background: var(--yellow); color: var(--on-yellow); }
.badge:not(.earned) .badge-title, .badge:not(.earned) .badge-desc { color: var(--ink-2); }
.badge-title { font-weight: 800; }
.badge-so { font-size: 0.82rem; font-weight: 700; }
.badge.earned .badge-so:not(.sub) { color: var(--yellow-ink); }
.badge-desc { font-size: 0.8rem; color: var(--ink-2); }
.badge-prog { width: 100%; display: grid; gap: 4px; margin-top: 8px; }
.badge-prog .bar { height: 8px; }
.badge-prog small { font-weight: 800; color: var(--ink-2); }

/* ───────── profile & settings ───────── */
.profile-grid, .settings-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.profile-grid > *, .settings-grid > * { min-width: 0; }
.profile-card { padding: 22px; display: grid; gap: 16px; justify-items: center; text-align: center; align-content: start; }
.profile-card > div { display: grid; gap: 4px; justify-items: center; min-width: 0; }
.profile-card h2 { overflow-wrap: anywhere; }
.pstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; padding-top: 16px; border-top: 1px dashed var(--line); }
.pstats dd { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; }
.pstats dt { font-size: 0.8rem; color: var(--ink-2); font-weight: 700; }
.pstats div { display: grid; gap: 0; }
.pstats div { grid-template-areas: "v" "l"; }
.pstats dd { grid-area: v; }
.pstats dt { grid-area: l; }
.menu { padding: 6px 8px; }
.menu-row { display: flex; align-items: center; gap: 14px; padding: 14px 10px; border-radius: 14px; transition: background 0.15s; color: var(--ink-2); }
.menu-row:hover { background: var(--surface-2); }
.menu-row + .menu-row { border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; }
.mr-ic { flex: none; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); }
.mr-label { flex: 1; min-width: 0; color: var(--ink); font-weight: 800; }
.mr-val { font-size: 0.88rem; font-weight: 700; }
.form-card { max-width: 560px; }
.radio-list { display: grid; gap: 12px; max-width: 560px; }
.radio-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 18px; text-align: left; transition: border-color 0.15s, background 0.15s; }
.radio-card.on { border-color: var(--primary); background: var(--primary-soft); }
.radio-dot { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.radio-card.on .radio-dot { border-color: var(--primary); }
.radio-card.on .radio-dot::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
.rc-text { display: grid; gap: 1px; min-width: 0; }
.rc-text span { color: var(--ink-2); font-size: 0.9rem; }
.toggles { max-width: 560px; margin-bottom: 14px; padding: 4px 18px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.toggle-row:last-child { border: 0; }
.toggle-row > div { min-width: 0; }
.toggle-row p { font-size: 0.88rem; }
.switch { flex: none; position: relative; width: 54px; height: 32px; border-radius: 999px; border: 0; background: var(--line); transition: background 0.2s; }
.switch i { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); transition: transform 0.2s; }
.switch.on { background: var(--primary); }
.switch.on i { transform: translateX(22px); }
.card.dim { opacity: 0.6; }
.card.pad.dim, .toggles + .card { max-width: 560px; }
.kv { display: grid; gap: 12px; margin-bottom: 16px; }
.kv dt { font-size: 0.82rem; color: var(--ink-2); font-weight: 700; }
.kv dd { font-weight: 800; overflow-wrap: anywhere; }
.settings-grid .card.pad { display: grid; gap: 4px; align-content: start; }
.settings-grid .card.pad .btn { justify-self: start; margin-top: 10px; }
.danger-zone .sub-h { color: var(--bad); }

/* ───────── bottom navigation ───────── */
.nav {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 32px)); height: 64px;
  display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: center; padding: 0 6px;
  border-radius: 32px; background: var(--paper); box-shadow: 0 10px 34px rgba(25, 29, 36, 0.18), 0 1px 3px rgba(25, 29, 36, 0.08);
}
.nav-item { position: relative; display: grid; place-items: center; height: 100%; color: var(--ink-2); transition: color 0.2s; }
.nav-ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; transition: background 0.2s, transform 0.2s; }
.nav-item:hover .nav-ic { background: var(--surface); }
.nav-dot { position: absolute; bottom: 7px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--primary); transform: scale(0); transition: transform 0.2s; }
.nav-item.active { color: var(--primary); }
.nav-item.active .nav-dot { transform: scale(1); }
.nav-fab {
  justify-self: center; align-self: start; margin-top: -26px; width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center; background: var(--primary); color: #fff;
  box-shadow: 0 0 0 6px var(--paper), 0 12px 24px rgba(23, 111, 97, 0.45); transition: transform 0.15s;
}
.nav-fab:hover { transform: scale(1.06); }
.nav-fab:active { transform: scale(0.96); }
.nav-fab .ic { margin-left: 3px; }

/* ───────── toast & modal ───────── */
.toast {
