    if (l === "so") return "<span>" + esc(so) + "</span>";
    if (l === "en") return "<span>" + esc(en) + "</span>";
    return '<span class="bi"><span>' + esc(en) + '</span><span class="so sub">' + esc(so) + "</span></span>";
  };

  const STEPS = [
    ["Go to supabase.com, create a free account and tap New project. Choose a database password and the region nearest to you.", "Tag supabase.com, samee akoon bilaash ah oo taabo New project. Dooro erayga sirta ah ee database-ka iyo gobolka kuu dhow."],
    ["Wait about two minutes until the project is ready. Then open SQL Editor and tap New query.", "Sug ilaa laba daqiiqo ilaa mashruucu diyaar noqdo. Kadib fur SQL Editor oo taabo New query."],
    ["Tap “Copy setup SQL” below, paste it into the editor and tap Run. It should say Success.", "Taabo “Copy setup SQL” hoos, ku dhejiso editor-ka oo taabo Run. Waa inay ku tidhaahdo Success."],
    ["Open Authentication, then Sign In / Providers, then Email. Turn OFF “Confirm email” and Save.", "Fur Authentication, kadib Sign In / Providers, kadib Email. Dami “Confirm email” oo Save."],
    ["Open Project Settings, then API (or API Keys). Copy the Project URL and the anon / publishable key and paste them below.", "Fur Project Settings, kadib API (ama API Keys). Koobiyee Project URL iyo furaha anon / publishable oo ku dhejiso hoos."],
    ["Tap Test connection, then Save. After that, create the admin account on the next screen.", "Taabo Test connection, kadib Save. Dabadeed samee akoonka maamulaha shaashadda xigta."]
  ];

  function say(msg, kind) {
    const el = document.getElementById("sv-msg");
    if (!el) return;
    el.className = "notice " + (kind || "");
    el.hidden = !msg;
    el.innerHTML = msg ? "<p>" + esc(msg) + "</p>" : "";
  }
  const readForm = () => ({ url: (document.getElementById("sv-url") || {}).value || "", key: (document.getElementById("sv-key") || {}).value || "" });
  const result = (r) => {
    if (r.ok) return [tx("Connected. The tables are ready.", "Waa xiran yahay. Miisaska way diyaar yihiin."), "ok"];
    const m = {
      url: tx("Enter the Project URL, like https://abcd.supabase.co", "Geli Project URL, tusaale https://abcd.supabase.co"),
      key: tx("The key was not accepted. Copy the anon / publishable key again.", "Furahan lama aqbalin. Mar kale koobiyee furaha anon / publishable."),
      tables: tx("Connected, but the tables are missing. Run the setup SQL (step 3) first.", "Waa xiran yahay, laakiin miisaska ma jiraan. Marka hore ku fuliso SQL-ka (talaabada 3)."),
      network: tx("Cannot reach this address. Check the URL and your internet.", "Cinwaankan lama gaari karo. Hubi URL-ka iyo internetka."),
      server: tx("The server answered with an error", "Server-ku wuxuu soo celiyay cillad") + (r.message ? ": " + r.message : "")
    };
    return [m[r.error] || m.server, "bad"];
  };

  S.server = {
    hideNav: true,
    render() {
      const on = EL.cloud.enabled();
      const baked = EL.cloud.baked();
      const c = EL.cloud.config();
      let host = "";
      try { host = c.url.replace(/^https?:\/\//, ""); } catch (e) { host = c.url; }
      return (
        EL.ui.topbar({ back: EL.api.isAdmin() ? "content" : "welcome", title: esc(tx("Server", "Server-ka")) }) +
        '<section class="card sv-status"><span class="lr-icon t-' + (on ? "y" : "b") + '">' + EL.icon("globe", 22) + "</span>" +
        '<div class="cm-body"><b>' + (on ? bx("Connected", "Waa xiran yahay") : bx("Not connected", "Lama xirin")) + "</b><small>" +
        (on ? esc(host) : esc(tx("Using this phone only", "Waxaa la isticmaalayaa taleefankan oo keliya"))) + "</small></div></section>" +
        '<p class="muted st-note">' + bx(
          "With a server, students and lessons are shared between all phones. Without one, the app keeps working on this phone only.",
          "Server-ka la helo, ardayda iyo casharradu waxay noqonayaan kuwo taleefan kasta wadaaga. Server la'aan, appku wuxuu ka shaqeynayaa taleefankan oo keliya."
        ) + "</p>" +
        (baked
          ? '<section class="card sv-card"><p>' + bx("This copy of the app is already connected to your server.", "Nuqulkan ayaa horay ugu xiran server-kaaga.") + "</p></section>"
          : '<section class="card sv-card"><h2>' + bx("Set up", "Dejin") + '</h2><ol class="sv-steps">' + STEPS.map((s) => "<li>" + bx(s[0], s[1]) + "</li>").join("") + "</ol>" +
            '<button class="btn btn-ghost btn-block" data-action="server-copy">' + EL.icon("cards", 18) + esc(tx("Copy setup SQL", "Koobiyee SQL-ka dejinta")) + "</button>" +
            '<div id="sv-sqlbox"></div></section>' +
            '<section class="card sv-card"><h2>' + bx("Connect", "Xiriir") + "</h2>" +
            '<div class="field"><label for="sv-url">Project URL</label><div class="input-wrap">' + EL.icon("globe", 20) + '<input id="sv-url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://abcd.supabase.co" value="' + esc(on ? c.url : "") + '"/></div></div>' +
            '<div class="field"><label for="sv-key">anon / publishable key</label><div class="input-wrap">' + EL.icon("lock", 20) + '<input id="sv-key" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(on ? c.key : "") + '"/></div></div>' +
            '<div id="sv-msg" class="notice" hidden></div>' +
            '<div class="sv-actions"><button class="btn btn-ghost" data-action="server-test">' + esc(tx("Test connection", "Tijaabi xiriirka")) + '</button>' +
            '<button class="btn btn-primary" data-action="server-save">' + esc(tx("Save", "Kaydi")) + "</button></div>" +
            (on ? '<button class="btn btn-danger-ghost btn-block" data-action="server-disconnect">' + esc(tx("Disconnect (use this phone only)", "Jooji (taleefankan oo keliya)")) + "</button>" : "") + "</section>")
      );
    }
  };

  EL.actions["server-copy"] = () => {
    const sql = (EL.data && EL.data.setupSql) || "";
    const fallback = () => {
      const box = document.getElementById("sv-sqlbox");
      if (!box) return;
      box.innerHTML = '<textarea id="sv-sql" class="sv-sql" readonly rows="8"></textarea><p class="muted">' + esc(tx("Select all of this text and copy it.", "Dooro qoraalkan oo dhan oo koobiyee.")) + "</p>";
      const ta = document.getElementById("sv-sql");
      ta.value = sql;
      ta.focus(); ta.select();
    };
    try {
      navigator.clipboard.writeText(sql).then(() => EL.ui.toast(tx("SQL copied", "SQL waa la koobiyeeyay")), fallback);
    } catch (e) { fallback(); }
  };

  EL.actions["server-test"] = () => {
    const v = readForm();
    say(tx("Testing…", "Waa la tijaabinayaa…"), "");
    EL.cloud.test(v.url, v.key).then((r) => { const m = result(r); say(m[0], m[1]); });
  };

  EL.actions["server-save"] = () => {
    const v = readForm();
    say(tx("Testing…", "Waa la tijaabinayaa…"), "");
    EL.cloud.test(v.url, v.key).then((r) => {
      if (!r.ok) { const m = result(r); say(m[0], m[1]); return; }
      EL.api.logout();
      EL.cloud.setConfig(v.url, v.key);
      EL.ui.toast(tx("Connected", "Waa la xiray"));
      EL.app.go("adminlogin");
    });
  };

  EL.actions["server-disconnect"] = () => {
    EL.ui.modal({
      title: tx("Disconnect the server?", "Ma jooji server-ka?"),
      body: tx("This phone goes back to working on its own. Nothing is deleted from the server.", "Taleefankan wuxuu ku laabanayaa inuu keligiis shaqeeyo. Server-ka waxba lagama tirtirayo."),
      confirm: tx("Disconnect", "Jooji"), danger: true,
      onConfirm: () => { EL.api.logout(); EL.cloud.clearConfig(); EL.app.go("welcome"); }
    });
  };
})((window.EL = window.EL || {}));

</script>
<script>EL.start();</script>

</body>
</html>
