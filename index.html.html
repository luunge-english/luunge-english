        '<div class="para"><div class="para-en"><p>' + esc(p.en) + "</p>" + sayBtn(p.en, p.en.slice(0, 24) + "…") + "</div>" + (p.so ? '<div class="para-so so"><span class="so-tag">' + esc(t("common.somali")) + "</span><p>" + esc(p.so) + "</p></div>" : "") + "</div>"
      ).join("") + "</article>" +
      (L.glossary && L.glossary.length
        ? '<div class="section-head"><h2>' + bi("lesson.glossary") + '</h2></div><div class="gloss">' +
          L.glossary.map((g) => '<button class="gl" data-action="say" data-say="' + esc(g.en) + '"><b>' + esc(g.en) + '</b><span class="so">' + esc(g.so) + "</span></button>").join("") + "</div>"
        : "") +
      miniSection(L, "lesson.readQuestions")
    );
  }

  /* ───────── writing ───────── */
  function checkText(T, text) {
    const tx = text.trim();
    const words = tx.split(/\s+/).filter(Boolean);
    const tokens = (tx.toLowerCase().replace(/[’]/g, "'").match(/[a-z']+/g) || []);
    const kws = T.keywords.map((k) => k.replace(/[’]/g, "'").toLowerCase());
    return [
      { ok: /^[A-Z]/.test(tx), label: t("write.capital") },
      { ok: /[.!?]["”’']?$/.test(tx), label: t("write.punct") },
      { ok: words.length >= T.minWords, label: t("write.words", { n: T.minWords }) },
      { ok: kws.some((k) => tokens.indexOf(k) > -1), label: t("write.keyword", { w: T.keywords.join(" / ") }) }
    ].filter((r, i) => i < 3 || kws.length);
  }

  function writeTask(L, ti) {
    const T = L.tasks[ti];
    const s = st(L.id).write[ti] || {};
    const text = s.text !== undefined ? s.text : T.starter ? T.starter + " " : "";
    const res = s.res;
    const pass = res && res.every((r) => r.ok);
    return (
      '<article class="write-card card" data-wid="' + L.id + "-" + ti + '">' +
      '<p class="w-num">' + esc(t("write.task", { n: ti + 1 })) + '</p><p class="w-prompt">' + esc(T.prompt) + '</p>' + (T.promptSo ? '<p class="so">' + esc(T.promptSo) + "</p>" : "") +
      '<label class="sr-only" for="w-' + L.id + "-" + ti + '">' + esc(t("write.yourAnswer")) + "</label>" +
      '<textarea id="w-' + L.id + "-" + ti + '" rows="3" data-input="write" data-l="' + L.id + '" data-t="' + ti + '" spellcheck="false">' + esc(text) + "</textarea>" +
      '<div class="w-actions"><button class="btn btn-primary" data-action="w-check" data-l="' + L.id + '" data-t="' + ti + '">' + esc(t("write.check")) + "</button>" +
      (T.model ? '<button class="btn btn-ghost" data-action="w-model" data-l="' + L.id + '" data-t="' + ti + '">' + esc(t(s.model ? "write.hideModel" : "write.model")) + "</button>" : "") + "</div>" +
      (res
        ? '<div class="feedback ' + (pass ? "ok" : "bad") + '"><span class="fb-ic">' + EL.icon(pass ? "check" : "x", 20) + "</span><div><strong>" + esc(t(pass ? "write.pass" : "write.almost")) + '</strong><ul class="checklist">' +
          res.map((r) => '<li class="' + (r.ok ? "ok" : "bad") + '">' + EL.icon(r.ok ? "check" : "x", 16) + "<span>" + esc(r.label) + "</span></li>").join("") + "</ul></div></div>"
        : "") +
      (s.model ? '<div class="model"><b>' + esc(t("write.model")) + ":</b> " + esc(T.model) + "</div>" : "") +
      "</article>"
    );
  }

  const taskNode = (id, ti) => '[data-wid="' + id + "-" + ti + '"]';
  EL.inputs.write = (el) => {
    const s = st(el.dataset.l).write;
    const ti = el.dataset.t;
    s[ti] = Object.assign(s[ti] || {}, { text: el.value });
  };
  EL.actions["w-check"] = (el) => {
    const L = EL.api.getLesson(el.dataset.l), ti = +el.dataset.t;
    const area = document.getElementById("w-" + L.id + "-" + ti);
    const s = st(L.id).write;
    s[ti] = Object.assign(s[ti] || {}, { text: area.value, res: checkText(L.tasks[ti], area.value) });
    replaceNode(taskNode(L.id, ti), writeTask(L, ti));
  };
  EL.actions["w-model"] = (el) => {
    const L = EL.api.getLesson(el.dataset.l), ti = +el.dataset.t;
    const area = document.getElementById("w-" + L.id + "-" + ti);
    const s = st(L.id).write;
    s[ti] = Object.assign(s[ti] || {}, { text: area.value });
    s[ti].model = !s[ti].model;
    replaceNode(taskNode(L.id, ti), writeTask(L, ti));
  };

  function writing(L) {
    return '<div class="stack">' + L.tasks.map((_, i) => writeTask(L, i)).join("") + "</div>";
  }

  /* ───────── finish card ───────── */
  function finish(L) {
    const next = EL.api.getNextLesson(L.id);
    const nextBtn = next
      ? '<a class="btn btn-primary btn-lg btn-block" href="#lesson-' + next.id + '">' + esc(t("lesson.next")) + ": " + esc(next.title) + EL.icon("chevron", 18) + "</a>"
      : '<a class="btn btn-primary btn-lg btn-block" href="#quiz-' + L.level + '">' + EL.icon("help", 20) + esc(t("lesson.levelQuiz")) + "</a>";
    if (L.done) {
      return '<section class="finish card done" id="finish"><div class="fin-head"><span class="fin-ic">' + EL.icon("check", 26) + "</span><h3>" + esc(t("lesson.completed")) + "</h3></div>" + nextBtn + "</section>";
    }
    return '<section class="finish card" id="finish"><button class="btn btn-yellow btn-lg btn-block" data-action="complete" data-l="' + L.id + '">' + EL.icon("check", 20) + esc(t("lesson.complete")) + "</button></section>";
  }

  EL.actions.complete = (el) => {
    const id = el.dataset.l;
    const r = EL.api.completeLesson(id);
    replaceNode("#finish", finish(EL.api.getLesson(id)));
    let msg = t("lesson.completedToast");
    if (r.newBadges.length) msg += " " + t("lesson.badge", { name: r.newBadges[0].title });
    EL.ui.toast(msg);
  };

  EL.actions["peek-so"] = (el) => {
    const on = document.body.classList.toggle("peek-so");
    el.classList.toggle("on", on);
    el.setAttribute("aria-pressed", String(on));
  };

  const bodies = { vocabulary, grammar, listening, speaking: (L) => speakRoot(L), reading, writing };

  S.lesson = {
    tab: "courses",
    hideNav: true,
    render(id) {
      const L = EL.api.getLesson(id);
      if (!L) return EL.ui.notFound();
      const toggle = EL.lang() === "en"
        ? '<button class="chip-btn" data-action="peek-so" aria-pressed="false">' + EL.icon("globe", 16) + esc(t("common.somali")) + "</button>"
        : "";
      return (
        EL.ui.topbar({ back: "course-" + L.level, title: esc(t("type." + L.type)), right: toggle }) +
        '<section class="lesson-head card"><span class="lr-icon big t-' + EL.typeTone(L.type) + '">' + EL.icon(EL.typeIcon(L.type), 28) + "</span>" +
        "<div><h2>" + esc(L.title) + '</h2><p class="so">' + esc(L.so) + '</p><p class="meta">' + esc(t("common.min", { n: L.minutes })) + " · " + esc(L.levelTitle) + "</p></div></section>" +
        '<div class="lead">' + EL.pair(L.summary, L.summarySo) + "</div>" +
        '<div class="lesson-body">' + bodies[L.type](L) + "</div>" + finish(L)
      );
    },
    mount(id) {
      if (P.id !== id) { stopPlayer(); P.id = id; P.idx = 0; P.finished = false; }
      EL.onLeave(() => {
        stopPlayer();
        P.finished = false;
        P.idx = 0;
        document.body.classList.remove("peek-so");
      });
    }
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* Quizzes hub, quiz player (multiple choice, true/false, fill in the blank), results and retry. */
(function (EL) {
  const S = (EL.screens = EL.screens || {});
  const esc = EL.esc, t = EL.t, bi = EL.bi;

  const Q = { id: null, quiz: null, phase: "intro", i: 0, sel: null, checked: false, answers: [], saved: false, left: 0, newBadge: null };

  const mmss = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  const blankify = (s) => esc(s).replace(/_{3,}/g, '<span class="blank"></span>');
  const norm = (v) => String(v == null ? "" : v).trim().toLowerCase().replace(/[’]/g, "'");

  function setup(id) {
    const quiz = EL.api.getQuiz(id);
    Q.id = id; Q.quiz = quiz; Q.phase = "intro"; Q.i = 0; Q.sel = null; Q.checked = false;
    Q.answers = []; Q.saved = false; Q.newBadge = null; Q.left = quiz ? quiz.timeLimit : 0;
  }

  function evaluate(q, sel) {
    if (q.type === "fill") return q.answers.indexOf(norm(sel)) > -1;
    return sel === q.a;
  }
  function correctText(q) {
    if (q.type === "fill") return q.answers[0];
    if (q.type === "tf") return q.a ? t("quiz.true") : t("quiz.false");
    return q.options[q.a];
  }
  function givenText(q, sel) {
    if (sel === null || sel === undefined || sel === "") return t("quiz.noAnswer");
    if (q.type === "fill") return String(sel);
    if (q.type === "tf") return sel ? t("quiz.true") : t("quiz.false");
    return q.options[sel];
  }
  const typeLabel = (q) => t(q.type === "mcq" ? "quiz.mcq" : q.type === "tf" ? "quiz.tf" : "quiz.fill");

  /* ───────── hub ───────── */
  function hubRow(q) {
    const isExam = q.id === "exam";
    return (
      '<a class="quiz-row card' + (isExam ? " exam" : "") + '" href="#quiz-' + q.id + '">' +
      '<span class="lr-icon t-' + (isExam ? "y" : "b") + '">' + EL.icon(isExam ? "trophy" : "help", 22) + "</span>" +
      '<span class="lr-body"><span class="lr-title">' + esc(q.title) + '</span><span class="lr-so so">' + esc(q.so) + '</span><span class="lr-meta">' +
      esc(t("courses.questions", { n: q.count })) + (isExam ? " · 15 " + esc(t("common.min", { n: "" }).trim()) : "") + "</span></span>" +
      '<span class="quiz-best">' + (q.best === null ? '<span class="chip">' + esc(t("courses.notTaken")) + "</span>" : '<span class="chip ' + (q.best >= q.passPct ? "chip-good" : "chip-yellow") + '"><b>' + q.best + "%</b></span>") + "</span>" +
      '<span class="lr-state">' + EL.icon("chevron", 20) + "</span></a>"
    );
  }

  S.quizzes = {
    tab: "home",
    render() {
      const list = EL.api.getQuizzes();
      return (
        EL.ui.topbar({ back: "home", title: esc(t("quiz.title")) }) +
        '<p class="muted lead-line">' + bi("quiz.sub") + "</p>" +
        '<div class="stack">' + list.map(hubRow).join("") + "</div>"
      );
    }
  };

  /* ───────── quiz screen ───────── */
  function intro() {
    const q = Q.quiz;
    const exam = q.kind === "exam";
    const text = exam
      ? t("quiz.examIntro", { n: q.questions.length, m: q.timeLimit / 60, p: q.passPct })
      : t("quiz.intro", { n: q.questions.length });
    return (
      EL.ui.topbar({ back: "quizzes", title: esc(q.title) }) +
      '<section class="quiz-intro card"><span class="qi-ic">' + EL.icon(exam ? "trophy" : "help", 34) + "</span>" +
      "<h2>" + esc(q.title) + '</h2><p class="so">' + esc(q.so) + "</p>" +
      '<p class="qi-text">' + esc(text) + "</p>" +
      '<div class="qi-types"><span class="chip chip-blue">' + esc(t("quiz.mcq")) + '</span><span class="chip chip-blue">' + esc(t("quiz.tf")) + '</span><span class="chip chip-blue">' + esc(t("quiz.fill")) + "</span></div>" +
      '<p class="muted">' + esc(t("quiz.passMark", { n: q.passPct })) + "</p>" +
      (q.questions.length
        ? '<button class="btn btn-primary btn-lg btn-block" data-action="q-start">' + esc(t(exam ? "quiz.startExam" : "quiz.start")) + "</button>"
        : '<p class="muted">' + esc(t("content.noQuestions")) + "</p>") +
      "</section>"
    );
  }

  function options(q) {
    if (q.type === "fill") {
      const shown = Q.checked ? (Q.answers[Q.i] && Q.answers[Q.i].sel) || "" : Q.sel || "";
      return (
        '<div class="fill"><label class="sr-only" for="q-fill">' + esc(t("quiz.type")) + "</label>" +
        '<input id="q-fill" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(t("quiz.type")) + '" value="' + esc(shown) + '" data-input="qfill" data-enter="q-check"' + (Q.checked ? " disabled" : "") + " />" +
        (Q.checked ? "" : '<button class="link-btn" data-action="q-hint">' + esc(t("quiz.showHint")) + '</button><div class="hint" id="q-hint" hidden><b>' + esc(t("quiz.hint")) + ":</b> " + esc(q.hint) + '<span class="so"> ' + esc(q.hintSo) + "</span></div>") +
        "</div>"
      );
    }
    const list = q.type === "tf"
      ? [{ v: true, l: t("quiz.true") }, { v: false, l: t("quiz.false") }]
      : q.options.map((o, i) => ({ v: i, l: o }));
    return (
      '<div class="opts' + (q.type === "tf" ? " two" : "") + '">' +
      list.map((o) => {
        let c = "opt";
        let mark = "";
        if (Q.checked) {
          if (o.v === q.a) { c += " is-correct"; mark = EL.icon("check", 18); }
          else if (o.v === Q.sel) { c += " is-wrong"; mark = EL.icon("x", 18); }
        } else if (o.v === Q.sel) c += " is-selected";
        return '<button class="' + c + '" data-action="q-pick" data-v="' + o.v + '"' + (Q.checked ? " disabled" : "") + '><span class="opt-mark">' + mark + "</span><span>" + esc(o.l) + "</span></button>";
      }).join("") + "</div>"
    );
  }

  function play() {
    const q = Q.quiz.questions[Q.i];
    const total = Q.quiz.questions.length;
    const last = Q.i === total - 1;
    const rec = Q.answers[Q.i];
    const canCheck = q.type === "fill" ? !!norm(Q.sel) : Q.sel !== null;
    let fb = "";
    if (Q.checked) {
      fb =
        '<div class="feedback ' + (rec.ok ? "ok" : "bad") + '" role="status"><span class="fb-ic">' + EL.icon(rec.ok ? "check" : "x", 20) + "</span><div><strong>" +
        esc(rec.ok ? t("quiz.correct") : t("quiz.incorrect")) + "</strong>" +
        (rec.ok ? "" : "<p>" + esc(t("quiz.answerWas", { a: correctText(q) })) + "</p>") +
        "<p>" + esc(q.explain) + '</p><p class="so">' + esc(q.explainSo) + "</p></div></div>";
    }
    const action = Q.checked
      ? '<button class="btn btn-primary btn-lg btn-block" data-action="q-next">' + esc(t(last ? "quiz.seeResults" : "quiz.next")) + EL.icon("chevron", 18) + "</button>"
      : '<button class="btn btn-primary btn-lg btn-block" data-action="q-check"' + (canCheck ? "" : " disabled") + ">" + esc(t("quiz.check")) + "</button>";
    return (
      '<div class="quiz-top"><a class="back" href="#quizzes" aria-label="' + esc(t("common.back")) + '">' + EL.icon("x", 22) + "</a>" +
      EL.ui.bar(Math.round((Q.i / total) * 100)) +
      (Q.quiz.timeLimit ? '<span class="timer" title="' + esc(t("quiz.timeLeft")) + '">' + EL.icon("clock", 16) + '<b id="q-timer">' + mmss(Q.left) + "</b></span>" : "") + "</div>" +
      '<p class="q-count">' + esc(t("quiz.question", { n: Q.i + 1, total })) + "</p>" +
      '<section class="q-card card"><span class="chip chip-blue">' + esc(typeLabel(q)) + "</span>" +
      '<h2 class="q-text">' + blankify(q.q) + "</h2>" + options(q) + fb +
      '<div class="q-actions">' + action + "</div></section>"
    );
  }

  function results() {
    const qs = Q.quiz.questions;
    const total = qs.length;
    const score = Q.answers.filter((a) => a && a.ok).length;
    const pct = Math.round((score / total) * 100);
    const passed = pct >= Q.quiz.passPct;
    const review = qs.map((q, i) => {
      const a = Q.answers[i];
      const ok = a && a.ok;
      return (
        '<li class="' + (ok ? "ok" : "bad") + '"><span class="rv-ic">' + EL.icon(ok ? "check" : "x", 16) + "</span><div><p class=\"rv-q\">" + blankify(q.q) + "</p>" +
        (ok ? "" : '<p class="muted">' + esc(t("quiz.yourAnswer", { a: givenText(q, a && a.sel) })) + "</p>") +
        '<p class="rv-a">' + esc(t("quiz.answerWas", { a: correctText(q) })) + "</p></div></li>"
      );
    }).join("");
    const sparks = passed
      ? '<div class="burst" aria-hidden="true">' + [0, 1, 2, 3, 4, 5, 6, 7].map((n) => '<i style="--a:' + n * 45 + 'deg"></i>').join("") + "</div>"
      : "";
    return (
      EL.ui.topbar({ back: "quizzes", title: esc(Q.quiz.title) }) +
      '<section class="result card ' + (passed ? "pass" : "try") + '">' + sparks +
      '<p class="muted">' + esc(t("quiz.score")) + "</p>" +
      EL.ui.ring(pct, { size: 160, stroke: 15, label: "<b>" + score + " / " + total + "</b><small>" + pct + "%</small>" }) +
      "<h2>" + bi(passed ? "quiz.passed" : "quiz.notPassed") + '</h2><p class="muted">' + esc(t("quiz.passMark", { n: Q.quiz.passPct })) + "</p>" +
      (Q.newBadge ? '<p class="new-badge">' + EL.icon("award", 18) + esc(t("quiz.badge", { name: Q.newBadge })) + "</p>" : "") +
      '<div class="res-actions"><button class="btn btn-primary btn-lg btn-block" data-action="q-retry">' + EL.icon("refresh", 20) + esc(t("quiz.retry")) + "</button>" +
      '<a class="btn btn-ghost btn-lg btn-block" href="#quizzes">' + esc(t("quiz.all")) + "</a>" +
      '<a class="btn btn-ghost btn-lg btn-block" href="#home">' + esc(t("quiz.keepLearning")) + "</a></div></section>" +
      '<div class="section-head"><h2>' + bi("quiz.review") + '</h2></div><ol class="review card">' + review + "</ol>"
    );
  }

  S.quiz = {
    tab: "home",
    hideNav: false,
    render(id, ctx) {
      if (!ctx.refresh || Q.id !== id) setup(id);
      if (!Q.quiz) return EL.ui.notFound();
      document.body.classList.toggle("focus-mode", Q.phase === "play");
      if (Q.phase === "intro") return intro();
      if (Q.phase === "done") return results();
      return play();
    },
    mount() {
      const nav = document.getElementById("nav");
      if (Q.phase === "play") nav.hidden = true;
      EL.onLeave(() => document.body.classList.remove("focus-mode"));
      if (Q.phase === "play" && Q.quiz.timeLimit) {
        const iv = setInterval(() => {
          Q.left -= 1;
          const el = document.getElementById("q-timer");
          if (el) el.textContent = mmss(Math.max(0, Q.left));
          if (Q.left <= 0) { clearInterval(iv); finish(); }
        }, 1000);
        EL.onLeave(() => clearInterval(iv));
      }
    }
  };

  function finish() {
    if (Q.phase === "done") return;
    const total = Q.quiz.questions.length;
    const score = Q.answers.filter((a) => a && a.ok).length;
    if (!Q.saved) {
      const r = EL.api.saveQuizResult({ quizId: Q.id, score, total });
      Q.saved = true;
      Q.newBadge = r.newBadges.length ? r.newBadges[0].title : null;
    }
    Q.phase = "done";
    EL.app.refresh();
    window.scrollTo(0, 0);
  }

  EL.actions["q-start"] = () => { Q.phase = "play"; EL.app.refresh(); window.scrollTo(0, 0); };

  EL.actions["q-pick"] = (el) => {
    if (Q.checked) return;
    const q = Q.quiz.questions[Q.i];
    const raw = el.dataset.v;
    Q.sel = q.type === "tf" ? raw === "true" : +raw;
    document.querySelectorAll(".q-card .opt").forEach((b) => b.classList.toggle("is-selected", b === el));
    const btn = document.querySelector('[data-action="q-check"]');
    if (btn) btn.disabled = false;
  };

  EL.inputs.qfill = (el) => {
    Q.sel = el.value;
    const btn = document.querySelector('[data-action="q-check"]');
    if (btn) btn.disabled = !norm(el.value);
  };

  EL.actions["q-hint"] = () => {
    const h = document.getElementById("q-hint");
    if (h) h.hidden = !h.hidden;
  };

  EL.actions["q-check"] = () => {
    if (Q.checked) return;
    const q = Q.quiz.questions[Q.i];
    const input = document.getElementById("q-fill");
    if (q.type === "fill" && input) Q.sel = input.value;
    if (q.type === "fill" ? !norm(Q.sel) : Q.sel === null) return;
    Q.checked = true;
    Q.answers[Q.i] = { sel: Q.sel, ok: evaluate(q, Q.sel) };
    EL.app.refresh();
  };

  EL.actions["q-next"] = () => {
    if (Q.i >= Q.quiz.questions.length - 1) { finish(); return; }
    Q.i += 1; Q.sel = null; Q.checked = false;
    EL.app.refresh();
    window.scrollTo(0, 0);
  };

  EL.actions["q-retry"] = () => {
    Q.phase = "play"; Q.i = 0; Q.sel = null; Q.checked = false; Q.answers = []; Q.saved = false; Q.newBadge = null; Q.left = Q.quiz.timeLimit;
    EL.app.refresh();
    window.scrollTo(0, 0);
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* Student progress: completed lessons, quiz scores, streak, progress by level, weekly minutes, badges. */
(function (EL) {
  const S = (EL.screens = EL.screens || {});
  const esc = EL.esc, t = EL.t, bi = EL.bi;

  function weekChart(week) {
    const max = Math.max(30, Math.max.apply(null, week.map((d) => d.min)));
    return (
      '<div class="bars" role="img" aria-label="' + esc(t("progress.week")) + '">' +
      week.map((d) =>
        '<div class="bcol' + (d.isToday ? " today" : "") + (d.future ? " future" : "") + '"><div class="btrack"><span class="bval">' + (d.future ? "" : d.min) +
        '</span><i style="height:' + (d.future ? 0 : Math.max(4, Math.round((d.min / max) * 82))) + '%"></i></div><span class="blab">' + d.label + "</span></div>"
      ).join("") + "</div>"
    );
  }

  function badge(b) {
    const pct = Math.round((b.value / b.target) * 100);
    return (
      '<li class="badge' + (b.earned ? " earned" : "") + '"><span class="badge-ic">' + EL.icon(b.earned ? b.icon : "lock", 26) + "</span>" +
      '<span class="badge-title">' + esc(b.title) + '</span><span class="badge-so so">' + esc(b.so) + "</span>" +
      '<span class="badge-desc">' + esc(b.desc) + "</span>" +
      (b.earned ? "" : '<span class="badge-prog">' + EL.ui.bar(pct) + "<small>" + b.value + " / " + b.target + "</small></span>") + "</li>"
    );
  }

  S.progress = {
    tab: "progress",
    render() {
      const p = EL.api.getProgress();
      const earned = p.badges.filter((b) => b.earned).length;
      const week = p.last7.map((d) =>
        '<span class="wd' + (d.active ? " on" : "") + (d.isToday ? " today" : "") + '"><i>' + (d.active ? EL.icon("check", 14) : "") + "</i><b>" + d.label + "</b></span>"
      ).join("");

      return (
        '<header class="page-head"><h1>' + bi("progress.title") + "</h1></header>" +
        '<div class="prog-grid">' +

        '<section class="card overall" style="grid-area:overall">' + EL.ui.ring(p.pct, { size: 128, stroke: 14, label: "<b>" + p.pct + "%</b>" }) +
        '<div class="ov-text"><h2>' + bi("progress.overall") + "</h2>" +
        '<dl class="stats"><div><dt>' + esc(t("progress.completed")) + "</dt><dd>" + p.done + " / " + p.total + "</dd></div>" +
        "<div><dt>" + esc(t("progress.avg")) + "</dt><dd>" + (p.avgScore === null ? "–" : p.avgScore + "%") + "</dd></div></dl></div></section>" +

        '<section class="card streak-card" style="grid-area:streak"><div class="section-head tight"><h2>' + bi("progress.streak") + "</h2></div>" +
        '<div class="streak-head"><span class="flame">' + EL.icon("flame", 26) + "</span><div><p class=\"streak-n\">" + esc(t(p.streak === 1 ? "home.day1" : "home.days", { n: p.streak })) +
        '</p><p class="muted">' + esc(t("progress.best")) + ": " + esc(t("home.days", { n: p.bestStreak })) + "</p></div></div>" +
        '<div class="week-row">' + week + "</div></section>" +

        '<section class="card" style="grid-area:levels"><div class="section-head tight"><h2>' + bi("progress.byLevel") + "</h2></div>" +
        '<ul class="lv-prog">' + p.levels.map((l) =>
          '<li><a href="#course-' + l.id + '"><div class="lp-top"><span><b>' + esc(l.title) + '</b> <span class="muted">' + esc(l.code) + "</span></span><span>" + l.done + " / " + l.total + "</span></div>" + EL.ui.bar(l.pct) + "</a></li>"
        ).join("") + "</ul></section>" +

        '<section class="card" style="grid-area:week"><div class="section-head tight"><h2>' + bi("progress.week") + "</h2></div>" + weekChart(p.week) + "</section>" +

        '<section class="card" style="grid-area:quiz"><div class="section-head tight"><h2>' + bi("progress.quizScores") + "</h2></div>" +
        '<ul class="score-list">' + p.quizzes.map((q) =>
          '<li><a href="#quiz-' + q.id + '"><div class="lp-top"><span><b>' + esc(q.title) + "</b></span><span>" + (q.best === null ? '<span class="muted">' + esc(t("progress.noQuiz")) + "</span>" : "<b>" + q.best + "%</b>") + "</span></div>" +
          EL.ui.bar(q.best || 0, q.best !== null && q.best >= q.passPct ? "good" : "") +
          (q.attempts ? '<small class="muted">' + esc(t(q.attempts === 1 ? "progress.attempt1" : "progress.attempts", { n: q.attempts })) + "</small>" : "") + "</a></li>"
        ).join("") + "</ul>" +
        (p.recent.length
          ? '<h3 class="sub-h">' + esc(t("progress.recent")) + '</h3><ul class="recent">' + p.recent.map((r) =>
              "<li><span>" + esc(r.title) + '</span><span class="muted">' + EL.fmtDate(r.date) + "</span><b>" + r.score + "/" + r.total + "</b></li>"
            ).join("") + "</ul>"
          : "") + "</section>" +

        '<section style="grid-area:badges"><div class="section-head"><h2>' + bi("progress.badges") + "</h2><span class=\"muted\">" + esc(t("progress.earned", { n: earned, total: p.badges.length })) + "</span></div>" +
        '<ul class="badge-grid">' + p.badges.map(badge).join("") + "</ul></section>" +
        "</div>"
      );
    }
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* Profile, edit profile, language, notifications, account settings, log out. */
(function (EL) {
  const S = (EL.screens = EL.screens || {});
  const esc = EL.esc, t = EL.t, bi = EL.bi;

  const langName = (l) => t(l === "en" ? "lang.en" : l === "so" ? "lang.so" : "lang.both");

  function menuRow(href, icon, label, value) {
    return (
      '<a class="menu-row" href="#' + href + '"><span class="mr-ic">' + EL.icon(icon, 20) + '</span><span class="mr-label">' + esc(label) + "</span>" +
      (value ? '<span class="mr-val">' + esc(value) + "</span>" : "") + EL.icon("chevron", 18) + "</a>"
    );
  }

  S.profile = {
    tab: "profile",
    render() {
      const st = EL.api.getStudent();
      const p = EL.api.getProgress();
      const set = EL.api.getSettings();
      return (
        '<header class="page-head"><h1>' + bi("profile.title") + "</h1></header>" +
        '<div class="profile-grid">' +
        '<section class="card profile-card"><span class="avatar big">' + esc(EL.initials(st.name)) + "</span>" +
        "<div><h2>" + esc(st.name) + '</h2><p class="muted">' + esc(st.email) + '</p><p><span class="chip chip-yellow">' + esc(t("profile.current", { level: st.level.title })) + " · " + esc(st.level.code) + "</span></p></div>" +
        '<dl class="pstats"><div><dd>' + p.done + "</dd><dt>" + esc(t("profile.stats.lessons")) + "</dt></div><div><dd>" + p.streak + "</dd><dt>" + esc(t("profile.stats.streak")) + "</dt></div><div><dd>" +
        (p.avgScore === null ? "–" : p.avgScore + "%") + "</dd><dt>" + esc(t("profile.stats.score")) + "</dt></div></dl></section>" +
        "<div>" +
        '<nav class="menu card" aria-label="' + esc(t("profile.title")) + '">' +
        menuRow("edit-profile", "user", t("profile.edit")) +
        menuRow("language", "globe", t("profile.language"), langName(set.language)) +
        menuRow("notifications", "bell", t("profile.notifications")) +
        (EL.api.canManage()
          ? '<button class="menu-row" data-action="admin-back"><span class="mr-ic">' + EL.icon("layers", 20) + '</span><span class="mr-label">' + esc(t("content.adminBack")) + "</span>" + EL.icon("chevron", 18) + "</button>"
          : "") +
        menuRow("account", "shield", t("profile.account")) + "</nav>" +
        '<button class="btn btn-danger-ghost btn-lg btn-block" data-action="logout">' + EL.icon("logout", 20) + esc(t("profile.logout")) + "</button>" + EL.ui.brandFoot() + "</div></div>"
      );
    }
  };

  EL.actions.logout = () => {
    EL.ui.modal({
      title: t("profile.logoutQ"), body: t("profile.logoutBody"), confirm: t("profile.logout"), danger: true,
      onConfirm: () => { EL.api.logout(); EL.app.go("welcome"); }
    });
  };

  /* ── Edit profile ── */
  const goals = ["profile.goal1", "profile.goal2", "profile.goal3", "profile.goal4"];
  const goalChoices = [10, 15, 20, 30];
  let draftGoal = 15;

  S["edit-profile"] = {
    tab: "profile",
    render() {
      const st = EL.api.getStudent();
      draftGoal = st.dailyGoal;
      const known = goals.map((k) => EL.t(k));
      const opts = known.concat(known.indexOf(st.goal) === -1 && st.goal ? [st.goal] : []);
      return (
        EL.ui.topbar({ back: "profile", title: esc(t("profile.edit")) }) +
        '<form class="card pad form-card" data-form="edit-profile" novalidate>' +
        '<div class="center"><span class="avatar big">' + esc(EL.initials(st.name)) + "</span></div>" +
        '<div class="field"><label for="ep-name">' + esc(t("profile.name")) + '</label><div class="input-wrap">' + EL.icon("user", 20) + '<input id="ep-name" name="name" type="text" autocomplete="name" value="' + esc(st.name) + '"/></div><p class="field-err" data-err="name" role="alert"></p></div>' +
        '<div class="field"><label for="ep-email">' + esc(t("auth.email")) + '</label><div class="input-wrap">' + EL.icon("mail", 20) + '<input id="ep-email" name="email" type="email" autocomplete="email" value="' + esc(st.email) + '"/></div><p class="field-err" data-err="email" role="alert"></p></div>' +
        '<div class="field"><label for="ep-goal">' + esc(t("profile.goal")) + '</label><div class="input-wrap select-wrap"><select id="ep-goal" name="goal">' +
        opts.map((g) => '<option value="' + esc(g) + '"' + (g === st.goal ? " selected" : "") + ">" + esc(g) + "</option>").join("") + "</select></div></div>" +
        '<div class="field"><span class="label">' + esc(t("profile.dailyGoal")) + '</span><div class="chips" id="goal-chips">' +
        goalChoices.map((m) => '<button type="button" class="chip-btn' + (m === st.dailyGoal ? " on" : "") + '" data-action="goal-pick" data-v="' + m + '">' + m + "</button>").join("") + "</div></div>" +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">' + esc(t("common.save")) + "</button></form>"
      );
    }
  };

  EL.actions["goal-pick"] = (el) => {
    draftGoal = +el.dataset.v;
    document.querySelectorAll("#goal-chips .chip-btn").forEach((b) => b.classList.toggle("on", b === el));
  };

  EL.forms["edit-profile"] = (f) => {
    const name = f.elements.name.value.trim();
    const email = f.elements.email.value.trim();
    const okName = !!name;
    const okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    f.querySelector('[data-err="name"]').textContent = okName ? "" : t("err.name");
    f.querySelector('[data-err="email"]').textContent = okEmail ? "" : t("err.email");
    if (!okName || !okEmail) return;
    EL.api.updateStudent({ name, email, goal: f.elements.goal.value, dailyGoal: draftGoal });
    EL.ui.toast(t("common.saved"));
    EL.app.go("profile");
  };

  /* ── Language ── */
  const langOptions = [
    { id: "en", k: "lang.en", sub: "lang.enSub" },
    { id: "both", k: "lang.both", sub: "lang.bothSub" },
    { id: "so", k: "lang.so", sub: "lang.soSub" }
  ];

  S.language = {
    tab: "profile",
    render() {
      const cur = EL.api.getSettings().language;
      return (
        EL.ui.topbar({ back: "profile", title: esc(t("lang.title")) }) +
        '<p class="muted lead-line">' + esc(t("lang.sub")) + "</p>" +
        '<div class="radio-list" role="radiogroup" aria-label="' + esc(t("lang.title")) + '">' +
        langOptions.map((o) =>
          '<button class="radio-card card' + (o.id === cur ? " on" : "") + '" role="radio" aria-checked="' + (o.id === cur) + '" data-action="set-lang" data-v="' + o.id + '">' +
          '<span class="radio-dot"></span><span class="rc-text"><b>' + esc(t(o.k)) + "</b><span>" + esc(t(o.sub)) + "</span></span></button>"
        ).join("") + "</div>"
      );
    }
  };

  EL.actions["set-lang"] = (el) => {
    EL.api.setLanguage(el.dataset.v);
    EL.app.refresh();
    EL.ui.toast(t("lang.updated"));
  };

  /* ── Notifications ── */
  const times = ["07:00", "12:00", "18:00", "21:00"];
  const toggles = [
    { k: "daily", label: "notif.daily", sub: "notif.dailySub" },
    { k: "streak", label: "notif.streak", sub: "notif.streakSub" },
    { k: "newLessons", label: "notif.lessons", sub: "notif.lessonsSub" },
    { k: "weekly", label: "notif.weekly", sub: "notif.weeklySub" }
  ];

  S.notifications = {
    tab: "profile",
    render() {
      const n = EL.api.getSettings().notifications;
      return (
        EL.ui.topbar({ back: "profile", title: esc(t("notif.title")) }) +
        '<p class="muted lead-line">' + esc(t("notif.sub")) + "</p>" +
        '<div class="card toggles">' +
        toggles.map((r) =>
          '<div class="toggle-row"><div><b>' + esc(t(r.label)) + "</b><p class=\"muted\">" + esc(t(r.sub)) + '</p></div><button class="switch' + (n[r.k] ? " on" : "") + '" role="switch" aria-checked="' + n[r.k] + '" aria-label="' + esc(t(r.label)) + '" data-action="toggle-notif" data-k="' + r.k + '"><i></i></button></div>'
        ).join("") + "</div>" +
        '<div class="card pad' + (n.daily ? "" : " dim") + '"><p class="label">' + esc(t("notif.time")) + '</p><div class="chips">' +
        times.map((tm) => '<button class="chip-btn' + (n.time === tm ? " on" : "") + '" data-action="notif-time" data-v="' + tm + '"' + (n.daily ? "" : " disabled") + ">" + tm + "</button>").join("") + "</div></div>"
      );
    }
  };

  EL.actions["toggle-notif"] = (el) => {
    const k = el.dataset.k;
    EL.api.setNotifications({ [k]: !EL.api.getSettings().notifications[k] });
    EL.app.refresh();
    EL.ui.toast(t("notif.saved"));
  };
  EL.actions["notif-time"] = (el) => {
    EL.api.setNotifications({ time: el.dataset.v });
    EL.app.refresh();
    EL.ui.toast(t("notif.saved"));
  };

  /* ── Account ── */
  S.account = {
    tab: "profile",
    render() {
      const st = EL.api.getStudent();
      return (
        EL.ui.topbar({ back: "profile", title: esc(t("acct.title")) }) +
        '<div class="settings-grid">' +
        '<section class="card pad"><h2 class="sub-h">' + esc(t("acct.details")) + '</h2><dl class="kv"><div><dt>' + esc(t("profile.name")) + "</dt><dd>" + esc(st.name) + "</dd></div><div><dt>" + esc(t("auth.email")) + "</dt><dd>" + esc(st.email) + '</dd></div></dl><a class="btn btn-ghost" href="#edit-profile">' + EL.icon("edit", 18) + esc(t("profile.edit")) + "</a></section>" +
        '<form class="card pad form-card" data-form="password" novalidate><h2 class="sub-h">' + esc(t("acct.password")) + "</h2>" +
        '<div class="field"><label for="pw-cur">' + esc(t("acct.current")) + '</label><div class="input-wrap">' + EL.icon("lock", 20) + '<input id="pw-cur" name="current" type="password" autocomplete="current-password"/></div><p class="field-err" data-err="current" role="alert"></p></div>' +
        '<div class="field"><label for="pw-new">' + esc(t("acct.new")) + '</label><div class="input-wrap">' + EL.icon("lock", 20) + '<input id="pw-new" name="password" type="password" autocomplete="new-password"/></div><p class="field-err" data-err="password" role="alert"></p></div>' +
        '<button class="btn btn-primary" type="submit">' + esc(t("acct.update")) + "</button></form>" +
        '<section class="card pad"><h2 class="sub-h">' + esc(t("acct.data")) + '</h2><p class="muted">' + esc(t("acct.dataSub")) + '</p><button class="btn btn-ghost" data-action="reset-demo">' + EL.icon("refresh", 18) + esc(t("acct.reset")) + "</button></section>" +
        '<section class="card pad danger-zone"><h2 class="sub-h">' + esc(t("acct.delete")) + '</h2><p class="muted">' + esc(t("acct.deleteSub")) + '</p><button class="btn btn-danger" data-action="delete-account">' + EL.icon("trash", 18) + esc(t("acct.delete")) + "</button></section></div>"
      );
    }
  };

  EL.forms.password = (f) => {
    const cur = f.elements.current.value;
    const pw = f.elements.password.value;
    const a = !!cur, b = pw.length >= 6;
    f.querySelector('[data-err="current"]').textContent = a ? "" : t("err.password");
    f.querySelector('[data-err="password"]').textContent = b ? "" : t("err.password");
    if (!a || !b) return;
    f.reset();
    EL.ui.toast(t("acct.updated"));
  };

  EL.actions["reset-demo"] = () => {
    EL.api.resetDemo();
    EL.ui.toast(t("acct.resetDone"));
    EL.app.go("home");
  };

  EL.actions["delete-account"] = () => {
    EL.ui.modal({
      title: t("acct.deleteQ"), body: t("acct.deleteBody"), confirm: t("acct.deleteConfirm"), danger: true,
      onConfirm: () => {
        Promise.resolve(EL.api.deleteAccount()).then((r) => {
          if (r && r.ok === false) EL.ui.toast(t(r.error === "network" ? "err.network" : "err.server"));
          else EL.app.go("welcome");
        });
      }
    });
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* Content manager: the owner types in lessons and quiz questions here.
   content            list of lessons per level, quiz question counts, backup / restore
   lessonedit-new     add a lesson;  lessonedit-<id>  change one
   quizedit-<id>      the questions of a level quiz (beginner, elementary, intermediate, advanced) or of the exam
   Everything is saved through EL.api (see saveLesson, setQuizQuestions).

   Shape of a stored lesson: { id, level, type, minutes, title, so, summary, summarySo, ...fields for its type }
     vocabulary: words [{ en, so, emoji, ex, exSo }]
     grammar:    intro {en,so}, table [{en,so}], rules [{en,so}], examples [{en,so}], tip {en,so}, check [question]
     listening:  script [{ who, text }], scriptSo, questions [question]
     speaking:   phrases [{ en, so, sounds }]
     reading:    paragraphs [{en,so}], glossary [{en,so}], questions [question]
     writing:    tasks [{ prompt, promptSo, starter, keywords[], minWords, model }]
   question: { type:"mcq", q, options[], a, explain, explainSo } | { type:"tf", q, a, ... }
           | { type:"fill", q, answers[] (lower case), hint, hintSo, explain, explainSo } */
(function (EL) {
  const S = (EL.screens = EL.screens || {});
  const esc = EL.esc, t = EL.t;

  // English with a small Somali line beneath (language "both"), or one language only.
  const bx = (en, so) => {
    const l = EL.lang();
    if (l === "so") return "<span>" + esc(so) + "</span>";
    if (l === "en") return "<span>" + esc(en) + "</span>";
    return '<span class="bi"><span>' + esc(en) + '</span><span class="so sub">' + esc(so) + "</span></span>";
  };
  const tx = (en, so) => (EL.lang() === "so" ? so : en);

  /* ───────── content manager ───────── */
  let pendingNew = {}; // level / type chosen on the screen the "Add" button was pressed on

  EL.actions["le-new"] = (el) => {
    pendingNew = { level: el.dataset.level || "", type: el.dataset.type || "" };
    EL.app.go("lessonedit-new");
  };

  function lessonItem(l, i, n) {
    return (
      '<li class="cm-row"><span class="lr-icon t-' + EL.typeTone(l.type) + '">' + EL.icon(EL.typeIcon(l.type), 20) + "</span>" +
      '<a class="cm-body" href="#lessonedit-' + l.id + '"><b>' + esc(l.title) + "</b><small>" + esc(t("type." + l.type)) + " · " + esc(t("common.min", { n: l.minutes })) + "</small></a>" +
      '<span class="cm-actions">' +
      '<button class="icon-btn" data-action="le-move" data-id="' + l.id + '" data-dir="-1" aria-label="' + esc(tx("Move up", "Kor u qaad")) + '"' + (i === 0 ? " disabled" : "") + ">" + EL.icon("up", 18) + "</button>" +
      '<button class="icon-btn" data-action="le-move" data-id="' + l.id + '" data-dir="1" aria-label="' + esc(tx("Move down", "Hoos u dhig")) + '"' + (i === n - 1 ? " disabled" : "") + ">" + EL.icon("down", 18) + "</button>" +
      '<a class="icon-btn" href="#lessonedit-' + l.id + '" aria-label="' + esc(tx("Edit", "Wax ka beddel")) + '">' + EL.icon("edit", 18) + "</a>" +
      '<button class="icon-btn danger" data-action="le-del" data-id="' + l.id + '" aria-label="' + esc(tx("Delete", "Tirtir")) + '">' + EL.icon("trash", 18) + "</button></span></li>"
    );
  }

  S.content = {
    tab: "profile",
    hideNav: true,
    mount() { if (EL.loadStudentsOnce) EL.loadStudentsOnce(); },
    render() {
      const levels = EL.api.getLevels();
      const quizzes = EL.api.getQuizzes();
      const qrow = (q) =>
        '<a class="cm-quiz" href="#quizedit-' + q.id + '"><span class="lr-icon t-' + (q.id === "exam" ? "y" : "b") + '">' + EL.icon(q.id === "exam" ? "trophy" : "help", 20) + "</span>" +
        '<span class="cm-body"><b>' + esc(q.title) + "</b><small>" + esc(t("courses.questions", { n: q.count })) + "</small></span>" + EL.icon("edit", 18) + "</a>";
      return (
        EL.ui.topbar({
          title: EL.ui.logo(34, "tb-logo") + "<span>" + esc(tx("Admin", "Maamule")) + "</span>",
          right: '<button class="btn btn-ghost btn-sm" data-action="admin-preview">' + EL.icon("eye", 16) + esc(tx("Student view", "Ardayga")) + "</button>" +
            '<button class="icon-btn" data-action="logout" aria-label="' + esc(t("profile.logout")) + '">' + EL.icon("logout", 20) + "</button>"
        }) +
        '<p class="muted lead-line">' + bx(
          "Add lessons and quiz questions here. Students only see what you add. Everything is saved on this device, so make a backup code now and then.",
          "Halkan ku dar casharro iyo su’aalo tijaabo. Ardaydu waxay arkaan oo keliya wixii aad ku darto. Waxay ku kaydsan yihiin qalabkan, marka mar mar samee koodh kaydis ah (backup)."
        ) + "</p>" +
        '<a class="card st-link" href="#server"><span class="lr-icon t-' + (EL.cloud.enabled() ? "y" : "b") + '">' + EL.icon("globe", 22) + "</span>" +
        '<span class="cm-body"><b>' + bx("Server", "Server-ka") + "</b><small>" + esc(EL.cloud.enabled() ? tx("Connected — shared between all phones", "Waa xiran yahay — taleefan kasta ayaa wadaaga") : tx("Not connected — this phone only", "Lama xirin — taleefankan oo keliya")) + "</small></span>" + EL.icon("chevron", 18) + "</a>" +
        (function () {
          const sm = EL.api.getStudentSummary();
          return '<a class="card st-link" href="#students"><span class="lr-icon t-b">' + EL.icon("user", 22) + "</span>" +
            '<span class="cm-body"><b>' + bx("Students", "Ardayda") + "</b><small>" +
            esc(tx(sm.count + " joined · " + sm.completions + " lessons finished", sm.count + " ku biiray · " + sm.completions + " cashar la dhammeeyay")) + "</small></span>" + EL.icon("chevron", 18) + "</a>";
        })() +
        '<div class="cm-grid">' +
        levels.map((lv) =>
          '<section class="card cm-level"><div class="cm-head"><div><h2>' + esc(lv.title) + ' <span class="tag-soft">' + esc(lv.code) + "</span></h2><p class=\"so\">" + esc(lv.so) + "</p></div>" +
          '<button class="btn btn-primary btn-sm" data-action="le-new" data-level="' + lv.id + '">' + EL.icon("plus", 16) + esc(tx("Add lesson", "Ku dar cashar")) + "</button></div>" +
          (lv.lessons.length
            ? '<ul class="cm-list">' + lv.lessons.map((l, i) => lessonItem(l, i, lv.lessons.length)).join("") + "</ul>"
            : '<p class="muted cm-empty">' + esc(t("content.emptyList")) + "</p>") + "</section>"
        ).join("") +
        '<section class="card cm-level"><div class="cm-head"><div><h2>' + bx("Quiz questions", "Su’aalaha tijaabada") + "</h2></div></div>" +
        '<div class="cm-list">' + quizzes.map(qrow).join("") + "</div></section>" +
        '<section class="card cm-level"><h2>' + bx("Backup", "Kaydis (backup)") + '</h2><p class="muted">' + bx(
          "Create a backup code and keep it in your notes. Paste it back here and press Restore to get your lessons back.",
          "Samee koodh kaydis ah oo ku hay qoraalkaaga. Halkan ku dheji oo taabo Soo celi si aad casharradaada u hesho."
        ) + "</p>" +
        '<textarea id="bk-text" rows="4" spellcheck="false" placeholder="' + esc(tx("Backup code appears here", "Koodhka kaydka ayaa halkan ka soo muuqanaya")) + '"></textarea>' +
        '<div class="le-btns"><button class="btn btn-ghost" data-action="bk-make">' + esc(tx("Create backup code", "Samee koodh kaydis")) + '</button>' +
        '<button class="btn btn-ghost" data-action="bk-restore">' + esc(tx("Restore from code", "Ka soo celi koodh")) + "</button></div></section>" +
        "</div>"
      );
    }
  };

  EL.actions["le-move"] = (el) => { EL.api.moveLesson(el.dataset.id, +el.dataset.dir); EL.app.refresh(); };
  EL.actions["le-del"] = (el) => {
    const id = el.dataset.id;
    const l = EL.api.getLesson(id);
    EL.ui.modal({
      title: tx("Delete this lesson?", "Ma tirtirtaa casharkan?"), body: l ? l.title : "", confirm: tx("Delete", "Tirtir"), danger: true,
      onConfirm: () => { EL.api.deleteLesson(id); EL.ui.toast(tx("Lesson deleted", "Casharka waa la tirtiray")); EL.app.refresh(); }
    });
  };
  EL.actions["bk-make"] = () => {
    const ta = document.getElementById("bk-text");
    ta.value = EL.api.exportContent();
    ta.focus();
    ta.select();
    let copied = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).catch(function () { /* user can copy by hand */ }); copied = true; } } catch (e) { copied = false; }
    EL.ui.toast(copied ? tx("Backup code copied", "Koodhka waa la koobiyeeyay") : tx("Select and copy the code", "Dooro oo koobiyee koodhka"));
  };
  EL.actions["bk-restore"] = () => {
    const text = document.getElementById("bk-text").value.trim();
    if (!text) { EL.ui.toast(tx("Paste your backup code first", "Marka hore ku dheji koodhkaaga")); return; }
    EL.ui.modal({
      title: tx("Replace your lessons with this backup?", "Ma ku beddelaysaa casharradaada kaydkan?"), body: tx("Your current lessons and questions will be replaced.", "Casharradaada iyo su’aalahaaga hadda jira waa la beddelayaa."),
      confirm: tx("Restore", "Soo celi"), danger: true,
      onConfirm: () => {
        if (EL.api.importContent(text)) { EL.ui.toast(tx("Backup restored", "Kaydka waa la soo celiyay")); EL.app.refresh(); }
        else EL.ui.toast(tx("That code is not a valid backup", "Koodhkaasi ma ahan kayd sax ah"));
      }
    });
  };

  /* ───────── editor engine (shared by the lesson editor and the quiz editor) ───────── */
  let draft = null;
  let draftFor = null;

  const pair = () => ({ en: "", so: "" });
  const blank = {
    words: () => ({ en: "", so: "", ex: "", exSo: "", emoji: "" }),
    table: pair, rules: pair, examples: pair, glossary: pair, paragraphs: pair,
    script: () => ({ who: "", text: "" }),
    phrases: () => ({ en: "", so: "", sounds: "" }),
    tasks: () => ({ prompt: "", promptSo: "", starter: "", keywords: "", minWords: "4", model: "" }),
    questions: () => ({ type: "mcq", q: "", o: ["", "", "", ""], correct: "0", tf: "true", answers: "", hint: "", hintSo: "", explain: "", explainSo: "" })
  };

  // What each list asks for. f: [key, English label, Somali label, placeholder, kind]  kind: "area" | "num" | "opt"
  const REP = {
    words: {
      title: ["Words", "Ereyada"], hint: ["One card for each word or phrase.", "Kaar kasta wuxuu u yahay hal erey ama weedh."], add: ["Add a word", "Ku dar erey"],
      f: [["en", "English word or phrase", "Erayga ama weedhda English", "Hello"], ["so", "Somali meaning", "Macnaha Soomaaliga", "Salaan"],
        ["ex", "Example sentence (English)", "Jumlad tusaale ah (English)", "Hello, how are you?", "opt"], ["exSo", "Example sentence (Somali)", "Jumlad tusaale ah (Soomaali)", "Haye, sidee tahay?", "opt"],
        ["emoji", "Picture (one emoji)", "Sawir (hal emoji)", "👋", "opt"]]
    },
    table: { title: ["Forms and patterns", "Qaabab iyo qaabeynno"], hint: ["Short patterns, for example “I am”.", "Qaabab gaagaaban, tusaale “I am”."], add: ["Add a pattern", "Ku dar qaab"], f: [["en", "English", "English", "I am"], ["so", "Somali", "Soomaali", "Aniga waan ahay"]] },
    rules: { title: ["Rules", "Xeerarka"], hint: ["", ""], add: ["Add a rule", "Ku dar xeer"], f: [["en", "Rule (English)", "Xeerka (English)", "Use “am” only with I.", "area"], ["so", "Rule (Somali)", "Xeerka (Soomaali)", "", "area"]] },
    examples: { title: ["Examples", "Tusaalooyin"], hint: ["", ""], add: ["Add an example", "Ku dar tusaale"], f: [["en", "Sentence (English)", "Jumlad (English)", "I am a student."], ["so", "Sentence (Somali)", "Jumlad (Soomaali)", "Waxaan ahay arday."]] },
    script: {
      title: ["Conversation lines", "Safafka wada-hadalka"], hint: ["Each line is read aloud by the phone. Use the same speaker name for the same person.", "Safaf kasta waxaa cod-dheer u akhriyaya telefoonku. Isticmaal isla magaca qofka isla qofka."],
      add: ["Add a line", "Ku dar safaf"], f: [["who", "Speaker name", "Magaca hadlaha", "Hodan"], ["text", "What they say (English)", "Wixii ay yidhaahdaan (English)", "Hello! My name is Hodan.", "area"]]
    },
    phrases: { title: ["Phrases to say", "Weedhaha la leeyahay"], hint: ["", ""], add: ["Add a phrase", "Ku dar weedh"], f: [["en", "Phrase (English)", "Weedha (English)", "Nice to meet you."], ["so", "Meaning (Somali)", "Macnaha (Soomaali)", "Waan ku faraxsanahay."], ["sounds", "How it sounds (optional)", "Sida ay u dhawaaqdo (ikhtiyaari)", "NYS too MEET yoo", "opt"]] },
    paragraphs: { title: ["Story or text", "Sheeko ama qoraal"], hint: ["One card for each paragraph.", "Kaar kasta wuxuu u yahay hal baaragaraaf."], add: ["Add a paragraph", "Ku dar baaragaraaf"], f: [["en", "Paragraph (English)", "Baaragaraafka (English)", "", "area"], ["so", "Paragraph (Somali)", "Baaragaraafka (Soomaali)", "", "area"]] },
    glossary: { title: ["Word list (optional)", "Liiska erayada (ikhtiyaari)"], hint: ["Hard words with their Somali meaning.", "Erayo adag iyo macnahooda Soomaaliga."], add: ["Add a word", "Ku dar erey"], f: [["en", "Word (English)", "Erayga (English)", "family"], ["so", "Meaning (Somali)", "Macnaha (Soomaali)", "qoys"]] },
    tasks: {
      title: ["Writing tasks", "Hawlaha qorista"], hint: ["The learner writes an answer and the app checks capital letter, full stop, length and key words.", "Ardaygu wuu qoraa jawaab, appkuna wuxuu hubiyaa xarafka weyn, dhibicda, dhererka iyo ereyada muhiimka ah."], add: ["Add a task", "Ku dar hawl"],
      f: [["prompt", "Task (English)", "Hawsha (English)", "Write one sentence with your name.", "area"], ["promptSo", "Task (Somali)", "Hawsha (Soomaali)", "", "area"],
        ["starter", "Starting words (optional)", "Ereyada bilowga (ikhtiyaari)", "My name is", "opt"], ["keywords", "Key words to look for, separated by commas (optional)", "Ereyada la raadinayo, kuwa kala qaad dhibic-hoosaad (ikhtiyaari)", "name", "opt"],
        ["minWords", "Smallest number of words", "Tirada ereyada ugu yar", "4", "num"], ["model", "Model answer (optional)", "Jawaab tusaale ah (ikhtiyaari)", "My name is Ayaan.", "opt"]]
    }
  };

  const SECTIONS = {
    vocabulary: ["words"],
    grammar: ["intro", "table", "rules", "examples", "tip", "questions"],
    listening: ["script", "scriptSo", "questions"],
    speaking: ["phrases"],
    reading: ["paragraphs", "glossary", "questions"],
    writing: ["tasks"]
  };

  function getPath(o, p) { return p.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
  function setPath(o, p, v) {
    const ks = p.split(".");
    const last = ks.pop();
    const host = ks.reduce((a, k) => a[k], o);
    host[last] = v;
  }

  EL.inputs.le = (el) => { if (draft) setPath(draft, el.dataset.p, el.value); };
  EL.changes["le-type"] = (el) => { if (draft) { draft.type = el.value; EL.app.refresh(); } };
  EL.changes["le-qtype"] = (el) => { if (draft) { draft.questions[+el.dataset.i].type = el.value; EL.app.refresh(); } };

  EL.actions["le-add"] = (el) => {
    const name = el.dataset.r;
    draft[name].push(blank[name]());
    EL.app.refresh();
    const rows = document.querySelectorAll('[data-rows="' + name + '"] .le-item');
    const last = rows[rows.length - 1];
    const f = last && last.querySelector("input, textarea");
    if (f) f.focus();
  };
  EL.actions["le-rm"] = (el) => {
    draft[el.dataset.r].splice(+el.dataset.i, 1);
    EL.app.refresh();
  };

  /* field renderers */
  function inp(path, label, opts) {
    opts = opts || {};
    const id = "f-" + path.replace(/\./g, "-");
    const val = getPath(draft, path);
    const control = opts.area
      ? '<textarea id="' + id + '" rows="' + (opts.rows || 3) + '" data-input="le" data-p="' + path + '" spellcheck="false" placeholder="' + esc(opts.ph || "") + '">' + esc(val) + "</textarea>"
      : '<input id="' + id + '" type="' + (opts.num ? "number" : "text") + '"' + (opts.num ? ' inputmode="numeric" min="0"' : "") + ' data-input="le" data-p="' + path + '" value="' + esc(val) + '" placeholder="' + esc(opts.ph || "") + '" autocomplete="off" />';
    return '<div class="field"><label for="' + id + '">' + bx(label[0], label[1]) + (opts.opt ? ' <em class="opt-tag">' + esc(tx("optional", "ikhtiyaari")) + "</em>" : "") + "</label>" + (opts.area ? control : '<div class="input-wrap plain">' + control + "</div>") + "</div>";
  }

  function select(path, label, options, change) {
    const id = "f-" + path.replace(/\./g, "-");
    const val = String(getPath(draft, path));
    return (
      '<div class="field"><label for="' + id + '">' + bx(label[0], label[1]) + '</label><div class="input-wrap select-wrap"><select id="' + id + '" ' +
      (change ? 'data-change="' + change + '" data-i="' + path.split(".")[1] + '"' : 'data-input="le" data-p="' + path + '"') + ">" +
      options.map((o) => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === val ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select></div></div>"
    );
  }

  function repeater(name) {
    const R = REP[name];
    return (
      '<section class="le-sec"><div class="section-head"><h2>' + bx(R.title[0], R.title[1]) + "</h2></div>" +
      (R.hint[0] ? '<p class="muted le-hint">' + bx(R.hint[0], R.hint[1]) + "</p>" : "") +
      '<div class="stack" data-rows="' + name + '">' +
      draft[name].map((row, i) =>
        '<div class="le-item card"><div class="le-item-head"><b>' + (i + 1) + '</b><button type="button" class="icon-btn danger" data-action="le-rm" data-r="' + name + '" data-i="' + i + '" aria-label="' + esc(tx("Remove", "Ka saar")) + '">' + EL.icon("trash", 18) + "</button></div>" +
        R.f.map((f) => inp(name + "." + i + "." + f[0], [f[1], f[2]], { ph: f[3], area: f[4] === "area", opt: f[4] === "opt", num: f[4] === "num" })).join("") + "</div>"
      ).join("") + '</div><button type="button" class="btn btn-ghost" data-action="le-add" data-r="' + name + '">' + EL.icon("plus", 16) + esc(tx(R.add[0], R.add[1])) + "</button></section>"
    );
  }

  const LETTERS = ["A", "B", "C", "D"];
  function questionCard(q, i) {
    const p = "questions." + i + ".";
    let body = inp(p + "q", ["Question", "Su’aasha"], { area: true, rows: 2, ph: q.type === "fill" ? "My ___ is Hodan." : "" });
    if (q.type === "mcq") {
      body += LETTERS.map((L, j) => inp(p + "o." + j, ["Option " + L, "Doorasho " + L], { ph: j > 1 ? tx("(leave empty if not needed)", "(ka tag haddii aan loo baahnayn)") : "" })).join("");
      body += select(p + "correct", ["Which option is correct?", "Doorashada saxda ahi waa?"], LETTERS.map((L, j) => [String(j), tx("Option ", "Doorasho ") + L]));
    } else if (q.type === "tf") {
      body += select(p + "tf", ["The statement is…", "Odhaahdu waa…"], [["true", t("quiz.true")], ["false", t("quiz.false")]]);
    } else {
      body += inp(p + "answers", ["Correct answer(s), separated by commas", "Jawaabaha saxda ah, kala qaad dhibic-hoosaad"], { ph: "name" });
      body += inp(p + "hint", ["Hint", "Tilmaan"], { opt: true }) + inp(p + "hintSo", ["Hint (Somali)", "Tilmaan (Soomaali)"], { opt: true });
    }
    body += inp(p + "explain", ["Why is it correct?", "Maxay sax u tahay?"], { area: true, rows: 2, opt: true }) + inp(p + "explainSo", ["Why is it correct? (Somali)", "Maxay sax u tahay? (Soomaali)"], { area: true, rows: 2, opt: true });
    return (
      '<div class="le-item card"><div class="le-item-head"><b>' + (i + 1) + '</b><button type="button" class="icon-btn danger" data-action="le-rm" data-r="questions" data-i="' + i + '" aria-label="' + esc(tx("Remove", "Ka saar")) + '">' + EL.icon("trash", 18) + "</button></div>" +
      select(p + "type", ["Question type", "Nooca su’aasha"], [["mcq", t("quiz.mcq")], ["tf", t("quiz.tf")]].concat(/^quiz-/.test(draftFor || "") ? [["fill", t("quiz.fill")]] : []), "le-qtype") + body + "</div>"
    );
  }

  function questionsSection(title, hint) {
    return (
      '<section class="le-sec"><div class="section-head"><h2>' + bx(title[0], title[1]) + "</h2></div>" +
      (hint ? '<p class="muted le-hint">' + bx(hint[0], hint[1]) + "</p>" : "") +
      '<div class="stack" data-rows="questions">' + draft.questions.map(questionCard).join("") + '</div><button type="button" class="btn btn-ghost" data-action="le-add" data-r="questions">' + EL.icon("plus", 16) + esc(tx("Add a question", "Ku dar su’aal")) + "</button></section>"
    );
  }

  /* ───────── conversions between the form (strings) and stored data ───────── */
  const norm = (v) => String(v == null ? "" : v).trim().toLowerCase().replace(/[’]/g, "'");
  const clean = (v) => String(v == null ? "" : v).trim();

  function qFromStored(q) {
    const d = blank.questions();
    d.type = q.type; d.q = q.q || ""; d.explain = q.explain || ""; d.explainSo = q.explainSo || "";
    if (q.type === "mcq") { d.o = (q.options || []).concat(["", "", "", ""]).slice(0, 4); d.correct = String(q.a); }
    else if (q.type === "tf") d.tf = q.a ? "true" : "false";
    else { d.answers = (q.answers || []).join(", "); d.hint = q.hint || ""; d.hintSo = q.hintSo || ""; }
    return d;
  }

  function qToStored(d, n) {
    const q = clean(d.q);
    const where = tx("Question ", "Su’aasha ") + n + ": ";
    if (!q) return { err: where + tx("write the question.", "qor su’aasha.") };
    const base = { q, explain: clean(d.explain), explainSo: clean(d.explainSo) };
    if (d.type === "tf") return { ok: Object.assign({ type: "tf", a: d.tf === "true" }, base) };
    if (d.type === "fill") {
      const answers = String(d.answers).split(",").map(norm).filter(Boolean);
      if (!answers.length) return { err: where + tx("write the correct answer.", "qor jawaabta saxda ah.") };
      if (!/_{3,}/.test(q)) return { err: where + tx("put ___ (three underscores) where the word is missing.", "geli ___ (saddex xariiq-hoose) meesha erayga ka maqan yahay.") };
      return { ok: Object.assign({ type: "fill", answers, hint: clean(d.hint), hintSo: clean(d.hintSo) }, base) };
    }
    const opts = d.o.map((x, i) => ({ x: clean(x), i })).filter((o) => o.x);
    if (opts.length < 2) return { err: where + tx("write at least two options.", "qor ugu yaraan laba doorasho.") };
    const a = opts.findIndex((o) => String(o.i) === String(d.correct));
    if (a < 0) return { err: where + tx("the correct option is empty.", "doorashada saxda ahi waa madhan tahay.") };
    return { ok: Object.assign({ type: "mcq", options: opts.map((o) => o.x), a }, base) };
  }

  function questionsToStored(list) {
    const out = [];
    for (let i = 0; i < list.length; i++) {
      const r = qToStored(list[i], i + 1);
      if (r.err) return { err: r.err };
      out.push(r.ok);
    }
    return { ok: out };
  }

  const rowsOf = (L, k, mk) => (L[k] && L[k].length ? L[k].map((x) => Object.assign(mk(), x)) : [mk()]);

  function newDraft() {
    const d = { id: "", level: pendingNew.level || EL.api.getStudent().level.id, type: pendingNew.type || "vocabulary", minutes: "8", title: "", so: "", summary: "", summarySo: "", intro: pair(), tip: pair(), scriptSo: "" };
    Object.keys(blank).forEach((k) => { d[k] = k === "questions" ? [] : [blank[k]()]; });
    pendingNew = {};
    return d;
  }

  function draftFromLesson(L) {
    const d = newDraft();
    Object.assign(d, { id: L.id, level: L.level, type: L.type, minutes: String(L.minutes || ""), title: L.title || "", so: L.so || "", summary: L.summary || "", summarySo: L.summarySo || "", scriptSo: L.scriptSo || "" });
    d.intro = Object.assign(pair(), L.intro || {});
    d.tip = Object.assign(pair(), L.tip || {});
    ["words", "table", "rules", "examples", "glossary", "paragraphs", "script", "phrases"].forEach((k) => { d[k] = rowsOf(L, k, blank[k]); });
    d.tasks = rowsOf(L, "tasks", blank.tasks).map((x) => Object.assign(x, { keywords: (x.keywords || []).join ? (x.keywords || []).join(", ") : String(x.keywords || ""), minWords: String(x.minWords || "") }));
    d.questions = (L.check || L.questions || []).map(qFromStored);
    return d;
  }

  function lessonFromDraft(d) {
    const need = (msg) => ({ err: msg });
    const title = clean(d.title);
    if (!title) return need(tx("Write the lesson title.", "Qor cinwaanka casharka."));
    const L = {
      id: d.id || undefined, level: d.level, type: d.type,
      minutes: Math.max(1, Math.min(99, parseInt(d.minutes, 10) || 5)),
      title, so: clean(d.so), summary: clean(d.summary), summarySo: clean(d.summarySo)
    };
    const pairs = (k) => d[k].map((r) => ({ en: clean(r.en), so: clean(r.so) })).filter((r) => r.en);
    const questions = () => questionsToStored(d.questions);
    const none = (what) => need(tx("Add at least one ", "Ku dar ugu yaraan hal ") + what + ".");
    let q;
    switch (d.type) {
      case "vocabulary":
        L.words = d.words.filter((w) => clean(w.en)).map((w) => ({ en: clean(w.en), so: clean(w.so), emoji: clean(w.emoji) || "📘", ex: clean(w.ex), exSo: clean(w.exSo) }));
        if (!L.words.length) return none(tx("word", "erey"));
        break;
      case "grammar":
        L.intro = { en: clean(d.intro.en), so: clean(d.intro.so) };
        L.table = pairs("table"); L.rules = pairs("rules"); L.examples = pairs("examples");
        L.tip = { en: clean(d.tip.en), so: clean(d.tip.so) };
        if (!L.intro.en && !L.table.length && !L.rules.length && !L.examples.length) return need(tx("Write an explanation, a pattern, a rule or an example.", "Qor sharaxaad, qaab, xeer ama tusaale."));
        q = questions(); if (q.err) return q; L.check = q.ok;
        break;
      case "listening":
        L.script = d.script.filter((s) => clean(s.text)).map((s, i) => ({ who: clean(s.who) || tx("Speaker ", "Hadle ") + (i % 2 ? 2 : 1), text: clean(s.text) }));
        if (!L.script.length) return none(tx("conversation line", "safaf wada-hadal"));
        L.scriptSo = clean(d.scriptSo);
        q = questions(); if (q.err) return q; L.questions = q.ok;
        break;
      case "speaking":
        L.phrases = d.phrases.filter((p) => clean(p.en)).map((p) => ({ en: clean(p.en), so: clean(p.so), sounds: clean(p.sounds) }));
        if (!L.phrases.length) return none(tx("phrase", "weedh"));
        break;
      case "reading":
        L.paragraphs = pairs("paragraphs"); L.glossary = pairs("glossary");
        if (!L.paragraphs.length) return none(tx("paragraph", "baaragaraaf"));
        q = questions(); if (q.err) return q; L.questions = q.ok;
        break;
      default:
        L.tasks = d.tasks.filter((x) => clean(x.prompt)).map((x) => ({
          prompt: clean(x.prompt), promptSo: clean(x.promptSo), starter: clean(x.starter),
          keywords: String(x.keywords).split(",").map(norm).filter(Boolean), minWords: Math.max(1, parseInt(x.minWords, 10) || 3), model: clean(x.model)
        }));
        if (!L.tasks.length) return none(tx("task", "hawl"));
    }
    return { ok: L };
  }

  /* ───────── lesson editor ───────── */
  function showError(msg) {
    const e = document.getElementById("le-err");
    if (e) { e.textContent = msg; e.scrollIntoView({ block: "center" }); }
    EL.ui.toast(msg);
  }

  S.lessonedit = {
    tab: "profile",
    hideNav: true,
    render(arg, ctx) {
      if (!ctx.refresh || draftFor !== "lesson-" + arg) {
        const L = arg === "new" ? null : EL.api.getLesson(arg);
        if (arg !== "new" && !L) return EL.ui.notFound();
        draft = L ? draftFromLesson(L) : newDraft();
        draftFor = "lesson-" + arg;
      }
      const levels = EL.data.levels.map((l) => [l.id, l.title + " (" + l.code + ")"]);
      const types = EL.data.skillTypes.map((s) => [s.id, t("type." + s.id)]);
      const sec = SECTIONS[draft.type];
      const parts = sec.map((k) => {
        if (k === "intro") return '<section class="le-sec"><div class="section-head"><h2>' + bx("Explanation", "Sharaxaad") + "</h2></div>" + inp("intro.en", ["Explanation (English)", "Sharaxaad (English)"], { area: true }) + inp("intro.so", ["Explanation (Somali)", "Sharaxaad (Soomaali)"], { area: true }) + "</section>";
        if (k === "tip") return '<section class="le-sec"><div class="section-head"><h2>' + bx("Tip (optional)", "Talo (ikhtiyaari)") + "</h2></div>" + inp("tip.en", ["Tip (English)", "Talo (English)"], { area: true, rows: 2 }) + inp("tip.so", ["Tip (Somali)", "Talo (Soomaali)"], { area: true, rows: 2 }) + "</section>";
        if (k === "scriptSo") return '<section class="le-sec"><div class="section-head"><h2>' + bx("Somali summary (optional)", "Soo koobid Soomaali ah (ikhtiyaari)") + "</h2></div>" + inp("scriptSo", ["What the conversation is about", "Wada-hadalku wuxuu ku saabsan yahay"], { area: true }) + "</section>";
        if (k === "questions") return questionsSection(["Questions (optional)", "Su’aalo (ikhtiyaari)"], ["Check what the learner understood.", "Hubi wixii ardaygu fahmay."]);
        return repeater(k);
      }).join("");
      return (
        EL.ui.topbar({ back: "content", title: esc(tx(arg === "new" ? "Add a lesson" : "Edit lesson", arg === "new" ? "Ku dar cashar" : "Wax ka beddel casharka")) }) +
        '<div class="le">' +
        '<section class="card pad le-main">' +
        select("level", ["Level", "Heerka"], levels) +
        select("type", ["Lesson type", "Nooca casharka"], types, "le-type") +
        inp("title", ["Lesson title (English)", "Cinwaanka casharka (English)"], { ph: "Greetings and Introductions" }) +
        inp("so", ["Lesson title (Somali)", "Cinwaanka casharka (Soomaali)"], { opt: true }) +
        inp("summary", ["Short description (English)", "Sharaxaad gaaban (English)"], { opt: true }) +
        inp("summarySo", ["Short description (Somali)", "Sharaxaad gaaban (Soomaali)"], { opt: true }) +
        inp("minutes", ["Minutes it takes", "Daqiiqadaha ay qaadanayso"], { num: true }) +
        "</section>" + parts +
        '<p class="field-err" id="le-err" role="alert"></p>' +
        '<div class="le-save"><button class="btn btn-primary btn-lg btn-block" data-action="le-save">' + EL.icon("check", 20) + esc(tx("Save lesson", "Keydi casharka")) + "</button>" +
        '<a class="btn btn-ghost btn-lg btn-block" href="#content">' + esc(t("common.cancel")) + "</a></div></div>"
      );
    }
  };

  EL.actions["le-save"] = () => {
    const r = lessonFromDraft(draft);
    if (r.err) { showError(r.err); return; }
    EL.api.saveLesson(r.ok);
    draft = null; draftFor = null;
    EL.ui.toast(tx("Lesson saved", "Casharka waa la keydiyay"));
    EL.app.go("content");
  };

  /* ───────── quiz question editor ───────── */
  S.quizedit = {
    tab: "profile",
    hideNav: true,
    render(id, ctx) {
      const quiz = EL.api.getQuiz(id);
      if (!quiz) return EL.ui.notFound();
      if (!ctx.refresh || draftFor !== "quiz-" + id) {
        draft = { questions: quiz.questions.map(qFromStored) };
        if (!draft.questions.length) draft.questions.push(blank.questions());
        draftFor = "quiz-" + id;
      }
      return (
        EL.ui.topbar({ back: "content", title: esc(quiz.title) }) +
        '<div class="le">' +
        '<p class="muted lead-line">' + bx(
          quiz.kind === "exam" ? "Questions for the mini exam. It has a 15 minute timer." : "Questions for this level quiz. Learners need 70% to pass.",
          quiz.kind === "exam" ? "Su’aalaha imtixaanka yar. Wuxuu leeyahay saacad 15 daqiiqo ah." : "Su’aalaha tijaabadan heerka. Ardaydu waxay u baahan yihiin 70% si ay u gudbaan."
        ) + "</p>" +
        questionsSection(["Questions", "Su’aalaha"]) +
        '<p class="field-err" id="le-err" role="alert"></p>' +
        '<div class="le-save"><button class="btn btn-primary btn-lg btn-block" data-action="qe-save" data-id="' + id + '">' + EL.icon("check", 20) + esc(tx("Save questions", "Keydi su’aalaha")) + "</button>" +
        '<a class="btn btn-ghost btn-lg btn-block" href="#content">' + esc(t("common.cancel")) + "</a></div></div>"
      );
    }
  };

  EL.actions["qe-save"] = (el) => {
    // an untouched empty card is simply left out
    const filled = draft.questions.filter((q) => clean(q.q) || q.o.some(clean) || clean(q.answers));
    const r = questionsToStored(filled);
    if (r.err) { showError(r.err); return; }
    EL.api.setQuizQuestions(el.dataset.id, r.ok);
    draft = null; draftFor = null;
    EL.ui.toast(tx("Questions saved", "Su’aalaha waa la keydiyay"));
    EL.app.go("content");
  };
})((window.EL = window.EL || {}));

</script>
<script>
/* Admin sign-in. The admin is the person who adds lessons (see content.js).
   Phase 1 has no server, so this is only a local lock: the first time, the admin creates a password;
   after that the same password is needed. Students never see the admin screens.

<script>
/* Admin: who joined the app and how far each student has got.
   students          summary numbers + the list of students
   student-<id>      one student: lessons finished, quiz results, remove
   Phase 1 reads the students who signed up on this device (EL.api.getStudents). Phase 2: the same screens, fed by the server. */
(function (EL) {
  const S = (EL.screens = EL.screens || {});
  const esc = EL.esc, t = EL.t;
  const tx = (en, so) => (EL.lang() === "so" ? so : en);
  const bx = (en, so) => {
    const l = EL.lang();
    if (l === "so") return "<span>" + esc(so) + "</span>";
    if (l === "en") return "<span>" + esc(en) + "</span>";
    return '<span class="bi"><span>' + esc(en) + '</span><span class="so sub">' + esc(so) + "</span></span>";
  };
  const date = (k) => (k ? EL.fmtDate(k) : "–");
  const lastSeen = (k) => {
    if (!k) return tx("Not yet", "Weli");
    if (k === EL.dayKey()) return tx("Today", "Maanta");
    if (k === EL.addDays(EL.dayKey(), -1)) return tx("Yesterday", "Shalay");
    return EL.fmtDate(k);
  };

  // With a server the list comes from there: load it when the screen opens (at most every few seconds).
  EL.loadStudentsOnce = () => {
    if (!EL.cloud.enabled() || !EL.cloud.hasSession()) return;
    const s = EL.cloud.studentsState();
    if (s.loading || (s.at && Date.now() - s.at < 4000)) return;
    EL.cloud.loadStudents().then(() => EL.app.refresh());
  };
  const serverNote = () => {
    if (!EL.cloud.enabled()) return "";
    const s = EL.cloud.studentsState();
    if (s.error) return '<div class="notice bad"><p>' + esc(t(s.error === "network" ? "err.network" : "err.server")) + "</p></div>";
    if (!s.at) return '<p class="muted">' + esc(tx("Loading…", "Waa la soo rarayaa…")) + "</p>";
    return "";
  };

  S.students = {
    tab: "profile",
    hideNav: true,
    mount() { EL.loadStudentsOnce(); },
    render() {
      const sm = EL.api.getStudentSummary();
      const list = EL.api.getStudents();
      const stat = (v, label, so) => '<div class="st-stat"><b>' + esc(v) + "</b><span>" + esc(tx(label, so)) + "</span></div>";
      const row = (x) =>
        '<a class="st-row" href="#student-' + x.id + '"><span class="avatar">' + esc(EL.initials(x.name)) + "</span>" +
        '<span class="st-body"><b>' + esc(x.name) + "</b><small>" + esc(x.email) + "</small>" +
        EL.ui.bar(x.pct) +
        "<small>" + esc(tx(x.done + " of " + x.total + " lessons finished", x.done + " ka mid ah " + x.total + " cashar oo la dhammeeyay")) + " · " + esc(tx("joined", "ku biiray")) + " " + esc(date(x.joined)) + "</small></span>" +
        '<span class="st-pct">' + x.pct + "%</span></a>";
      return (
        EL.ui.topbar({ back: "content", title: esc(tx("Students", "Ardayda")) }) +
        '<div class="st-grid">' +
        stat(sm.count, "Students joined", "Ardayda ku biiray") +
        stat(sm.completions, "Lessons finished", "Casharro la dhammeeyay") +
        stat(sm.avgPct + "%", "Average progress", "Celceliska horumarka") +
        stat(sm.activeWeek, "Active this week", "Firfircoon todobaadkan") + "</div>" +
        (EL.cloud.enabled()
          ? serverNote()
          : '<p class="muted st-note">' + bx(
            "Shows the students who signed up on this phone. Connect a server (Admin panel > Server) to see students from every phone.",
            "Waxay muujisaa ardayda ku diiwaangashay taleefankan. Xiir server (Admin panel > Server) si aad u aragto ardayda taleefan kasta."
          ) + "</p>") +
        (list.length
          ? '<div class="st-list">' + list.map(row).join("") + "</div>"
          : '<section class="card st-empty"><div class="empty-art">' + EL.icon("user", 36) + "</div><p>" + bx("No students have signed up yet.", "Weli arday ma is-diiwaangelin.") + "</p></section>")
      );
    }
  };

  S.student = {
    tab: "profile",
    hideNav: true,
    mount() { EL.loadStudentsOnce(); },
    render(id) {
      const d = EL.api.getStudentDetail(id);
      if (!d) return EL.cloud.enabled() && !EL.cloud.studentsState().at ? '<p class="muted">' + esc(tx("Loading…", "Waa la soo rarayaa…")) + "</p>" : EL.ui.notFound();
      const stat = (v, label, so) => '<div class="st-stat"><b>' + esc(v) + "</b><span>" + esc(tx(label, so)) + "</span></div>";
      // lessons grouped by level, in the level order
      const groups = EL.api.getLevels().map((lv) => {
        const ls = d.lessons.filter((l) => l.level === lv.id);
        if (!ls.length) return "";
        const n = ls.filter((l) => l.doneOn).length;
        return '<section class="card st-level"><div class="cm-head"><h2>' + esc(lv.title) + ' <span class="tag-soft">' + n + " / " + ls.length + "</span></h2></div>" +
          '<ul class="cm-list">' + ls.map((l) =>
            '<li class="st-lesson' + (l.doneOn ? " is-done" : "") + '"><span class="st-tick">' + (l.doneOn ? EL.icon("check", 16) : "") + "</span>" +
            '<span class="cm-body"><b>' + esc(l.title) + "</b><small>" + esc(t("type." + l.type)) + "</small></span>" +
            "<small>" + (l.doneOn ? esc(date(l.doneOn)) : esc(tx("Not done", "Lama dhammayn"))) + "</small></li>").join("") + "</ul></section>";
      }).join("");
      const quiz = d.quizzes.length
        ? '<section class="card st-level"><div class="cm-head"><h2>' + bx("Quiz results", "Natiijooyinka tijaabada") + '</h2></div><ul class="cm-list">' +
          d.quizzes.map((q) => '<li class="st-lesson"><span class="cm-body"><b>' + esc(q.title) + "</b><small>" + esc(date(q.date)) + "</small></span><b>" + q.score + " / " + q.total + " · " + q.pct + "%</b></li>").join("") + "</ul></section>"
        : "";
      return (
        EL.ui.topbar({ back: "students", title: esc(d.name) }) +
        '<section class="card st-head"><span class="avatar big">' + esc(EL.initials(d.name)) + "</span>" +
        "<div><h2>" + esc(d.name) + '</h2><p class="muted">' + esc(d.email) + "</p>" +
        '<p class="muted">' + esc(tx("Joined", "Ku biiray")) + " " + esc(date(d.joined)) + " · " + esc(tx("Last active", "Markii ugu dambeysay")) + ": " + esc(lastSeen(d.lastSeen)) + "</p></div></section>" +
        '<div class="st-grid">' +
        stat(d.done + " / " + d.total, "Lessons finished", "Casharro la dhammeeyay") +
        stat(d.pct + "%", "Progress", "Horumar") +
        stat(d.avgScore === null ? "–" : d.avgScore + "%", "Quiz average", "Celceliska tijaabada") +
        stat(d.streak, "Day streak", "Maalmaha isku xigta") + "</div>" +
        '<div class="cm-grid">' + groups + quiz + "</div>" +
        '<button class="btn btn-danger-ghost btn-lg btn-block st-remove" data-action="student-remove" data-id="' + d.id + '">' + EL.icon("trash", 18) + esc(tx("Remove this student", "Ka saar ardaygan")) + "</button>"
      );
    }
  };

  EL.actions["student-remove"] = (el) => {
    const id = el.dataset.id;
    EL.ui.modal({
      title: tx("Remove this student?", "Ma ka saaraysaa ardaygan?"),
      body: tx("The account and all of the student's progress are deleted.", "Akoonka iyo horumarka ardayga oo dhan waa laga tirtirayaa qalabkan."),
      confirm: tx("Remove", "Ka saar"), danger: true,
      onConfirm: () => {
        Promise.resolve(EL.api.removeStudent(id)).then((r) => {
          if (r && r.ok === false) { EL.ui.toast(t(r.error === "network" ? "err.network" : "err.server")); return; }
          EL.ui.toast(tx("Student removed", "Ardayga waa laga saaray"));
          EL.app.go("students");
        });
      }
    });
  };
})((window.EL = window.EL || {}));

</script>
